function resample(points,count) {
  const dense=[];
  for(let i=0;i<points.length-1;i++){
    const a=points[Math.max(0,i-1)],b=points[i],c=points[i+1],d=points[Math.min(points.length-1,i+2)];
    for(let k=0;k<10;k++){const t=k/10;dense.push([0,1].map(j=>.5*(2*b[j]+(c[j]-a[j])*t+(2*a[j]-5*b[j]+4*c[j]-d[j])*t*t+(-a[j]+3*b[j]-3*c[j]+d[j])*t*t*t)));}
  }
  dense.push(points.at(-1));const lengths=[0];
  for(let j=1;j<dense.length;j++)lengths.push(lengths[j-1]+Math.hypot(dense[j][0]-dense[j-1][0],dense[j][1]-dense[j-1][1]));
  let j=0;
  return Array.from({length:count},(_,k)=>{const target=lengths.at(-1)*k/(count-1);while(j<lengths.length-2&&lengths[j+1]<target)j++;const v=(target-lengths[j])/(lengths[j+1]-lengths[j]||1);return [dense[j][0]*(1-v)+dense[j+1][0]*v,dense[j][1]*(1-v)+dense[j+1][1]*v];});

    const slack=(.5+.5*Math.sin(lane*2.8))*.062, finish=(.5+.5*Math.cos(lane*1.9))*.054;

    const at=Math.floor(q),v=q-at,[x,y]=[0,1].map(k=>points[at][k]*(1-v)+points[at+1][k]*v);
    const f=i/(points.length-1),a=points[Math.max(0,i-1)],b=points[Math.min(points.length-1,i+1)],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;
    const widen=amplitude*(10.4+4.4*Math.sin(f*11+phase)+3.8*Math.cos(f*23-phase*.7));

];

// The library controls its sandboxed preview through messages. Standalone pages
// manage their own interactions. The clipboard and download omit this bridge.
(() => {
  if (window.parent === window) return;
  let running = null;
  let lastPage = "";
  function reportSlide() {
    const page = new URLSearchParams(location.search).get("slide") || "1";
    if (page === lastPage) return;
    lastPage = page;
    window.parent.postMessage({type:"motherlode-slide", slide:Number(page)}, "*");
  }
  window.addEventListener("message", event => {
    if (event.source !== window.parent || event.data?.type !== "motherlode-player") return;
    const {action, value} = event.data;
    if (action === "pause" && running === null) {
      running = document.getAnimations().filter(track => track.playState === "running" || track.pending);
      running.forEach(track => track.pause());
    } else if (action === "resume" && running !== null) {
      running.forEach(track => { if (track.playState === "paused") track.play(); });
      running = null;
    } else if (action === "palette" && /^[a-z0-9-]+$/.test(value) && location.hash.slice(1) !== value) {
      window.location.replace("#" + value);
    }
  });
  window.addEventListener("load", reportSlide);
  window.addEventListener("popstate", reportSlide);
  for (const event of ["click","keydown"]) {
    window.addEventListener(event, () => setTimeout(reportSlide, 0));
  }
})();
