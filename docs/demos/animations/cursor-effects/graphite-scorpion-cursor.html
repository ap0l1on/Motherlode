  <svg viewBox="0 0 576 346" role="img" aria-labelledby="art-title description" xmlns="http://www.w3.org/2000/svg">
    <title id="art-title">Graphite scorpion cursor</title>
    <desc id="description">A graphite wire creature curves across black. A sequence of narrow rib hoops, articulated legs and paired pincers turns toward the pointer.</desc>
  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 9.6 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    function line(parent, data, color, width = 1, opacity = 1) {
      return element("path", {d: data, fill: "none", stroke: "var(--" + color + ")",
        "stroke-width": width, "stroke-linejoin": "round", "stroke-linecap": "round", opacity}, parent);
    }

    const rig=element("g",{}), poses=[[.66,.70],[.42,.46],[.63,.29],[.79,.51],[.52,.72],[.32,.56],[.66,.70]];
    function where(t){
      const count=poses.length-1,f=(1+t%1)%1*count,i=Math.floor(f),v=f-i;
      const a=poses[(i+count-1)%count],b=poses[i],c=poses[(i+1)%count],d=poses[(i+2)%count];
      return [0,1].map(k=>(k?346:576)*.5*(2*b[k]+(c[k]-a[k])*v+(2*a[k]-5*b[k]+4*c[k]-d[k])*v*v+(-a[k]+3*b[k]-3*c[k]+d[k])*v*v*v));
    }
    const time=()=>headTrack.currentTime||0;
    function segment(index){
      const frac=index/45, lag=.0084*index, node=element("g",{},rig);
      const radius=2.4+15.8*Math.exp(-Math.pow((frac-.24)/.23,2))+6.4*Math.exp(-Math.pow((frac-.53)/.26,2));
      element("ellipse",{cx:0,cy:0,rx:5.1*(1-frac*.67),ry:radius,fill:"none",stroke:"var(--middle)","stroke-width":.86,opacity:.87},node);
      line(node,"M-2 "+(-radius*.85)+"L5 "+(-radius*.67)+"M-2 "+(radius*.85)+"L5 "+(radius*.67),"bright",.69,.83);
      line(node,"M-5 0L4 0","shade",.78,.74);
      if(index<17&&index%4===0){
        for(const sign of [-1,1]){
          const leg=element("g",{transform:"scale(1 "+sign+")"},node);
          line(leg,"M1 7L-9 21L3 37L-5 46","bright",.97,.87);element("circle",{cx:-5,cy:46,r:1.4,fill:"var(--highlight)"},leg);
        }
      }
      if(index===0){
        for(const sign of [-1,1]){
          const jaw=element("g",{transform:"scale(1 "+sign+")"},node);
          line(jaw,"M-4 6L10 15L25 14L32 9M24 14L32 16M11 15L20 20","bright",1.05,.92);
        }
      }
      const track=Array.from({length:99},(_,i)=>{
        const t=i/98-lag,p=where(t),next=where(t+.002),a=Math.atan2(next[1]-p[1],next[0]-p[0]);
        const co=Math.cos(a),si=Math.sin(a);
        return {transform:"matrix("+[co,si,-si,co,p[0],p[1]].join(",")+")"};
      });
      return node.animate(track,{duration,iterations:Infinity,easing:"linear"});
    }
    const headTrack=segment(0);for(let i=1;i<=45;i++)segment(i);
    drawing.addEventListener("pointermove",e=>{const p=where(time()/duration);rig.setAttribute("transform","translate("+(e.offsetX-p[0])+" "+(e.offsetY-p[1])+")");});
    drawing.addEventListener("pointerleave",()=>rig.removeAttribute("transform"));

    })();
  </script>
  <script>
    const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
    pick();
    addEventListener("hashchange", pick);
    const t = new URLSearchParams(location.search).get("t");
    if (t !== null) {
      const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = Number(t) * 1000; });
      freeze();
      addEventListener("load", freeze);
    }
  </script>

<script data-motherlode-player>
// The library controls its sandboxed preview through messages. Standalone pages
// manage their own interactions. The clipboard and download omit this bridge.
(() => {
  if (window.parent === window) return;
  let running = null;
  let lastPage = "";
  function reportSlide() {
    const page = new URLSearchParams(location.search).get("slide") || "1";
    if (page === lastPage) return;
    lastPage = page;
    window.parent.postMessage({type:"motherlode-slide", slide:Number(page)}, "*");
  }
  window.addEventListener("message", event => {
    if (event.source !== window.parent || event.data?.type !== "motherlode-player") return;
    const {action, value} = event.data;
    if (action === "pause" && running === null) {
      running = document.getAnimations().filter(track => track.playState === "running" || track.pending);
      running.forEach(track => track.pause());
    } else if (action === "resume" && running !== null) {
      running.forEach(track => { if (track.playState === "paused") track.play(); });
      running = null;
    } else if (action === "palette" && /^[a-z0-9-]+$/.test(value) && location.hash.slice(1) !== value) {
      window.location.replace("#" + value);
    }
  });
  window.addEventListener("load", reportSlide);
  window.addEventListener("popstate", reportSlide);
  for (const event of ["click","keydown"]) {
    window.addEventListener(event, () => setTimeout(reportSlide, 0));
  }
})();
</script>
