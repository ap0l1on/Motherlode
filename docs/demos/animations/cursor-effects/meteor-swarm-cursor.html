  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 12.5 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    const tau = 2 * Math.PI;
    let seed = 77216;
    function random() {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    function line(parent, data, color, width = 1, opacity = 1) {
      return element("path", {d: data, fill: "none", stroke: "var(--" + color + ")",
        "stroke-width": width, "stroke-linejoin": "round", "stroke-linecap": "round", opacity}, parent);
    }

    const cx=286,cy=184, colors=["middle","bright","highlight","bright"], swarm=element("g",{});
    const centers=[[159,193],[259,222],[396,239],[228,118],[345,258],[391,297],[159,193]];
    function at(f) {
      f=(f%1+1)%1;const t=f*(centers.length-1),i=Math.floor(t),p=t-i,s=p*p*(3-2*p),a=centers[i],b=centers[i+1];
      return [a[0]+(b[0]-a[0])*s,a[1]+(b[1]-a[1])*s];
    }
    const follow=element("g",{},swarm);
    for(let i=0;i<15;i++){
      const fan=element("g",{},follow),data=[[],[],[],[]];
      for(let j=0;j<61;j++){
        const a=tau*random(), r=6+random()**1.5*171;
        const x=Math.cos(a)*r*1.33,y=Math.sin(a)*r*.61,len=2+random()*15;
        data[j%4].push("M"+x.toFixed(1)+" "+y.toFixed(1)+"l"+(len*Math.cos(a)).toFixed(1)+" "+(len*Math.sin(a)).toFixed(1));
      }
      data.forEach((set,k)=>line(fan,set.join(""),colors[k],.74+(i%2)*.28,.42+.43*(1-i/15)));
      const frames=Array.from({length:75},(_,j)=>{const f=j/74,p=at(f-.0035*i);return {transform:"translate("+p[0]+"px,"+p[1]+"px) rotate("+10*Math.sin(tau*f+i*.10)+"deg)"};});
      fan.animate(frames,{duration,iterations:Infinity,easing:"linear"});
    }
    const head=element("g",{},follow);
    for(let i=0;i<14;i++) {
      const el=element("ellipse",{rx:4.8+.50*i,ry:4.1+.29*i,fill:"none",stroke:"var(--"+colors[i%4]+")",
        "stroke-width":.68,transform:"translate("+(-i*.93)+" "+(Math.sin(i*.74)*2.8)+") rotate("+(-34+i*6)+")",opacity:.85-i*.035},head);
    }
    head.animate(Array.from({length:75},(_,j)=>{const p=at(j/74);return {transform:"translate("+p[0]+"px,"+p[1]+"px)"};}),{duration,iterations:Infinity,easing:"linear"});
    drawing.addEventListener("pointermove",event=>{
      const r=drawing.getBoundingClientRect(), p=at(((head.getAnimations()[0].currentTime||0)/duration)%1);
      swarm.setAttribute("transform","translate("+(event.clientX-r.left-p[0])+" "+(event.clientY-r.top-p[1])+")");
    });
    drawing.addEventListener("pointerleave",()=>swarm.removeAttribute("transform"));

    })();
  </script>

(() => {
  if (window.parent === window) return;
  let running = null;
  let lastPage = "";
  function reportSlide() {
    const page = new URLSearchParams(location.search).get("slide") || "1";
    if (page === lastPage) return;
    lastPage = page;
    window.parent.postMessage({type:"motherlode-slide", slide:Number(page)}, "*");
  }
  window.addEventListener("message", event => {
    if (event.source !== window.parent || event.data?.type !== "motherlode-player") return;
    const {action, value} = event.data;
    if (action === "pause" && running === null) {
      running = document.getAnimations().filter(track => track.playState === "running" || track.pending);
      running.forEach(track => track.pause());
    } else if (action === "resume" && running !== null) {
      running.forEach(track => { if (track.playState === "paused") track.play(); });
      running = null;
    } else if (action === "palette" && /^[a-z0-9-]+$/.test(value) && location.hash.slice(1) !== value) {
      window.location.replace("#" + value);
    }
  });
  window.addEventListener("load", reportSlide);
  window.addEventListener("popstate", reportSlide);
  for (const event of ["click","keydown"]) {
    window.addEventListener(event, () => setTimeout(reportSlide, 0));
  }
})();
