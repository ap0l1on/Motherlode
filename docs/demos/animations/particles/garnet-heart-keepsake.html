  <svg viewBox="0 0 576 370" role="img" aria-labelledby="art-title description" xmlns="http://www.w3.org/2000/svg">
    <title id="art-title">Garnet heart keepsake</title>
    <desc id="description">A faceted garnet heart floats inside a larger heart made of tiny pink lights, beneath a small dedication on a wine-colored field.</desc>
  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 13.5 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    const tau = 2 * Math.PI;
    let seed = 77216;
    function random() {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    function pointsPath(points, close = false) {
      return points.length ? "M" + points.map(p => p[0].toFixed(2) + " " + p[1].toFixed(2)).join("L") + (close ? "Z" : "") : "";

    function line(parent, data, color, width = 1, opacity = 1) {
      return element("path", {d: data, fill: "none", stroke: "var(--" + color + ")",

    }
    function radial(defs, id, stops) {
      const gradient = element("radialGradient", {id}, defs);
      for (const [offset, color, opacity] of stops) element("stop", {
        offset, "stop-color": "var(--" + color + ")", "stop-opacity": opacity}, gradient);
      return "url(#" + id + ")";
    }

    const cx=288,cy=184,defs=element("defs",{}),frame=element("g",{});
    const sky=radial(defs,"wine-sky",[[0,"shade",.84],[.65,"background",1],[1,"background",1]]);
    element("rect",{width:576,height:370,fill:sky});
    const notes=element("text",{x:288,y:36,fill:"var(--label)","font-family":"system-ui, sans-serif","font-size":11.3,"font-weight":700,"text-anchor":"middle"});notes.textContent="this is for you";
    drawing.append(frame);
    const glints=[[],[],[],[]];
    for(let i=0;i<2300;i++){
      const a=tau*random(),x=16*Math.sin(a)**3,y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));
      const fuzz=(random()-.5)*(random()>.69?16:5),px=cx+x*8.2+fuzz,py=cy+y*8.53+(random()-.5)*(random()>.8?19:4);
      glints[i%4].push("M"+px.toFixed(1)+" "+py.toFixed(1)+"h.15");
    }
    glints.forEach((p,i)=>line(frame,p.join(""),["shade","middle","bright","highlight"][i],i%3?1.12:1.5,.59+i*.10));
    const seeds=[];for(let i=0;i<138;i++)seeds.push("M"+(random()*576).toFixed(1)+" "+(random()*370).toFixed(1)+"h.12");
    line(frame,seeds.join(""),"bright",1.52,.67);
    const gem=element("g",{transform:"translate("+cx+" "+(cy+15)+")"},frame);
    function pt(x,y){return [x,y];}
    const outline=[pt(0,-9),[-6,-16],[-15,-19],[-24,-15],[-29,-6],[-27,5],[-20,14],[0,30],[21,13],[28,5],[29,-6],[23,-16],[15,-19],[6,-16]];
    const inner=[[-9,-8],[9,-8],[0,9],[-16,2],[16,2]];
    const faces=[[0,1,14],[1,2,14],[2,3,14],[3,4,17],[4,5,17],[5,6,17],[6,7,16],[7,8,16],[8,9,18],[9,10,18],[10,11,15],[11,12,15],[12,13,15],[13,0,15],[0,14,16],[0,16,15],[14,17,16],[17,6,16],[18,8,16],[15,16,18],[3,17,14],[10,15,18]];
    const vertices=[...outline,...inner];faces.forEach((indices,i)=>element("path",{d:pointsPath(indices.map(k=>vertices[k]),true),
      fill:"var(--"+["bright","middle","leaf","bright","shade","leaf","middle"][i%7]+")",stroke:"none"},gem));
    const gleam=radial(defs,"gem-depth",[[0,"shade",.79],[.35,"shade",.48],[.67,"bright",.18],[1,"highlight",.37]]);
    element("path",{d:pointsPath(outline,true),fill:gleam},gem);
    frame.style.transformOrigin=cx+"px "+(cy+8)+"px";
    frame.animate([{offset:0,transform:"scale(.88)"},{offset:.16,transform:"scale(1.12)"},
      {offset:.37,transform:"scale(2.58)"},{offset:.56,transform:"scale(2.36)"},{offset:.68,transform:"scale(2.86)"},
      {offset:.86,transform:"scale(1.02)"},{offset:1,transform:"scale(.88)"}],{duration,iterations:Infinity,easing:"ease-in-out"});

    })();

// The library controls its sandboxed preview through messages. Standalone pages

(() => {
  if (window.parent === window) return;
  let running = null;
  let lastPage = "";
  function reportSlide() {
    const page = new URLSearchParams(location.search).get("slide") || "1";
    if (page === lastPage) return;
    lastPage = page;
    window.parent.postMessage({type:"motherlode-slide", slide:Number(page)}, "*");
  }
  window.addEventListener("message", event => {
    if (event.source !== window.parent || event.data?.type !== "motherlode-player") return;
    const {action, value} = event.data;
    if (action === "pause" && running === null) {
      running = document.getAnimations().filter(track => track.playState === "running" || track.pending);
      running.forEach(track => track.pause());
    } else if (action === "resume" && running !== null) {
      running.forEach(track => { if (track.playState === "paused") track.play(); });
      running = null;
    } else if (action === "palette" && /^[a-z0-9-]+$/.test(value) && location.hash.slice(1) !== value) {
      window.location.replace("#" + value);
    }
  });
  window.addEventListener("load", reportSlide);
  window.addEventListener("popstate", reportSlide);
  for (const event of ["click","keydown"]) {
    window.addEventListener(event, () => setTimeout(reportSlide, 0));
  }
})();
