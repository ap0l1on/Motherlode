[data-colorway="light"] { --background: #fcf6f1; --shade: #78253d; --middle: #a13955; --bright: #b85a76; --highlight: #e39394; --leaf: #2a6651; }

  <svg viewBox="0 0 576 414" role="img" aria-labelledby="art-title description" xmlns="http://www.w3.org/2000/svg">
    <title id="art-title">Midnight firework rings</title>
    <desc id="description">Fine points of light burst into rings, small hearts and starbursts over a quiet violet haze.</desc>
  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 6 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    const tau = 2 * Math.PI;
    let seed = 77216;
    function random() {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    function pointsPath(points, close = false) {
      return points.length ? "M" + points.map(p => p[0].toFixed(2) + " " + p[1].toFixed(2)).join("L") + (close ? "Z" : "") : "";
    }
    function line(parent, data, color, width = 1, opacity = 1) {
      return element("path", {d: data, fill: "none", stroke: "var(--" + color + ")",
        "stroke-width": width, "stroke-linejoin": "round", "stroke-linecap": "round", opacity}, parent);
    }
    function radial(defs, id, stops) {
      const gradient = element("radialGradient", {id}, defs);
      for (const [offset, color, opacity] of stops) element("stop", {
        offset, "stop-color": "var(--" + color + ")", "stop-opacity": opacity}, gradient);
      return "url(#" + id + ")";
    }

    const defs=element("defs",{}),field=element("g",{});
    const smoke=radial(defs,"cloud",[[0,"shade",.44],[.54,"shade",.23],[1,"background",0]]);
    for(let j=0;j<6;j++)element("ellipse",{cx:138+j*53,cy:161+14*Math.sin(j),rx:119,ry:92,fill:smoke},field);
    const tones=["bright","leaf","highlight","middle"];
    function shell(x,y,r,style,tone,begin){
      const launch=line(field,"M"+(x-20)+" 408Q"+(x-3)+" 286 "+x+" "+y,tone,1.4,.68);
      launch.setAttribute("pathLength",1);launch.setAttribute("stroke-dasharray",".08 .92");
      launch.animate([{offset:0,opacity:0,strokeDashoffset:0},{offset:begin,opacity:0,strokeDashoffset:.09},
        {offset:begin+.04,opacity:.8,strokeDashoffset:0},{offset:begin+.15,opacity:0,strokeDashoffset:-.93},{offset:1,opacity:0,strokeDashoffset:-.93}],{duration,iterations:Infinity});
      const star=element("g",{transform:"translate("+x+" "+y+")"},field),burst=element("g",{},star);
      const halo=radial(defs,"b"+x+"-"+y,[[0,tone,.64],[.34,tone,.21],[1,tone,0]]);
      element("circle",{r:r*.86,fill:halo},burst);
      const dots=[[],[]];const n=style==="ring"?74:style==="heart"?81:230;
      for(let i=0;i<n;i++){
        const a=i*tau/n;let size=r*(style==="spray"?Math.sqrt(random()):.95+random()*.05);
        let dx=size*Math.cos(a),dy=size*Math.sin(a);
        if(style==="heart"){dx=r*Math.sin(a)**3;dy=-r*.067*(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));}
        if(style==="flower")size*=.46+.54*Math.cos(6*a)**2;
        if(style==="flower"){dx=size*Math.cos(a);dy=size*Math.sin(a);}
        dots[i%2].push("M"+dx.toFixed(2)+" "+dy.toFixed(2)+"l"+(dx*.026).toFixed(2)+" "+(dy*.026).toFixed(2));
        if(style==="spray"&&i%4===0)line(burst,pointsPath([[dx*.34,dy*.34],[dx*.70,dy*.70],[dx,dy+3]]),tone,1.03,.91);
      }
      dots.forEach((p,j)=>line(burst,p.join(""),j?tone:"highlight",j?1.85:1.48,.94));
      const at=begin+.14;
      burst.animate([{offset:0,transform:"scale(.02)",opacity:0},{offset:at,transform:"scale(.02)",opacity:0},
        {offset:at+.025,transform:"scale(.17)",opacity:1},{offset:at+.16,transform:"scale(.91)",opacity:.96},
        {offset:Math.min(.985,at+.28),transform:"translateY(7px) scale(1.08)",opacity:0},{offset:1,opacity:0}],{duration,iterations:Infinity});
    }
    [[282,171,33,"ring",0],[345,135,26,"ring",.035],[211,175,39,"ring",.13],[384,150,42,"flower",.18],
      [256,143,76,"spray",.21],[336,164,67,"spray",.29],[201,148,54,"spray",.45],
      [348,141,64,"spray",.47],[129,138,29,"heart",.57],[257,183,45,"ring",.58],
      [377,173,61,"spray",.58]].forEach(([x,y,r,s,t],j)=>shell(x,y,r,s,tones[j%4],t));

    })();
  </script>
  <script>
    const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
    pick();
    addEventListener("hashchange", pick);
    const t = new URLSearchParams(location.search).get("t");
    if (t !== null) {
      const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = Number(t) * 1000; });
      freeze();
      addEventListener("load", freeze);
    }
  </script>

(() => {
  if (window.parent === window) return;
  let running = null;
  let lastPage = "";
  function reportSlide() {
    const page = new URLSearchParams(location.search).get("slide") || "1";
    if (page === lastPage) return;
    lastPage = page;
    window.parent.postMessage({type:"motherlode-slide", slide:Number(page)}, "*");
  }
  window.addEventListener("message", event => {
    if (event.source !== window.parent || event.data?.type !== "motherlode-player") return;
    const {action, value} = event.data;
    if (action === "pause" && running === null) {
      running = document.getAnimations().filter(track => track.playState === "running" || track.pending);
      running.forEach(track => track.pause());
    } else if (action === "resume" && running !== null) {
      running.forEach(track => { if (track.playState === "paused") track.play(); });
      running = null;
    } else if (action === "palette" && /^[a-z0-9-]+$/.test(value) && location.hash.slice(1) !== value) {
      window.location.replace("#" + value);
    }
  });
  window.addEventListener("load", reportSlide);
  window.addEventListener("popstate", reportSlide);
  for (const event of ["click","keydown"]) {
    window.addEventListener(event, () => setTimeout(reportSlide, 0));
  }
})();
