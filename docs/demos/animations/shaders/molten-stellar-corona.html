<script type="text/plain" id="drawing">
const tau = Math.PI * 2;
const clamp = (v,a=0,b=1) => Math.min(b,Math.max(a,v));
const smooth = v => { v=clamp(v); return v*v*(3-2*v); };
const lerp = (a,b,t) => a+(b-a)*t;
function channels(col) {
  const s=String(col).trim(); if(s.startsWith('#')){const h=s.slice(1);return (h.length===3?[...h].map(c=>c+c):h.match(/../g)).slice(0,3).map(v=>parseInt(v,16));}

const lattice = Float32Array.from({length:8192},(_,i)=>number(i*.73+173));

function draw(c,w,h,t,p,controls) {
  c.fillStyle=p.bg;c.fillRect(0,0,w,h);
  const r=segment(t,[[0,57],[1.5,67],[3,55],[5.15,57],[6.6,145],[8,168],[9.6,163],[10.7,103],[12.6,79],[14.5,68],[16.2,72],[18.75,70]])*(1+controls[1]*.5);
  const x=w*.5+controls[0]*14,y=h*.50;
  const fiery=(a,b,z)=>Math.sin(a*3.7+z*.73)*.39+Math.sin(a*6.8-b*4.7-z*.84)*.25+Math.cos(b*5.7+a*2.9+z*.43)*.22+Math.sin(a*12.3+b*11.8-z*.92)*.14;

    if(crest>.5&&v>.4){c.fillStyle=alpha(p.c,crest*.6);c.fillRect(x+xx,y+yy,pixel+.2,pixel+.2);}
  }
  const twist=t*.40;
  for(let band=0;band<104;band++){
    const shell=band%4===0?1.35:1.0,lat=-1.48+(band%62)*.0486, seed=number(band+23);
    const lines=[];for(let j=0;j<=62;j++){
      const angle=j/62*tau+twist+seed*.42;
      const phi=lat+.083*Math.sin(angle*3+band*.21+t*.6)+.045*Math.cos(angle*8+band*.23);
      let q=point(angle,phi,shell,t*.47+band*.025);lines.push(q);

    stroke(c,lines,alpha(tint,shell>1?.043+seed*.065:.055+seed*.10),r*(shell>1?.005:.015)+.22);
  }
  for(let band=0;band<24;band++){
    const ring=[];const k=.84+.075*Math.sin(band*.89+t*.72)+band*.006;
    for(let i=0;i<=110;i++){const ang=i/110*tau;const bump=fiery(Math.cos(ang)*2.8,Math.sin(ang)*1.8,t*.51+band*.042);const rad=r*(k+.12*bump+.036*Math.sin(ang*11+t+band*.07));ring.push([x+rad*Math.cos(ang),y+rad*Math.sin(ang)]);}
    stroke(c,ring,alpha(mix(p.b,p.c,.55+band*.012),.10+band*.006),r*.020+.35);
  }
  const flank=segment(t,[[0,.3],[1.7,.95],[3,.2],[5.4,.1],[7,.1],[9.5,.17],[12.3,1],[14.1,.45],[17.8,1],[18.75,.6]]);
  const ax=x+r*.68*Math.cos(t*.82-.4),ay=y+r*.54*Math.sin(t*.82-.4);
  glow(c,ax,ay,r*(.47+flank*.29),[[0,alpha(p.paper,.83*flank)],[.32,alpha(p.c,.62*flank)],[.6,alpha(p.d,.54*flank)],[1,alpha(p.b,0)]]);
  for(let i=0;i<2700;i++){const a=number(i*3+1)*tau;const sr=number(i*3+2),nn=fiery(Math.cos(a)*2.5,Math.sin(a)*2.2,t*.48);const q=r*(1.06+.57*sr+.17*nn+.08*Math.sin(a*11+t));const hot=.25+.75*Math.max(0,Math.sin(3*a+t*.8+nn*2.7));const px=x+Math.cos(a)*q,py=y+Math.sin(a)*q;const sz=(.2+number(i+440)*1.15)*(r/90);c.fillStyle=alpha(mix(p.c,p.paper,number(i+77)),hot*(.51+.47*number(i+443)));c.fillRect(px,py,sz,sz);}
  glow(c,x+r*.025,y-r*.028,r*.39,[[0,p.paper],[.27,alpha(p.paper,.98)],[.45,alpha(p.c,.91)],[.74,alpha(p.b,.39)],[1,alpha(p.b,0)]]);

<script>
const stage = document.querySelector('main');
const duration = Number(document.querySelector('[name="motherlode:loop"]').content);
const motion = [];
function animate(target, keys, options = {}) {
  if (typeof target === 'string') target = document.querySelector(target);
  const list = keys.map(([time, value]) => ({ offset: time / duration, ...value }));
  const effect = target.animate(list, { duration: duration * 1000, iterations: Infinity, fill: 'both', easing: 'linear', ...options });
  motion.push(effect);
  return effect;
}
function hold(seconds) {
  for (const effect of motion) { effect.pause(); effect.currentTime = Math.max(0,Math.min(duration - .001,seconds)) * 1000; }
}
function replay() {
  for (const effect of motion) { effect.currentTime = 0; effect.play(); }
}
function bind(element, callback) {
  element.addEventListener('click', callback);
  element.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); callback(event); }
  });
}

const picture = document.querySelector('#render');
const source = document.querySelector('#drawing').textContent;
const names = ['bg','ink','shadow','paper','ash','metal','edge','a','b','c','d','e','f',];

const props = ['--scene-time','--control-x','--control-y','--choice', ...names.map(v=>'--'+v)];
const readColors = getter => Object.fromEntries(names.map(name=>[name,String(getter('--'+name)).trim()]));
const readControls = getter => ['--control-x','--control-y','--choice'].map(name=>Number(String(getter(name)).trim()) || 0);
const paintFallback = new Function(source+';return draw;')();
const fallback = () => {
  const styles = getComputedStyle(picture), get = key=>styles.getPropertyValue(key), ctx=picture.querySelector('canvas').getContext('2d');
  ctx.save();paintFallback(ctx,576,373,Number(get('--scene-time'))||0,readColors(get),readControls(get));ctx.restore();
};
document.documentElement.dataset.colorway = location.hash.slice(1) || 'original';
fallback();
if (CSS.paintWorklet) {
  const definition = source + '\nregisterPaint("motherlode-scene",class { static get inputProperties() { return '+JSON.stringify(props)+'; } paint(ctx,size,styles) { const colors = {}; for(const key of '+JSON.stringify(names)+') colors[key]=String(styles.get("--"+key)).trim(); const controls=["--control-x","--control-y","--choice"].map(key=>Number(String(styles.get(key)).trim())||0); draw(ctx,size.width,size.height,Number(String(styles.get("--scene-time")).trim())||0,colors,controls); } });';

</script>

(() => {
  if (window.parent === window) return;
  let running = null;

    const page = new URLSearchParams(location.search).get("slide") || "1";
    if (page === lastPage) return;
    lastPage = page;
    window.parent.postMessage({type:"motherlode-slide", slide:Number(page)}, "*");
  }
  window.addEventListener("message", event => {
    if (event.source !== window.parent || event.data?.type !== "motherlode-player") return;
