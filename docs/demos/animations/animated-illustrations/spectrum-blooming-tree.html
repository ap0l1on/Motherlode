    <title id="art-title">Spectrum blooming tree</title>
    <desc id="description">A tree grows from a glowing stump in yellow, violet, amber and red. Each burst starts with the trunk and ends in fine luminous tips.</desc>
  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 13.4 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    const tau = 2 * Math.PI;
    let seed = 77216;
    function random() {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    function line(parent, data, color, width = 1, opacity = 1) {
      return element("path", {d: data, fill: "none", stroke: "var(--" + color + ")",
        "stroke-width": width, "stroke-linejoin": "round", "stroke-linecap": "round", opacity}, parent);
    }

    const crown=element("g",{}), branches=[],leaves=[];
    function branch(x,y,angle,len,thick,depth){
      const turn=(random()-.48)*.34, ax=Math.sin(angle),ay=-Math.cos(angle);
      const xx=x+Math.sin(angle+turn)*len, yy=y-Math.cos(angle+turn)*len;
      const pt1=[x+ay*thick*.5,y-ax*thick*.5],pt2=[x-ay*thick*.5,y+ax*thick*.5];
      const d="M"+pt1.join(" ")+"Q"+(x+ax*len*.55+ay*thick*.43)+" "+(y+ay*len*.55-ax*thick*.43)+" "+(xx+ay*thick*.29)+" "+(yy-ax*thick*.29)+"L"+(xx-ay*thick*.29)+" "+(yy+ax*thick*.29)+"Q"+(x+ax*len*.51-ay*thick*.41)+" "+(y+ay*len*.51+ax*thick*.41)+" "+pt2.join(" ")+"Z";
      branches.push({d,depth});
      if(depth<1){leaves.push([xx,yy]);return;}
      branch(xx,yy,angle+turn-.31-random()*.28,len*(.67+random()*.15),thick*.66,depth-1);
      branch(xx,yy,angle+turn+.24+random()*.38,len*(.67+random()*.15),thick*.69,depth-1);
      if(depth>2&&depth<6&&random()>.37)branch(xx,yy,angle+turn+(random()-.5)*.44,len*.62,thick*.48,depth-1);
    }
    branch(289,372,.03,75,17,8);
    const scenes=["bright","middle","highlight","middle","leaf"];
    for(let i=0;i<5;i++){
      const scene=element("g",{fill:"var(--"+scenes[i]+")"},crown), paints=[];
      for(let level=8;level>=0;level--){
        const p=element("path",{d:branches.filter(b=>b.depth===level).map(b=>b.d).join(" ")},scene);
        paints.push(p);
      }
      const dust=[[],[]];for(const [x,y] of leaves){
        for(let j=0;j<3;j++){const a=tau*random(),r=1+random()*5;dust[j%2].push("M"+(x+Math.cos(a)*r).toFixed(1)+" "+(y+Math.sin(a)*r).toFixed(1)+"l1.6 -1.1");}
      }
      dust.forEach((x,j)=>paints.push(line(scene,x.join(""),scenes[i],j?1.33:1.06,.95)));
      for(let j=0;j<paints.length;j++){
        const start=i/5+j*.0075,end=(i+1)/5;
        const frames=[{offset:0,opacity:0}];if(start>0)frames.push({offset:start,opacity:0});
        frames.push({offset:start+.024,opacity:1},{offset:end-.017,opacity:1},{offset:end,opacity:0});
        if(end<1)frames.push({offset:1,opacity:0});paints[j].animate(frames,{duration,iterations:Infinity});
      }
    }

    })();
  </script>

  </script>

(() => {
  if (window.parent === window) return;
  let running = null;
  let lastPage = "";
  function reportSlide() {
    const page = new URLSearchParams(location.search).get("slide") || "1";
    if (page === lastPage) return;
    lastPage = page;
    window.parent.postMessage({type:"motherlode-slide", slide:Number(page)}, "*");
  }
  window.addEventListener("message", event => {
    if (event.source !== window.parent || event.data?.type !== "motherlode-player") return;
    const {action, value} = event.data;
    if (action === "pause" && running === null) {
      running = document.getAnimations().filter(track => track.playState === "running" || track.pending);
      running.forEach(track => track.pause());
    } else if (action === "resume" && running !== null) {
      running.forEach(track => { if (track.playState === "paused") track.play(); });
      running = null;
    } else if (action === "palette" && /^[a-z0-9-]+$/.test(value) && location.hash.slice(1) !== value) {
      window.location.replace("#" + value);
    }
  });
  window.addEventListener("load", reportSlide);
  window.addEventListener("popstate", reportSlide);
  for (const event of ["click","keydown"]) {
    window.addEventListener(event, () => setTimeout(reportSlide, 0));
  }
})();
