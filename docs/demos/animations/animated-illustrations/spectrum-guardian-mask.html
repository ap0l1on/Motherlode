  <svg viewBox="0 0 576 578" role="img" aria-labelledby="art-title description" xmlns="http://www.w3.org/2000/svg">
    <title id="art-title">Spectrum guardian mask</title>
    <desc id="description">Colored pen strokes draw a horned mask with a slatted jaw, fine rays and a tall hexagonal frame.</desc>
  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 25 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    const tau = 2 * Math.PI;
    function pointsPath(points, close = false) {
      return points.length ? "M" + points.map(p => p[0].toFixed(2) + " " + p[1].toFixed(2)).join("L") + (close ? "Z" : "") : "";
    }
    function line(parent, data, color, width = 1, opacity = 1) {
      return element("path", {d: data, fill: "none", stroke: "var(--" + color + ")",
        "stroke-width": width, "stroke-linejoin": "round", "stroke-linecap": "round", opacity}, parent);
    }

    const cx=280,cy=274;
    const art=element("g",{transform:"translate(-2 9)"});
    const parts=[];
    function ink(d,color,width=1.3){parts.push(line(art,d,color,width,.96));}
    function mirrored(points,color,w) {
      for(const sign of [-1,1])ink(pointsPath(points.map(([x,y])=>[cx+sign*x,cy+y])),color,w);
    }
    mirrored([[5,-42],[31,-55],[78,-93],[100,-130],[120,-173]],"middle",1.35);
    mirrored([[8,-46],[48,-64],[102,-114],[120,-173]],"bright",.84);
    for(let k=1;k<6;k++)mirrored([[9,-44],[26+k*4,-51-k*4],[75+k*2,-84-k*2],[120,-173]],k%2?"shade":"middle",.72);
    ink("M253 218L257 202L276 204L286 187L295 204L315 202L319 217","middle");
    ink("M186 252Q277 207 375 252L362 263H202Z","middle",1.9);
    ink("M208 259Q277 250 356 259","bright",1.4);
    mirrored([[82,-13],[78,18],[72,25],[73,57],[48,88],[9,100],[0,103]],"bright");
    const nose=[[0,10],[-13,23],[0,35],[14,22],[0,10]];
    ink(pointsPath(nose.map(([x,y])=>[cx+x,cy+y]),true),"bright");
    mirrored([[16,-3],[39,-15],[64,-9],[51,1],[31,7],[16,-3]],"bright");
    for(const sign of [-1,1]){const p=element("circle",{cx:cx+sign*43,cy:cy-4,r:8.1,fill:"none",stroke:"var(--middle)","stroke-width":1.1});parts.push(p);}
    ink("M249 329H327L323 347H254Z","leaf");for(let x=256;x<326;x+=6.6)ink("M"+x+" 330v16","leaf",.84);
    for(let k=0;k<5;k++)ink("M229 "+(381+k*13)+"Q288 "+(416+k*15)+" 348 "+(381+k*13),"highlight",1.16);
    for(let k=0;k<7;k++)ink("M"+(233+k*18)+" "+(381+14*Math.sin(k/6*Math.PI))+"v41","leaf",.86);
    for(let i=0;i<28;i++){
      const a=i*tau/28;ink(pointsPath([[cx+111*Math.cos(a),cy+111*Math.sin(a)],
        [cx+190*Math.cos(a),cy+190*Math.sin(a)]]),"shade",.93);
    }
    ink(pointsPath(Array.from({length:6},(_,i)=>[cx+231*Math.cos(-Math.PI/2+tau*i/6),cy+231*Math.sin(-Math.PI/2+tau*i/6)]),true),"highlight",1.28);
    parts.forEach((p,i)=>{
      const at=.03+.864*i/parts.length;
      p.setAttribute("pathLength",1);p.setAttribute("stroke-dasharray","1 1");
      p.animate([{offset:0,strokeDashoffset:1},{offset:at,strokeDashoffset:1},{offset:at+.04,strokeDashoffset:0},
        {offset:.985,strokeDashoffset:0},{offset:1,strokeDashoffset:1}],{duration,iterations:Infinity});
    });

    })();
  </script>

// The library controls its sandboxed preview through messages. Standalone pages

(() => {
  if (window.parent === window) return;
  let running = null;
  let lastPage = "";
  function reportSlide() {
    const page = new URLSearchParams(location.search).get("slide") || "1";
    if (page === lastPage) return;
    lastPage = page;
    window.parent.postMessage({type:"motherlode-slide", slide:Number(page)}, "*");
  }
  window.addEventListener("message", event => {
    if (event.source !== window.parent || event.data?.type !== "motherlode-player") return;
    const {action, value} = event.data;
    if (action === "pause" && running === null) {
      running = document.getAnimations().filter(track => track.playState === "running" || track.pending);
      running.forEach(track => track.pause());
    } else if (action === "resume" && running !== null) {
      running.forEach(track => { if (track.playState === "paused") track.play(); });
      running = null;
    } else if (action === "palette" && /^[a-z0-9-]+$/.test(value) && location.hash.slice(1) !== value) {
      window.location.replace("#" + value);
    }
  });
  window.addEventListener("load", reportSlide);
  window.addEventListener("popstate", reportSlide);
  for (const event of ["click","keydown"]) {
    window.addEventListener(event, () => setTimeout(reportSlide, 0));
  }
})();
