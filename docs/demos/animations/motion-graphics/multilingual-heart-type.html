  <title>Multilingual heart type</title>
  <style>
:root, [data-colorway="original"] { --background: #050306; --shade: #3a0b18; --middle: #9c2537; --bright: #e76c72; --highlight: #ffc3be; --leaf: #a74754; --label: #e76c72; }
[data-colorway="light"] { --background: #fcf6f1; --shade: #78253d; --middle: #a13955; --bright: #b85a76; --highlight: #e39394; --leaf: #2a6651; --label: #78253d; }
[data-colorway="dark"] { --background: #111322; --shade: #6b3f70; --middle: #b75086; --bright: #ea899f; --highlight: #ffcfb6; --leaf: #83ab97; --label: #ea899f; }
[data-colorway="mono"] { --background: #121212; --shade: #505050; --middle: #878787; --bright: #bebebe; --highlight: #f1f1f1; --leaf: #9d9d9d; --label: #bebebe; }
[data-colorway="ocean"] { --background: #071824; --shade: #204e70; --middle: #348eab; --bright: #5bc8d4; --highlight: #c5f1e6; --leaf: #65b5a6; --label: #5bc8d4; }
[data-colorway="matcha"] { --background: #101c15; --shade: #3e563d; --middle: #71916a; --bright: #b4c989; --highlight: #eaf2c7; --leaf: #91b395; --label: #b4c989; }
[data-colorway="sunset"] { --background: #21101f; --shade: #723355; --middle: #b95161; --bright: #ec825d; --highlight: #ffdd9e; --leaf: #ab9976; --label: #ec825d; }
[data-colorway="iris"] { --background: #121026; --shade: #4b3d76; --middle: #7758bf; --bright: #ac9eff; --highlight: #eee0ff; --leaf: #7ea1b5; --label: #ac9eff; }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 576px; height: 454px; overflow: hidden; background: var(--background); }
    svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <svg viewBox="0 0 576 454" role="img" aria-labelledby="art-title description" xmlns="http://www.w3.org/2000/svg">
    <title id="art-title">Multilingual heart type</title>
    <desc id="description">Short declarations of love in different languages trace a red heart, then fill its center line by line.</desc>
  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 11 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    const tau = 2 * Math.PI;
    function line(parent, data, color, width = 1, opacity = 1) {
      return element("path", {d: data, fill: "none", stroke: "var(--" + color + ")",
        "stroke-width": width, "stroke-linejoin": "round", "stroke-linecap": "round", opacity}, parent);
    }

    const words=["I love you","Te amo","Seni seviyorum","Je t’aime","Ich liebe dich","Eu te amo",
      "Ti amo","Я люблю тебя","Jag älskar dig","사랑해","Kocham cię","愛してる","أحبك","Miluji tě","Ik hou van jou"];
    const center=[283,208];
    const shape=a=>[center[0]+13.15*16*Math.sin(a)**3,
      center[1]-12.65*(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))];
    function phrase(x,y,index,when,size=9.6) {
      const text=element("text",{x,y,"text-anchor":"middle","font-family":"system-ui, sans-serif",
        "font-size":size,"font-weight":600,fill:"var(--label)"});
      text.textContent=words[(index*7)%words.length];
      text.animate([{offset:0,opacity:0},{offset:when,opacity:0},
        {offset:Math.min(.96,when+.023),opacity:.88},{offset:.982,opacity:.88},
        {offset:1,opacity:0}],{duration,iterations:Infinity});
    }
    // Use even vertical spacing where the contour is steep. At the cleft and
    // the very tip just one line is needed to close the outline.
    let previous=null;
    const border=[];
    for(let i=0;i<=500;i++){
      const p=shape(tau*i/500);
      if(previous && Math.hypot((p[0]-previous[0])*.38,p[1]-previous[1])<15)continue;
      border.push(p);previous=p;
    }
    border.forEach(([x,y],i)=>phrase(x,y,i,.025+.42*i/border.length));
    let index=0;
    for(let row=0;row<18;row++)for(let column=0;column<7;column++){
      const x=97+column*62+(row%2?4:-4), y=95+row*16.4;
      const X=(x-center[0])/180, Y=(center[1]-y)/154;
      if((X*X+Y*Y-1)**3-X*X*Y**3>-.14)continue;
      phrase(x,y,++index,.48+.41*(row/18)+.018*column/7,8.4);
    }

    })();
  </script>
  <script>
    const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
    pick();
    addEventListener("hashchange", pick);
    const t = new URLSearchParams(location.search).get("t");
    if (t !== null) {
      const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = Number(t) * 1000; });
      freeze();
      addEventListener("load", freeze);
    }
  </script>

<script data-motherlode-player>
// The library controls its sandboxed preview through messages. Standalone pages
// manage their own interactions. The clipboard and download omit this bridge.
(() => {
  if (window.parent === window) return;
  let running = null;
  let lastPage = "";
  function reportSlide() {
    const page = new URLSearchParams(location.search).get("slide") || "1";
    if (page === lastPage) return;
    lastPage = page;
    window.parent.postMessage({type:"motherlode-slide", slide:Number(page)}, "*");
  }
  window.addEventListener("message", event => {
    if (event.source !== window.parent || event.data?.type !== "motherlode-player") return;
    const {action, value} = event.data;
    if (action === "pause" && running === null) {
      running = document.getAnimations().filter(track => track.playState === "running" || track.pending);
      running.forEach(track => track.pause());
    } else if (action === "resume" && running !== null) {
      running.forEach(track => { if (track.playState === "paused") track.play(); });
      running = null;
    } else if (action === "palette" && /^[a-z0-9-]+$/.test(value) && location.hash.slice(1) !== value) {
      window.location.replace("#" + value);
    }
  });
  window.addEventListener("load", reportSlide);
  window.addEventListener("popstate", reportSlide);
  for (const event of ["click","keydown"]) {
    window.addEventListener(event, () => setTimeout(reportSlide, 0));
  }
})();
</script>
