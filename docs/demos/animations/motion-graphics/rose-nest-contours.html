    <title id="art-title">Rose nest contours</title>
    <desc id="description">Fine rose outlines repeat inside a tilted heart, drawing a small bright heart at the center.</desc>
  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 19 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    const tau = 2 * Math.PI;
    let seed = 77216;
    function random() {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    function pointsPath(points, close = false) {
      return points.length ? "M" + points.map(p => p[0].toFixed(2) + " " + p[1].toFixed(2)).join("L") + (close ? "Z" : "") : "";
    }
    function line(parent, data, color, width = 1, opacity = 1) {
      return element("path", {d: data, fill: "none", stroke: "var(--" + color + ")",
        "stroke-width": width, "stroke-linejoin": "round", "stroke-linecap": "round", opacity}, parent);
    }
    function radial(defs, id, stops) {
      const gradient = element("radialGradient", {id}, defs);
      for (const [offset, color, opacity] of stops) element("stop", {
        offset, "stop-color": "var(--" + color + ")", "stop-opacity": opacity}, gradient);
      return "url(#" + id + ")";
    }

    const defs=element("defs",{});
    const haze=radial(defs,"dust",[[0,"shade",.35],[1,"background",0]]);
    element("ellipse",{cx:287,cy:215,rx:204,ry:180,fill:haze});
    for(let i=0;i<74;i++)element("circle",{cx:random()*550,cy:random()*440,r:.45+random()*.68,fill:"var(--bright)",opacity:.2+random()*.3});
    const shapes=17;
    for(let j=0;j<shapes;j++) {
      const p=j/(shapes-1),s=(1-.835*p)*12.4,angle=-.56+.47*p;
      const pts=[];
      for(let i=0;i<=150;i++){
        const a=tau*i/150,x=16*Math.sin(a)**3,y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));
        pts.push([283+s*(x*Math.cos(angle)-y*Math.sin(angle))+p*12,220+s*(x*Math.sin(angle)+y*Math.cos(angle))]);
      }
      const node=line(drawing,pointsPath(pts,true),p>.70?"highlight":p>.32?"bright":"middle",p>.76?1.8:1.25,.5+p*.45);
      node.setAttribute("pathLength",1);node.setAttribute("stroke-dasharray","1 1");
      const at=.035+p*.77;
      node.animate([{offset:0,strokeDashoffset:1},{offset:at,strokeDashoffset:1},
        {offset:at+.055,strokeDashoffset:0},{offset:.987,strokeDashoffset:0},{offset:1,strokeDashoffset:1}],{duration,iterations:Infinity});
    }

    })();
  </script>

    window.parent.postMessage({type:"motherlode-slide", slide:Number(page)}, "*");

  window.addEventListener("message", event => {
    if (event.source !== window.parent || event.data?.type !== "motherlode-player") return;

      running = null;
