<script>
const ns = 'http://www.w3.org/2000/svg';
const stage = document.querySelector('svg');
const defs = stage.querySelector('defs');
const W = stage.viewBox.baseVal.width, H = stage.viewBox.baseVal.height;
const duration = Number(document.querySelector('[name="motherlode:loop"]').content);
let seed = 1900516;
function random() {
  seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
  return seed / 4294967296;
}
const range = (a,b) => a + (b-a)*random();
const polar = (x,y,r,angle) => [x+r*Math.cos(angle),y+r*Math.sin(angle)];
const tau = Math.PI*2;
const css = name => 'var(--'+name+')';
function node(type, attrs={}, parent=stage) {
  const element = document.createElementNS(ns,type);
  for (const [name,value] of Object.entries(attrs)) element.setAttribute(name,value);
  parent.append(element);
  return element;
}
const group = (parent=stage,attrs={}) => node('g',attrs,parent);
const path = (d,attrs={},parent=stage) => node('path',{d,...attrs},parent);
const circle = (cx,cy,r,fill,parent=stage,attrs={}) => node('circle',{cx,cy,r,fill,...attrs},parent);
const rect = (x,y,width,height,fill,parent=stage,attrs={}) => node('rect',{x,y,width,height,fill,...attrs},parent);
const line = (x1,y1,x2,y2,stroke,width=1,parent=stage,attrs={}) => node('line',{x1,y1,x2,y2,stroke,'stroke-width':width,...attrs},parent);
function words(content, x,y, attrs={},parent=stage) {

  return text;
}
function gradient(id, stops, attrs={}, radial=false) {

}

  node('feGaussianBlur',{stdDeviation:radius},filter);

}
function shape(points,closed=false) {

}
const animations=[];
function animate(element,frames,options={}) {
  const motion=element.animate(frames,{duration:duration*1000,iterations:Infinity,easing:'linear',...options});

}

}
function origin(element,x,y) {element.style.transformOrigin=x+'px '+y+'px';}
function at(event){
  const bounds=stage.getBoundingClientRect();
  return [(event.clientX-bounds.left)*W/bounds.width,(event.clientY-bounds.top)*H/bounds.height];
}


const deep=gradient('water',[[0,'base'],[49,'bg'],[100,'e']],{x2:'6%',y2:'100%'});
rect(0,0,W,H,deep);
const bloom=soft('bloom',3.4);
for(let i=0;i<27;i++){const y=range(36,273);rect(range(-50,W),y,range(10,45),range(3,17),css('d'),stage,{opacity:range(.012,.086),rx:4,filter:bloom});}
function bed(x,z){return 231+z*104+11*Math.sin(x*.014-z*7)*(.41+.6*z)+6*Math.cos(x*.036+z*3);}
for(let i=0;i<35;i++){
 const z=i/34;path(shape(Array.from({length:90},(_,j)=>[j*W/89,bed(j*W/89,z)])),{fill:'none',stroke:css('b'),'stroke-opacity':.045+z*.07,'stroke-width':.65});
}
for(let i=-60;i<96;i++) {
 const x=i*9;path(shape(Array.from({length:29},(_,j)=>{const z=j/28,sx=310+(x-310)*(.22+z*1.66);return [sx,bed(sx,z)];})),{fill:'none',stroke:css('b'),'stroke-opacity':.12,'stroke-width':.64});
}
function surface(u,v,t){
 const s=u*2-1, phase=t*tau, skin=Math.sin(Math.PI*u)**.47;
 const x=288+s*135+Math.sin(phase)*9;
 const y=132+Math.sin(u*tau+phase)*21+Math.sin(phase*2+u*4)*9;
 const a=v*tau+Math.sin(phase+u*tau)*.73;
 const r=skin*(17+12*Math.cos(u*tau*2+phase*.36));
 return [x+Math.sin(a)*r*.25,y+Math.cos(a)*r+Math.sin(a)*8*skin];
}
const mesh=group();
for(const [kind,count,segments] of [['rings',48,27],['seams',23,48]]) {
 for(let i=0;i<count;i++) {
  const ratio=i/(kind==='rings'?count-1:count);const s=path('',{fill:'none',stroke:css(i%4?'a':'h'),'stroke-width':kind==='rings'?.65:.8,'stroke-opacity':kind==='rings'?.56:.55},mesh);
  const outlines=[];
  for(let k=0;k<=24;k++){const t=k/24;outlines.push(shape(Array.from({length:segments+1},(_,j)=>kind==='rings'?surface(ratio,j/segments,t):surface(j/segments,ratio,t))));}
  tweenPath(s,outlines);
 }
}

// The library controls its sandboxed preview through messages. Standalone pages

(() => {
  if (window.parent === window) return;
  let running = null;
  let lastPage = "";
  function reportSlide() {
    const page = new URLSearchParams(location.search).get("slide") || "1";
    if (page === lastPage) return;
    lastPage = page;
    window.parent.postMessage({type:"motherlode-slide", slide:Number(page)}, "*");
  }
  window.addEventListener("message", event => {
    if (event.source !== window.parent || event.data?.type !== "motherlode-player") return;
    const {action, value} = event.data;
    if (action === "pause" && running === null) {
      running = document.getAnimations().filter(track => track.playState === "running" || track.pending);
      running.forEach(track => track.pause());
    } else if (action === "resume" && running !== null) {
      running.forEach(track => { if (track.playState === "paused") track.play(); });
      running = null;
    } else if (action === "palette" && /^[a-z0-9-]+$/.test(value) && location.hash.slice(1) !== value) {
      window.location.replace("#" + value);
    }
  });
  window.addEventListener("load", reportSlide);
  window.addEventListener("popstate", reportSlide);
  for (const event of ["click","keydown"]) {
    window.addEventListener(event, () => setTimeout(reportSlide, 0));
  }
})();
