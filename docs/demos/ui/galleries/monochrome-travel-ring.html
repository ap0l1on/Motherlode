[data-colorway="dark"] {--bg: #1b232d; --surface: #303847; --text: #f3f5fa; --muted: #d2dbe8; --accent: #91b8e8; --button: #9bbcdc; --button-ink: #182a36; --wood: #698196; --lamp: #bb8d9c; --reflection: #6f9c9a;}
[data-colorway="mono"] {--bg: #ddd; --surface: #f4f4f4; --text: #191919; --muted: #484848; --accent: #666; --button: #555; --button-ink: #fff; --wood: #777; --lamp: #aaa; --reflection: #909090;}
[data-colorway="ocean"] {--bg: #c1e0e0; --surface: #e4f2ed; --text: #183c45; --muted: #3c5b62; --accent: #43869a; --button: #3a6e7e; --button-ink: #f0f7ed; --wood: #55949c; --lamp: #9bb5b1; --reflection: #6c8b9e;}
[data-colorway="matcha"] {--bg: #d8dfc2; --surface: #eef1da; --text: #2a3c2c; --muted: #4b5a40; --accent: #698653; --button: #526c43; --button-ink: #f6f7e7; --wood: #9aab73; --lamp: #ba9e7d; --reflection: #7d9d85;}
[data-colorway="sunset"] {--bg: #efd0ba; --surface: #ffebda; --text: #4e302d; --muted: #715047; --accent: #b86961; --button: #934e4f; --button-ink: #fff1e7; --wood: #dca37d; --lamp: #aa808f; --reflection: #a79682;}
[data-colorway="berry"] {--bg: #e4ccdc; --surface: #f6e6ed; --text: #452b41; --muted: #675165; --accent: #a66894; --button: #854e74; --button-ink: #fff0f5; --wood: #ba8ba9; --lamp: #c09392; --reflection: #9184ac;}
:root, [data-colorway="original"] {--art-treatment:none}
[data-colorway="light"] {--art-treatment:saturate(.80) brightness(1.09)}
[data-colorway="dark"] {--art-treatment:saturate(.83) brightness(.83) contrast(1.1)}
[data-colorway="mono"] {--art-treatment:grayscale(1) contrast(1.08)}
[data-colorway="ocean"] {--art-treatment:hue-rotate(15deg) saturate(.85) brightness(.96)}
[data-colorway="matcha"] {--art-treatment:sepia(.25) hue-rotate(13deg) saturate(.88)}
[data-colorway="sunset"] {--art-treatment:sepia(.22) hue-rotate(-12deg) saturate(1.1)}
[data-colorway="berry"] {--art-treatment:hue-rotate(322deg) saturate(.9)}

const root = document.querySelector('main');

  if ((!reduced || frozen) && duration) {
    const elements = typeof target === 'string' ? all(target) : [target];
    for (const element of elements) {
      const frames = keys.map(([seconds, properties]) => ({ ...properties, offset: seconds / duration }));
      previewAnimations.push(element.animate(frames, { duration: duration * 1000, iterations: Infinity, easing: 'linear' }));
    }
  }
}
function manual() {
  for (const animation of previewAnimations) animation.cancel();
  previewAnimations.length = 0;
  root.dataset.mode = 'manual';
}

 manual();root.style.setProperty('--angle',a);const i=indexAt(a);

    const page = new URLSearchParams(location.search).get("slide") || "1";
    if (page === lastPage) return;
    lastPage = page;
    window.parent.postMessage({type:"motherlode-slide", slide:Number(page)}, "*");
  }
  window.addEventListener("message", event => {
    if (event.source !== window.parent || event.data?.type !== "motherlode-player") return;
    const {action, value} = event.data;
    if (action === "pause" && running === null) {
      running = document.getAnimations().filter(track => track.playState === "running" || track.pending);
      running.forEach(track => track.pause());
    } else if (action === "resume" && running !== null) {
      running.forEach(track => { if (track.playState === "paused") track.play(); });
      running = null;
    } else if (action === "palette" && /^[a-z0-9-]+$/.test(value) && location.hash.slice(1) !== value) {
      window.location.replace("#" + value);
    }
  });
  window.addEventListener("load", reportSlide);
  window.addEventListener("popstate", reportSlide);
  for (const event of ["click","keydown"]) {
    window.addEventListener(event, () => setTimeout(reportSlide, 0));
  }
})();
</script>
</body></html>
