  * { box-sizing: border-box; }
  body { margin: 0; width: 576px; height: 100px; overflow: hidden; background: var(--wall); }
  main { position: relative; width: 100%; height: 100%; isolation: isolate; }
  .room { display: block; position: absolute; inset: 0; width: 576px; height: 100px; }
  button { appearance: none; border: 0; padding: 0; margin: 0; background: var(--clear); color: inherit; font: inherit; cursor: pointer; }
  button:focus-visible { outline: 1.5px solid currentColor; outline-offset: -3px; }
  .icon { flex: none; display: block; fill: none; stroke: currentColor; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; }
  nav { position: absolute; font-family: "DM Sans", sans-serif; -webkit-font-smoothing: antialiased; }

  .rail { left: 100.5px; width: 396.5px; height: 44px; --x: 4.5px; --w: 77.4px; }
  .tab-row { position: absolute; inset: 0 4.55px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; }
  .tab, .label { height: 36px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; font-size: 9.6px; line-height: 1; font-weight: 560; letter-spacing: .035px; }
  .icon { width: 11.7px; height: 11.7px; }
  .tab-row { color: var(--type); }
  .active-letters { position: absolute; inset: 0; color: var(--selected-type); pointer-events: none; clip-path: inset(3.2px calc(100% - var(--x) - var(--w)) 3.2px var(--x) round 14px); }
  .active-letters .tab-row { color: inherit; }
  .active-letters .label { font-weight: 680; }
  .rail:has(.tab:focus-visible)::after { content: ""; position: absolute; pointer-events: none; top: 4px; bottom: 4px; left: var(--x); width: var(--w); border-radius: 16px; outline: 1.2px solid var(--selected-type); outline-offset: -3px; }
  @property --x { syntax: '<length>'; inherits: true; initial-value: 4.5px; }
  @property --w { syntax: '<length>'; inherits: true; initial-value: 77.4px; }

  .rail { top: 27.9px; --w: 76.2px; }
  .ink-plate { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 2px 3px color-mix(in srgb, var(--black) 15%, var(--clear))); }
  .aperture { x: var(--x); width: var(--w); }
  .tab, .label { font-weight: 590; }
  .active-letters { clip-path: inset(4.9px calc(100% - var(--x) - var(--w)) 4.9px var(--x) round 18px); }

  const nav = document.querySelector('nav');
  const tabs = [...nav.querySelectorAll('.tab')];

  function travel(from, to) {
    const a = parseFloat(pose(from)['--x']);
    const b = parseFloat(pose(to)['--x']);
    const stretch = Math.min(30, 16.5 * Math.sqrt(Math.abs(to - from)));
    const curve = [[0, 0, 0], [.12, .035, .4], [.27, .25, 1], [.43, .55, .9],
      [.62, .80, .55], [.80, .94, .23], [1, 1, 0]];
    return curve.map(([offset, distance, opening]) => ({ offset,
      '--x': pixels(between(a, b, distance) - (b < a ? stretch * opening : 0)),
      '--w': pixels(76.2 + stretch * opening) }));
  }

  function mark(index) {
    selected = index;
    tabs.forEach((tab, i) => tab.setAttribute('aria-pressed', String(i === index)));
  }

    const previous = selected;
    const destination = pose(index);
    const computed = getComputedStyle(nav);
    const current = Object.fromEntries(Object.keys(destination).map(key => [key, computed.getPropertyValue(key).trim()]));
    motion?.cancel();
    for (const [key, value] of Object.entries(destination)) nav.style.setProperty(key, value);
    mark(index);
    if (reduced || previous === index) return;
    const frames = travel(previous, index);
    frames[0] = { ...current, offset: 0 };
    motion = nav.animate(frames, { duration: liveDuration * 1000, easing: 'linear' });
  }

    tab.addEventListener('click', () => choose(index));
    tab.addEventListener('focus', () => { if (tab.matches(':focus-visible')) choose(index); });
    tab.addEventListener('keydown', event => {
      const next = { ArrowRight: (index + 1) % tabs.length, ArrowLeft: (index - 1 + tabs.length) % tabs.length,
        Home: 0, End: tabs.length - 1 }[event.key];
      if (next === undefined) return;

      tabs[next].focus();

    const frames = [{ ...pose(0), offset: 0 }];
    let previous = 0;
    for (const [start, end, next, drag] of stops) {

    function syncSelection() {

      mark(changes.filter(change => change.time <= time).at(-1)?.state ?? 0);
      if (stillTime === null) {
        const next = changes.find(change => change.time > time)?.time ?? loop + changes[0].time;
