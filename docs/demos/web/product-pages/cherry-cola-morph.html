function at(el, props, usesPalette = false) {

function stop(){if(manual)return;tracks.forEach(a=>a.cancel());manual=true;get('.count').textContent=quantity;get('.total').textContent=dollars(quantity);get('.bag span').textContent=dollars(quantity);}
function show(open){stop();expanded=open;Object.assign(get('.panel').style,pane(open));Object.assign(get('.bottle').style,image(open));get('.panel').style.transition='width .35s ease,height .35s ease,left .35s ease,top .35s ease';get('.bottle').style.transition='right .35s ease,top .35s ease,width .35s ease,height .35s ease';get('.open').style.visibility=open?'hidden':'visible';all('.detail').forEach(el=>el.style.visibility=open?'visible':'hidden');get('.wash').style.transform=open?'':'translateX(-25%) scale(1.6)';}
function choose(f){flavor=f;show(true);get('.bottle .lime').style.opacity=String(f);get('.wash').style.setProperty('--flavor',f?'var(--second)':'var(--accent)');get('.info p').textContent=f?'Fresh lime cola with a bright citrus finish.':'Classic cola flavor with a crisp and refreshing finish.';all('[data-flavor]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.flavor===f)));}
function count(delta){show(true);quantity=Math.max(1,Math.min(20,quantity+delta));const total='$'+(quantity*2.4).toFixed(2);get('.count').textContent=quantity;get('.total').textContent=total;get('.bag').innerHTML='♧ &nbsp;Add to cart &nbsp;<span>'+total+'</span>';}
get('.open').addEventListener('click',()=>show(true));get('.close').addEventListener('click',()=>show(false));all('[data-flavor]').forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.flavor)));get('.minus').addEventListener('click',()=>count(-1));get('.plus').addEventListener('click',()=>count(1));get('.bag').addEventListener('click',()=>{show(true);bag+=quantity;get('.bag').textContent='✓ Added · '+bag+' in bag';get('.bag').style.backgroundColor='var(--good)';});document.addEventListener('keydown',e=>{if(e.key==='Escape')show(false);});if(matchMedia('(prefers-reduced-motion: reduce)').matches&&!new URLSearchParams(location.search).has('t'))show(false);
</script><script>  const pick = () => {
    document.documentElement.dataset.colorway = location.hash.slice(1) || "original";

// The library controls its sandboxed preview through messages. Standalone pages
// manage their own interactions. The clipboard and download omit this bridge.
(() => {
  if (window.parent === window) return;
  let running = null;
  let lastPage = "";
  function reportSlide() {
    const page = new URLSearchParams(location.search).get("slide") || "1";
    if (page === lastPage) return;
    lastPage = page;
    window.parent.postMessage({type:"motherlode-slide", slide:Number(page)}, "*");
  }
  window.addEventListener("message", event => {
    if (event.source !== window.parent || event.data?.type !== "motherlode-player") return;
    const {action, value} = event.data;
    if (action === "pause" && running === null) {
      running = document.getAnimations().filter(track => track.playState === "running" || track.pending);
      running.forEach(track => track.pause());
    } else if (action === "resume" && running !== null) {
      running.forEach(track => { if (track.playState === "paused") track.play(); });
      running = null;
    } else if (action === "palette" && /^[a-z0-9-]+$/.test(value) && location.hash.slice(1) !== value) {
      window.location.replace("#" + value);
    }
  });
  window.addEventListener("load", reportSlide);
  window.addEventListener("popstate", reportSlide);
  for (const event of ["click","keydown"]) {
    window.addEventListener(event, () => setTimeout(reportSlide, 0));
  }
})();
