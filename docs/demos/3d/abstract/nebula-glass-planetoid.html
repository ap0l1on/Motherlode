<script type="text/plain" id="drawing">
const tau = Math.PI * 2;
const clamp = (v,a=0,b=1) => Math.min(b,Math.max(a,v));
const smooth = v => { v=clamp(v); return v*v*(3-2*v); };
const lerp = (a,b,t) => a+(b-a)*t;
function channels(col) {
  const s=String(col).trim(); if(s.startsWith('#')){const h=s.slice(1);return (h.length===3?[...h].map(c=>c+c):h.match(/../g)).slice(0,3).map(v=>parseInt(v,16));}
  const values=s.match(/[.0-9]+/g)||[0,0,0];return values.slice(0,3).map(Number);
}
function mix(a,b,t){const f=channels(a),s=channels(b);return 'rgb('+f.map((v,i)=>Math.round(lerp(v,s[i],clamp(t)))).join(',')+')';}
function alpha(col,a){return 'rgba('+channels(col).join(',')+','+clamp(a)+')';}
function ellipse(c,x,y,rx,ry,fill,rot=0){if(rx<=0||ry<=0)return;c.beginPath();c.ellipse(x,y,rx,ry,rot,0,tau);c.fillStyle=fill;c.fill();}
function polygon(c,pts,fill,stroke,width=1){if(!pts.length)return;c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke();}}
function stroke(c,pts,col,width=1){if(pts.length<2)return;c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.strokeStyle=col;c.lineWidth=width;c.stroke();}
function glow(c,x,y,r,stops,aspect=1) {if(r<=0)return;c.save();c.translate(x,y);c.scale(1,aspect);let g=c.createRadialGradient(0,0,0,0,0,r);for(const [v,col] of stops)g.addColorStop(v,col);ellipse(c,0,0,r,r,g);c.restore();}
function segment(t,points){if(t<=points[0][0])return points[0][1];for(let i=1;i<points.length;i++){if(t<=points[i][0])return lerp(points[i-1][1],points[i][1],smooth((t-points[i-1][0])/(points[i][0]-points[i-1][0])));}return points.at(-1)[1];}
function number(i){const s=Math.sin(i*127.1+311.7)*43758.5453123;return s-Math.floor(s);}
function rotate(v,axis,a){const [x,y,z]=v,s=Math.sin(a),c=Math.cos(a);if(axis==='x')return [x,y*c-z*s,y*s+z*c];if(axis==='y')return [x*c+z*s,y,-x*s+z*c];return [x*c-y*s,x*s+y*c,z];}
function project(v,yaw,pitch,x,y,scale,eye=0){const q=rotate(rotate(v,'y',yaw),'x',pitch),k=eye?eye/(eye-q[2]):1;return [x+q[0]*k*scale,y+q[1]*k*scale,q[2]];}

const lattice = Float32Array.from({length:8192},(_,i)=>number(i*.73+173));
function noise(x,y){const xi=Math.floor(x),yi=Math.floor(y),u=smooth(x-xi),v=smooth(y-yi),hash=(a,b)=>lattice[((a*13+b*223)&8191)];return lerp(lerp(hash(xi,yi),hash(xi+1,yi),u),lerp(hash(xi,yi+1),hash(xi+1,yi+1),u),v);}
function cloud(x,y){return .52*noise(x,y)+.26*noise(x*2.09+3,y*2.09-9)+.14*noise(x*4.21-6,y*4.21+7)+.08*noise(x*8.47+2,y*8.47);}
function draw(c,w,h,t,p,controls){
  c.fillStyle=p.bg;c.fillRect(0,0,w,h);
  function nebula(x,y,f){return Math.sin(x*f+Math.sin(y*f*.7))*.30+Math.cos(y*f*1.79-x*f*.31)*.23+Math.sin(x*f*3.3+y*f*2.2)*.12+Math.cos(x*f*7-y*f*4.1)*.06+Math.sin(x*f*.53+y*f*.64)*.32;}
  const shift=t*.016+controls[0]*.08,cx=w*.5,cy=h*.532;
  for(let i=0;i<430;i++){const x=number(i*7+13)*w,y=number(i*7+7)*h,sz=3+number(i*7+16)*47;const n=nebula(x/w+shift,y/h,9);
    if(n<-.35)continue;const col=x>w*.65&&y<h*.5?p.d:p.f;glow(c,x,y,sz,[[0,alpha(col,(n+.47)*.15)],[.53,alpha(col,(n+.47)*.056)],[1,alpha(col,0)]],.68+number(i)*.7);}
  for(let i=0;i<1120;i++){const x=(number(i*3+78)*w+t*(number(i+10)-.5)*.45+w)%w,y=number(i*3+19)*h,s=number(i+47);const col=i%17===0?p.b:(i%4===0?p.a:p.paper);
   if(s>.982){glow(c,x,y,3+s*3.5,[[0,alpha(col,.9)],[.29,alpha(col,.35)],[1,alpha(col,0)]]);}
   c.fillStyle=alpha(col,.18+s*.74);c.fillRect(x,y,.26+s*s*1.45,.26+s*s*1.45);}
  const rad=segment(t,[[0,76],[1,85],[2.4,112],[4.3,130],[5.5,115],[6.8,122],[7.9,80],[9,49],[10.25,42]]);
  const shell=segment(t,[[0,0],[7.5,0],[8.5,.43],[9.7,1],[10.25,.94]]);
  if(shell>0){const rr=rad+shell*224;glow(c,cx,cy,rr,[[0,alpha(p.f,0)],[.73,alpha(p.f,.012)],[.91,alpha(p.d,.075*shell)],[.98,alpha(p.a,.16*shell)],[1,alpha(p.a,0)]]);}
  const bgStep=5;
  for(let y0=0;y0<h;y0+=bgStep)for(let x0=0;x0<w;x0+=bgStep){
    const xx=x0/w,yy=y0/h;const a=cloud(xx*3.7+shift,yy*4.1),b=cloud(xx*9.2+a*3,yy*9.2-a*3);
    const density=clamp((b-.44)*2.5)*clamp(a*1.2);if(density<.04)continue;
    c.fillStyle=alpha(xx>.63&&yy<.6?p.d:p.f,density*.26);c.fillRect(x0,y0,bgStep+.5,bgStep+.5);}
  const rot=t*.49+controls[0]*2.8,tilt=.24+.23*Math.sin(t*.49)+controls[1]*.8;const outlines=[];
  const shape=(a,b)=>1+.041*Math.sin(3*a+t*.4)*Math.cos(2*b)+.024*Math.sin(5*b+2*a+t*.38)+.018*Math.cos(5*a-3*b);
  for(let i=0;i<110;i++){const a=i/110*tau,rr=rad*(1+.044*Math.sin(3*a+t*.46)+.023*Math.cos(5*a-t*.29));outlines.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)]);}
  c.save();polygon(c,outlines,p.ash);c.clip();
  glow(c,cx-rad*.36,cy-rad*.51,rad*1.81,[[0,mix(p.a,p.paper,.48)],[.20,p.a],[.48,p.f],[.78,p.ash],[1,p.shadow]]);
  const flare=segment(t,[[0,.12],[3,.1],[5.6,.12],[6.85,.85],[7.77,.72],[9,.3],[10.25,.38]]);
  glow(c,cx+rad*.26,cy-rad*.38,rad*.89,[[0,alpha(p.paper,flare*.87)],[.25,alpha(p.b,flare*.83)],[.57,alpha(p.d,flare*.54)],[1,alpha(p.d,0)]]);
  const step=Math.max(1.3,rad/83),latHue=t*.082;
  for(let yy=-rad;yy<=rad;yy+=step)for(let xx=-rad;xx<=rad;xx+=step){
    const nx=xx/rad,ny=yy/rad,ss=nx*nx+ny*ny;if(ss>=.985)continue;const nz=Math.sqrt(1-ss);
    const u=Math.atan2(nx,nz)+latHue,v=Math.asin(ny),warp=cloud(u*3.5+2,v*4.1-1.8);
    const val=cloud(u*10+warp*4.6,v*10.6+warp*2.4);
    const band=Math.exp(-Math.pow((ny+nx*.16+.34+(warp-.5)*.7)*3.7,2));const day=clamp(.48-.3*nx-.36*ny+.2*nz);
    const brightness=clamp(((val-.45)*2.85+.26*band)*(.42+day)*(.46+band));
    const dark=clamp((.52-val)*3.2+.10*band);if(dark>.09){c.fillStyle=alpha(p.shadow,dark*.32);c.fillRect(cx+xx,cy+yy,step+.35,step+.35);}
    if(brightness>.06){c.fillStyle=alpha(mix(p.a,p.paper,clamp((val-.45)*2+band*.12)),Math.min(.53,brightness*.67));c.fillRect(cx+xx,cy+yy,step+.42,step+.42);}
  }
  for(let i=0;i<10300;i++){const u=number(i*5+32)*tau,v=Math.asin(number(i*5+21)*2-1),rr=shape(u,v),world=rotate(rotate([Math.cos(v)*Math.cos(u)*rr,Math.sin(v)*rr,Math.cos(v)*Math.sin(u)*rr],'y',rot),'x',tilt);
    if(world[2]<0)continue;const n=nebula(u/tau,v/Math.PI,26),light=clamp(.49-.31*world[0]-.38*world[1]+.28*world[2]);const col=n>.43?p.paper:n>.12?p.a:n<-.39?p.d:p.shadow;
    const sz=rad*(.002+Math.pow(number(i+243),4)*.017);c.fillStyle=alpha(col,(.1+.55*Math.abs(n))*(.42+.58*light));c.fillRect(cx+world[0]*rad,cy+world[1]*rad,sz*1.5,sz);}
  c.restore();
}

<script>
const stage = document.querySelector('main');
const duration = Number(document.querySelector('[name="motherlode:loop"]').content);
const motion = [];
function animate(target, keys, options = {}) {
  if (typeof target === 'string') target = document.querySelector(target);
  const list = keys.map(([time, value]) => ({ offset: time / duration, ...value }));
  const effect = target.animate(list, { duration: duration * 1000, iterations: Infinity, fill: 'both', easing: 'linear', ...options });
  motion.push(effect);
  return effect;
}
function hold(seconds) {
  for (const effect of motion) { effect.pause(); effect.currentTime = Math.max(0,Math.min(duration - .001,seconds)) * 1000; }
}
function replay() {
  for (const effect of motion) { effect.currentTime = 0; effect.play(); }
}
function bind(element, callback) {
  element.addEventListener('click', callback);
  element.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); callback(event); }
  });
}

const picture = document.querySelector('#render');
const source = document.querySelector('#drawing').textContent;
const names = ['bg','ink','shadow','paper','ash','metal','edge','a','b','c','d','e','f',];
const clock = animate(picture, [[0,{'--scene-time':0}],[duration,{'--scene-time':duration}]]);
const props = ['--scene-time','--control-x','--control-y','--choice', ...names.map(v=>'--'+v)];
const readColors = getter => Object.fromEntries(names.map(name=>[name,String(getter('--'+name)).trim()]));
const readControls = getter => ['--control-x','--control-y','--choice'].map(name=>Number(String(getter(name)).trim()) || 0);
const paintFallback = new Function(source+';return draw;')();
const fallback = () => {
  const styles = getComputedStyle(picture), get = key=>styles.getPropertyValue(key), ctx=picture.querySelector('canvas').getContext('2d');
  ctx.save();paintFallback(ctx,576,486,Number(get('--scene-time'))||0,readColors(get),readControls(get));ctx.restore();
};
document.documentElement.dataset.colorway = location.hash.slice(1) || 'original';
fallback();
if (CSS.paintWorklet) {
  const definition = source + '\nregisterPaint("motherlode-scene",class { static get inputProperties() { return '+JSON.stringify(props)+'; } paint(ctx,size,styles) { const colors = {}; for(const key of '+JSON.stringify(names)+') colors[key]=String(styles.get("--"+key)).trim(); const controls=["--control-x","--control-y","--choice"].map(key=>Number(String(styles.get(key)).trim())||0); draw(ctx,size.width,size.height,Number(String(styles.get("--scene-time")).trim())||0,colors,controls); } });';
  const url=URL.createObjectURL(new Blob([definition],{type:'text/javascript'}));
  CSS.paintWorklet.addModule(url).then(()=>{picture.dataset.painted='';URL.revokeObjectURL(url);}).catch(()=>{URL.revokeObjectURL(url);setInterval(fallback,1000/24);});
} else { setInterval(fallback,1000/24); }
stage.addEventListener('pointermove',e=>{if(e.buttons){picture.style.setProperty('--control-x',e.offsetX/stage.clientWidth-.5);picture.style.setProperty('--control-y',e.offsetY/stage.clientHeight-.5);}});stage.addEventListener('dblclick',replay);

</script>

// The library controls its sandboxed preview through messages. Standalone pages

(() => {
  if (window.parent === window) return;
  let running = null;
  let lastPage = "";
  function reportSlide() {
    const page = new URLSearchParams(location.search).get("slide") || "1";
    if (page === lastPage) return;
    lastPage = page;
    window.parent.postMessage({type:"motherlode-slide", slide:Number(page)}, "*");
  }
  window.addEventListener("message", event => {
    if (event.source !== window.parent || event.data?.type !== "motherlode-player") return;
    const {action, value} = event.data;
    if (action === "pause" && running === null) {
      running = document.getAnimations().filter(track => track.playState === "running" || track.pending);
      running.forEach(track => track.pause());
    } else if (action === "resume" && running !== null) {
      running.forEach(track => { if (track.playState === "paused") track.play(); });
      running = null;
    } else if (action === "palette" && /^[a-z0-9-]+$/.test(value) && location.hash.slice(1) !== value) {
      window.location.replace("#" + value);
    }
  });
  window.addEventListener("load", reportSlide);
  window.addEventListener("popstate", reportSlide);
  for (const event of ["click","keydown"]) {
