<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3eb">
  <meta name="description" content="Browse Motherlode’s editable design library. Try live designs, explore colorways, copy the source and use designer prompts.">
  <title>Design library · Motherlode</title>
  <link rel="icon" href="./assets/mark.svg?v=2" type="image/svg+xml">
  <link rel="preload" href="./assets/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./library.css?v=2">
  <link rel="stylesheet" href="./mineral.css">
  <script src="./library.js?v=2" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#library" aria-label="Motherlode home"><img src="./assets/mark.svg?v=2" alt="" width="42" height="42"><span>Motherlode</span></a>
    <nav class="topnav" aria-label="Main navigation">
      <a href="#library" id="nav-library">Library</a>
      <a href="#prompts" id="nav-prompts" aria-label="Designer prompts"><span class="nav-long">Designer prompts</span><span class="nav-short">Prompts</span></a>
    </nav>
    <div class="header-tools">
      <form class="search-box" id="search-form" role="search">
        <svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#search"/></svg>
        <input id="search-designs" type="search" placeholder="Search designs…" aria-label="Search designs" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </form>
      <a class="repo-link" href="https://github.com/ap0l1on/Motherlode" target="_blank" rel="noopener" aria-label="Motherlode on GitHub"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#github"/></svg><span>GitHub</span></a>
    </div>
  </header>
  <section id="masthead" class="masthead" aria-labelledby="archive-title" data-mineral="carnelian" hidden>
    <div class="mineral-scene" aria-hidden="true">
      <img id="mineral-image" data-src="./assets/carnelian.webp" alt="" width="1872" height="624" decoding="async" fetchpriority="high">
      <canvas id="mineral-canvas"></canvas>
    </div>
    <div class="mast-shade" aria-hidden="true"></div>
    <div class="mast-copy">
      <h1 id="archive-title">Design <em>library.</em></h1>
      <p>Explore <strong id="archive-total"></strong> working designs. Try the motion, switch the colors, and take the code.</p>
      <button type="button" class="browse-archive" id="browse-archive"><svg class="icon" aria-hidden="true" width="17" height="17"><use href="./assets/icons.svg#grid"/></svg>Browse designs</button>
    </div>
    <button type="button" class="mineral-surface" aria-label="Bend the mineral. Move the pointer, tap, or press the arrow keys." aria-describedby="mineral-tip"></button>
    <div class="mineral-dock" aria-label="Masthead material">
      <span class="material-name" id="material-name" aria-live="polite">Carnelian</span>
      <div class="material-choices" role="group" aria-label="Choose a mineral">
        <button type="button" data-stone="carnelian" aria-label="Carnelian" aria-pressed="true" title="Carnelian"><i></i></button>
        <button type="button" data-stone="malachite" aria-label="Malachite" aria-pressed="false" title="Malachite"><i></i></button>
        <button type="button" data-stone="lapis" aria-label="Lapis" aria-pressed="false" title="Lapis"><i></i></button>
      </div>
      <button class="mineral-motion" type="button" id="mineral-motion" aria-label="Pause background motion" title="Pause background motion"><svg class="icon" width="15" height="15" aria-hidden="true"><use href="./assets/icons.svg#pause"/></svg></button>
    </div>
    <span class="mineral-tip" id="mineral-tip"><span class="pointer-tip">Move to bend the stone</span><span class="touch-tip">Touch to bend the stone</span></span>
  </section>
  <div class="shell">
    <button class="sidebar-shade" type="button" aria-label="Close navigation" hidden></button>
    <aside id="sidebar" aria-label="Library navigation"></aside>
    <main id="main-content" tabindex="-1"><p class="loading">Loading the design library…</p></main>
  </div>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <noscript>Enable JavaScript to try live designs and switch colorways. <a href="https://github.com/ap0l1on/Motherlode">Browse the catalog on GitHub</a>.</noscript>
</body>
</html>
