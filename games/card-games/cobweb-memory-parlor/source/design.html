<script>
const stage = document.querySelector('main');
const duration = Number(document.querySelector('[name="motherlode:loop"]').content);
const motion = [];
function animate(target, keys, options = {}) {
  if (typeof target === 'string') target = document.querySelector(target);
  const list = keys.map(([time, value]) => ({ offset: time / duration, ...value }));
  const effect = target.animate(list, { duration: duration * 1000, iterations: Infinity, fill: 'both', easing: 'linear', ...options });
  motion.push(effect);
  return effect;
}
function hold(seconds) {
  for (const effect of motion) { effect.pause(); effect.currentTime = Math.max(0,Math.min(duration - .001,seconds)) * 1000; }
}
function replay() {
  for (const effect of motion) { effect.currentTime = 0; effect.play(); }
}
function bind(element, callback) {
  element.addEventListener('click', callback);
  element.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); callback(event); }
  });
}

const cards=[...document.querySelectorAll('[data-index]')],pairIds=[0, 0, 1, 5, 3, 4, 6, 7, 5, 2, 4, 6, 1, 7, 3, 2];let opened=[],matched=new Set(),flips=0,running=false,locked=false,started=0,ticker;
function reveal(i,open){document.querySelector('#front'+i).style.transform='scaleX('+(open?1:0)+')';document.querySelector('#back'+i).style.transform='scaleX('+(open?0:1)+')';}
function start(){motion.forEach(a=>a.cancel());document.querySelectorAll('#time,#flips').forEach(e=>e.style.visibility='visible');document.querySelectorAll('.demo').forEach(e=>e.style.visibility='hidden');document.querySelectorAll('#welcome,#victory').forEach(e=>{e.style.opacity=0;e.style.pointerEvents='none';});for(let i=0;i<16;i++)reveal(i,false);opened=[];matched=new Set();flips=0;locked=false;running=true;started=Date.now();document.querySelector('#flips').textContent=0;document.querySelector('#time').textContent=100;clearInterval(ticker);ticker=setInterval(()=>{const sec=Math.max(0,100-Math.floor((Date.now()-started)/1000));document.querySelector('#time').textContent=sec;if(!sec){running=false;clearInterval(ticker);document.querySelector('#welcome').style.opacity=1;document.querySelector('#welcome').style.pointerEvents='auto';}},1000);}
cards.forEach((el,i)=>bind(el,()=>{if(!running)start();if(locked||matched.has(i)||opened.includes(i))return;reveal(i,true);opened.push(i);document.querySelector('#flips').textContent=++flips;if(opened.length===2){const [a,b]=opened;if(pairIds[a]===pairIds[b]){matched.add(a);matched.add(b);opened=[];if(matched.size===16){clearInterval(ticker);running=false;const win=document.querySelector('#victory');win.style.opacity=1;win.style.pointerEvents='auto';}}else{locked=true;setTimeout(()=>{reveal(a,false);reveal(b,false);opened=[];locked=false;},650);}}}));bind(document.querySelector('#welcome'),start);bind(document.querySelector('#victory'),start);stage.addEventListener('click',e=>{if(!running&& !e.target.closest('[data-index]') && (Number(getComputedStyle(document.querySelector('#welcome')).opacity)>.8 || Number(getComputedStyle(document.querySelector('#victory')).opacity)>.8))start();});
</script>
