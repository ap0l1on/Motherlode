</style></head><body><main><h1>Field Kit</h1><span class="rail"></span><section class="rack" aria-label="Hanging garments"></section><button class="avail" type="button">See availability</button>

const get=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)],names=['Denim overshirt','Union mesh tank top','Corduroy field jacket','Charcoal track jacket','Checkered racing tee','Navy practice jersey'];const racks=[],tracks=[];let manual=false,active=4,opened=false,turned=false;

get('.avail').addEventListener('click',()=>openItem(active));get('.close').addEventListener('click',()=>choose(active));get('.flip').addEventListener('click',()=>{turned=!turned;get('.piece').style.transition='transform .45s';get('.piece').style.transform='rotateY('+(turned?180:0)+'deg)';});get('.stock').addEventListener('click',()=>get('.stockline').textContent='Available sizes · S / M / L / XL');all('.swatches button').forEach((b,i)=>b.addEventListener('click',()=>{active=i?5:1;detailArt(active);}));document.addEventListener('keydown',e=>{if(e.key==='Escape')choose(active);if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const i=(active+(e.key==='ArrowRight'?1:5))%6;opened?openItem(i):choose(i);}});

function at(el,props){tracks.push(el.animate(seq.map(([offset,i,d])=>({offset,...props(i,d,offset),easing:'ease-in-out'})),{duration:5900,iterations:Infinity}));}
racks.forEach((b,i)=>at(b,(active,detail)=>fit(i,active,detail)));at(get('.detail'),(i,d)=>({opacity:d}));at(get('.rail'),(i,d)=>({opacity:d?.23:1}));at(get('h1'),(i,d)=>({opacity:d?.32:1}));at(get('.avail'),(i,d)=>({opacity:1-d}));all('.piece .cloth').forEach(el=>at(el,i=>({backgroundPosition:point(i)})));at(get('.piece'),(i,d,t)=>({transform:'rotateY('+(t>=.94&&d?180:0)+'deg)'}));detailArt(1);
