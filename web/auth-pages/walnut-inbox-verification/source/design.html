const root = document.querySelector('main');
const $ = selector => root.querySelector(selector);

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const duration = Number(document.querySelector('[name="motherlode:loop"]')?.content || 0);
const previewAnimations = [];
function play(target, keys) {
  if ((!reduced || frozen) && duration) {
    const elements = typeof target === 'string' ? all(target) : [target];
    for (const element of elements) {
      const frames = keys.map(([seconds, properties]) => ({ ...properties, offset: seconds / duration }));
      previewAnimations.push(element.animate(frames, { duration: duration * 1000, iterations: Infinity, easing: 'linear' }));
    }
  }
}
function manual() {
  for (const animation of previewAnimations) animation.cancel();
  previewAnimations.length = 0;
  root.dataset.mode = 'manual';
}


const fields=all('.digit input'); const cards=all('.digit'); const verify=$('.verify');
function fillCode(value){manual();root.dataset.state='entry';fields.forEach((f,i)=>f.value=value[i]||'');verify.disabled=value.length!==4;$('.hint').textContent='Didn’t get a code?';}

fields.forEach((field,i)=>{field.addEventListener('focus',()=>{if(root.dataset.mode!=='manual')fillCode('')});field.addEventListener('input',()=>{field.value=field.value.replace(/[^0-9]/g,'').slice(-1);verify.disabled=fields.some(f=>!f.value);if(field.value&&i<3)fields[i+1].focus()});field.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!field.value&&i>0)fields[i-1].focus();if(e.key==='Enter'&&!verify.disabled)checkCode()});field.addEventListener('paste',e=>{e.preventDefault();const d=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,4);fillCode(d);fields[Math.min(d.length,3)].focus()})});
$('.fill').onclick=()=>{fillCode('2468');verify.focus()};$('.wrong').onclick=()=>{fillCode('1357');checkCode()};verify.onclick=()=>{if(root.dataset.mode!=='manual')fillCode('2468');checkCode()};$('.resend').onclick=()=>{fillCode('');$('.hint').textContent='A new code was sent.';$('.resend').textContent='Resend code';fields[0].focus()};$('.replay').onclick=$('.continue').onclick=()=>{fillCode('');fields[0].focus()};

cards.forEach((card,i)=>{const [x,y]=positions[i],cx=(1.5-i)*65;play(card,[[0,{transform:'none',opacity:1}],[1.13,{transform:'none',opacity:1}],[1.55,{transform:`translate(${x}px,${y}px) scale(.8)`,opacity:1}],[2.65,{transform:`translate(${x}px,${y}px) scale(.8)`,opacity:1}],[3.03,{transform:`translate(${cx}px,0) scale(.42)`,opacity:.9}],[3.2,{transform:`translate(${cx}px,0) scale(.3)`,opacity:0}],[5.55,{transform:'none',opacity:0}],[cycle,{transform:'none',opacity:1}]])});
