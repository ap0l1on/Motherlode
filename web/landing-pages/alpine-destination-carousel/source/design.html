const get=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];
const destinations=[['Switzerland Alps','Saint','Antönien','Forest paths and high summer meadows meet a quiet alpine lake beneath a snow-covered peak.'],['Japan','Nagano','Prefecture','Follow a timber-lined street into the hills, where a pagoda rises above the roofs at sunset.'],['Morocco','Marrakech','Merzouga','Ochre ridges roll toward the horizon. The last light traces the long curves of the sand.'],['California, USA','Yosemite','National Park','Granite walls frame a green valley of tall pines, waterfalls and wide-open skies.'],['Andalusia, Spain','Los Lances','Beach','Dark coastal cliffs open onto the water. Evening light catches the waves along the rock.'],['Cappadocia, Türkiye','Göreme','Valley','Soft volcanic spires and stone dwellings rise from a warm valley in the first light of day.']];
const cards=[],stories=[],numbers=[],tracks=[],saved=new Set();let index=0,manual=false;

function pose(i,a){const slot=(i-a+6)%6;if(slot===0)return {left:'0px',top:'0px',width:'576px',height:'301px',borderRadius:'0px',opacity:1,zIndex:1};return {left:(267+(slot-1)*89)+'px',top:'141px',width:'75px',height:'113px',borderRadius:'4px',opacity:1,zIndex:8-slot};}
const seq=[0,1,2,3,4,5,0],start=[0,.165,.31,.465,.61,.77,.935];function keys(resolve){const f=[{offset:0,...resolve(0)}];for(let j=1;j<seq.length;j++){f.push({offset:start[j]-.044,...resolve(seq[j-1]),easing:'cubic-bezier(.4,0,.2,1)'},{offset:start[j],...resolve(seq[j])});}f.push({offset:1,...resolve(0)});return f;}
