  * { box-sizing: border-box; }
  body { margin: 0; width: 1080px; height: 1350px; background: var(--bg); color: var(--ink); font-family: "Manrope", sans-serif; }
  main { width: 100%; height: 100%; position: relative; isolation: isolate; overflow: hidden; }
  .art { width: 100%; height: 100%; display: block; background: var(--bg); font-family: inherit; touch-action: pan-y; user-select: none; }
  [data-slide][aria-hidden="true"] { display: none; }
  .status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .arrow { position: absolute; top: calc(50% - 40px); z-index: 1; width: 62px; height: 80px; border: 0; padding: 0; background: var(--clear); color: var(--ink); cursor: pointer; opacity: 0; }
  .previous { left: 0; } .next { right: 0; }
  .arrow span { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 1px solid currentColor; background: var(--bg); font: 600 22px/1 "Manrope", sans-serif; }
  .arrow:hover, .arrow:focus-visible { opacity: 1; }
  .arrow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  @media (max-width: 1079px) { body { width: 100vw; height: auto; aspect-ratio: 4 / 5; } main { height: auto; aspect-ratio: 4 / 5; } }

<nav aria-label="Slide navigation">
  <button class="arrow previous" type="button" aria-label="Previous slide"><span aria-hidden="true">←</span></button>
  <button class="arrow next" type="button" aria-label="Next slide"><span aria-hidden="true">→</span></button>
</nav>
<span class="status" aria-live="polite"></span>
</main>
<script>
  const artwork = document.querySelector('.art');
  const slides = [...artwork.querySelectorAll('[data-slide]')];
  const title = artwork.querySelector('title');
  const live = document.querySelector('.status');
  let index = 0;
  let touch;
  function showSlide(number, updateAddress = true) {
    const parsed = Number(number);
    index = Number.isInteger(parsed) ? Math.max(1, Math.min(slides.length, parsed)) - 1 : 0;
    slides.forEach((slide, i) => slide.setAttribute('aria-hidden', String(i !== index)));
    const description = `Slide ${index + 1} of ${slides.length}. ${slides[index].dataset.description}`;
    title.textContent = description;
    live.textContent = description;
    if (updateAddress) {
      const url = new URL(location.href);
      url.searchParams.set('slide', index + 1);
      history.replaceState(null, '', url);
    }
  }
  function move(amount) {
    showSlide(((index + amount + slides.length) % slides.length) + 1);
  }
  document.querySelector('.previous').addEventListener('click', () => move(-1));
  document.querySelector('.next').addEventListener('click', () => move(1));
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key === 'ArrowRight') move(1);
    else if (event.key === 'ArrowLeft') move(-1);
    else if (event.key === 'Home') showSlide(1);
    else if (event.key === 'End') showSlide(slides.length);
    else return;
    event.preventDefault();
  });
  artwork.addEventListener('pointerdown', event => {
    if (!event.isPrimary || event.button !== 0) return;
    touch = { x: event.clientX, y: event.clientY };
    artwork.setPointerCapture(event.pointerId);
  });
  artwork.addEventListener('pointerup', event => {
    if (!touch) return;
    const dx = event.clientX - touch.x;
    if (Math.abs(dx) > 38 && Math.abs(dx) > 1.4 * Math.abs(event.clientY - touch.y)) move(dx > 0 ? -1 : 1);
    touch = null;
  });
  artwork.addEventListener('pointercancel', () => { touch = null; });
  const readAddress = () => showSlide(new URLSearchParams(location.search).get('slide') || 1, false);
  readAddress();
  addEventListener('popstate', readAddress);
</script>
<script>
  const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
  pick();
  addEventListener("hashchange", pick);
  const t = new URLSearchParams(location.search).get("t");
  if (t !== null) {
    const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; });
    freeze();
    addEventListener("load", freeze);
  }
</script>
