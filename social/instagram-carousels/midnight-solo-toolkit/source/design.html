<script>
const stage = document.querySelector('main');
const duration = Number(document.querySelector('[name="motherlode:loop"]').content);
const motion = [];
function animate(target, keys, options = {}) {
  if (typeof target === 'string') target = document.querySelector(target);
  const list = keys.map(([time, value]) => ({ offset: time / duration, ...value }));
  const effect = target.animate(list, { duration: duration * 1000, iterations: Infinity, fill: 'both', easing: 'linear', ...options });
  motion.push(effect);
  return effect;
}
function hold(seconds) {
  for (const effect of motion) { effect.pause(); effect.currentTime = Math.max(0,Math.min(duration - .001,seconds)) * 1000; }
}
function replay() {
  for (const effect of motion) { effect.currentTime = 0; effect.play(); }
}
function bind(element, callback) {
  element.addEventListener('click', callback);
  element.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); callback(event); }
  });
}

const centers=[.66,2.12,3.60,5.11,6.68,8.16,9.69,11.21,12.68,14.38];
const exportOrder=[4,0,1,2,3,5,6,7,8,9];let current=4;
function show(index){current=(index+centers.length)%centers.length;hold(centers[current]);}
const slide=Number(new URLSearchParams(location.search).get('slide'));
if(slide>=1&&slide<=10){current=exportOrder[slide-1];const stamp=6.68;for(const animation of motion){animation.effect.updateTiming({delay:(stamp-centers[current])*1000});animation.pause();animation.currentTime=stamp*1000;}}
function resetShift(){for(const animation of motion)animation.effect.updateTiming({delay:0});}
function pickFromIndex(target) {
  const choice = target.closest('[data-jump]');
  if (!choice || Number(getComputedStyle(document.querySelector('#index')).opacity) <= .75) return false;
  resetShift();
  show(Number(choice.dataset.jump));
  return true;
}
stage.tabIndex = 0;
stage.addEventListener('keydown', event => {
  if ((event.key === 'Enter' || event.key === ' ') && pickFromIndex(event.target)) {
    event.preventDefault();
    return;
  }
  if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
    event.preventDefault();
    resetShift();
    show(current + (event.key === 'ArrowRight' ? 1 : -1));
  } else if (event.key === ' ') {
    event.preventDefault();
    resetShift();
    replay();
  }
});
stage.addEventListener('click', event => {
  if (pickFromIndex(event.target)) return;
  const box = stage.getBoundingClientRect();
  resetShift();
  show(current + (event.clientX - box.left > box.width * .5 ? 1 : -1));
});
