<script>
const duration=5.25, moments=[1.27, 2.07, 4.07, 5.19], windows=[[0.28, 1.55], [1.68, 2.45], [3.12, 4.36], [4.88, 5.25]], navWindows=[[0, 1.51], [1.51, 2.43], [2.43, 4.35], [4.35, 5.25]];

function track(el, keys) {
  return el.animate(keys.map(([t,properties])=>({...properties,offset:Math.min(1,Math.max(0,t/duration))})),{duration:duration*1000,iterations:Infinity,fill:'both'});
}
function enter(el,t,len,a,b,ease='cubic-bezier(.2,.7,.25,1)') {
  return track(el,[[0,a],[t,{...a,easing:ease}],[t+len,b],[duration,b]]);
}
function windowFor(el,start,end,fade=.18,first=false) {
  const hidden={visibility:'hidden',opacity:0};
  const shown={visibility:'visible',opacity:1};
  const keys=[[0,hidden]];
  if(start>0)keys.push([start-.001,hidden]);
  keys.push([start,{visibility:'visible',opacity:first?1:0}],[start+fade,shown],[Math.max(start+fade,end-fade),shown]);
  if(end<duration)keys.push([end,hidden],[duration,hidden]);else keys.push([end,shown]);
  return track(el,keys);
}
function prepareNumber(el,start) {
  const ns='http://www.w3.org/2000/svg', value=Number(el.dataset.counter), steps=16;
  const formatter=new Intl.NumberFormat('en-US',{minimumFractionDigits:+el.dataset.digits,maximumFractionDigits:+el.dataset.digits});
  const parent=document.createElementNS(ns,'g'); parent.setAttribute('aria-label',el.textContent);
  el.replaceWith(parent);
  const t=start+Number(el.dataset.delay), len=Number(el.dataset.length);
  for(let i=0;i<=steps;i++) {
    const step=el.cloneNode(false); step.removeAttribute('data-counter'); step.setAttribute('aria-hidden','true');
    step.textContent=el.dataset.prefix+formatter.format(value*(1-(1-i/steps)**2))+el.dataset.suffix;
    parent.append(step);
    const a=Math.min(duration,t+len*i/steps), b=Math.min(duration,t+len*(i+1)/steps);
    const off={opacity:0}, on={opacity:1};
    const frames=i===0?[[0,on],[Math.max(0,b-.0001),on],[b,off],[duration,off]]:i===steps?[[0,off],[Math.max(0,a-.0001),off],[a,on],[duration,on]]:[[0,off],[Math.max(0,a-.0001),off],[a,on],[Math.max(a,b-.0001),on],[b,off],[duration,off]];
    track(step,frames);
  }
}
for(const pan of document.querySelectorAll('[data-panel]')) {
  const i=Number(pan.dataset.panel),[start,end]=windows[i];
  windowFor(pan,start,end,Math.min(.19,(end-start)/3));
  pan.querySelectorAll('.enter').forEach(el=>enter(el,start+Number(el.dataset.lag),.28,{opacity:0,transform:'translateY(3px)'},{opacity:1,transform:'translateY(0)'}));
  pan.querySelectorAll('[data-counter]').forEach(el=>prepareNumber(el,start));
  pan.querySelectorAll('.bar-grow').forEach(el=>enter(el,start+.25+Number(el.dataset.lag||0),.60,{transform:'scaleY(0)'},{transform:'scaleY(1)'}));
  pan.querySelectorAll('.draw').forEach((el,n)=>enter(el,start+.30+n*.035,.8,{strokeDashoffset:'100'},{strokeDashoffset:'0'}));
}
for(const mark of document.querySelectorAll('[data-highlight]')){const i=+mark.dataset.highlight;windowFor(mark,navWindows[i][0],navWindows[i][1],.025,i===0);}
function selectView(i) { for(const a of document.getAnimations()){a.pause();a.currentTime=moments[i]*1000;} }
function activate(el,fn){el.addEventListener('click',fn);el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();fn();}});}
for(const control of document.querySelectorAll('[data-view]')) activate(control,()=>selectView(+control.dataset.view));
for(const control of document.querySelectorAll('[data-replay]')) activate(control,()=>{for(const a of document.getAnimations()){a.currentTime=0;a.play();}});
if(!location.search&&matchMedia('(prefers-reduced-motion:reduce)').matches)selectView(0);

enter(document.querySelector('.reveal-hole'),0.12,0.63,{transform:'scale(0)'},{transform:'scale(1)'},'cubic-bezier(.65,0,.27,1)');track(document.querySelector('.splash-logo'),[[0,{opacity:1}],[0.12,{opacity:1}],[0.27,{opacity:0}],[duration,{opacity:0}]]);
</script>
