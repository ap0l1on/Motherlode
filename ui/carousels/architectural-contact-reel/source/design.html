<title>Architectural contact reel</title><style>
@font-face {
  font-family: 'Inter';

  font-display: swap;
  src: url('fonts/inter-latin.woff2') format('woff2');
}
:root, [data-colorway="original"] {
  --bg: #BAB8A1; --surface: #8AAAA9; --ink: #FFFFFF; --muted: #F5F3E8;
  --accent: #B5A376; --on-accent: #262824; --second: #B5A97F; --third: #6C5C4F;
  --ivory: #DFD0AF; --shade: #82786B; --outline: #A9A898; --good: #698B7C;
  --hi: #FFFFFF; --lo: #242523; --clear: transparent; --photo: none;
  --meta-ink: #383838; --onyx-ink: #525252; --description-ink: #383938;
}
[data-colorway="light"] {
  --bg: #F5F7FA; --surface: #FFFFFF; --ink: #1E2933; --muted: #4F5B68;
  --accent: #396D97; --on-accent: #FFFFFF; --second: #CE8C62; --third: #9EBACF;
  --ivory: #F2D3A8; --shade: #7C7064; --outline: #BBC6CE; --good: #33704C;
  --hi: #FFFFFF; --lo: #1A2228; --clear: transparent; --photo: saturate(.75);
}
[data-colorway="dark"] {
  --bg: #171D25; --surface: #252C38; --ink: #F5F5F1; --muted: #CED5DD;
  --accent: #A6C8EA; --on-accent: #203348; --second: #DCA487; --third: #8E9EC0;
  --ivory: #DDC2A5; --shade: #75675E; --outline: #526171; --good: #A1DDB8;
  --hi: #FFFFFF; --lo: #0B1018; --clear: transparent; --photo: brightness(.85);
  --description-ink: #949699;
}
[data-colorway="mono"] {
  --bg: #EDEDED; --surface: #FCFCFC; --ink: #212121; --muted: #515151;
  --accent: #454545; --on-accent: #FFFFFF; --second: #858585; --third: #B3B3B3;
  --ivory: #D6D6D6; --shade: #737373; --outline: #B7B7B7; --good: #555555;
  --hi: #FFFFFF; --lo: #181818; --clear: transparent; --photo: grayscale(1);
}
[data-colorway="ember"] {
  --bg: #F9EFE7; --surface: #FFF8EE; --ink: #402C25; --muted: #665047;
  --accent: #A95134; --on-accent: #FFFFFF; --second: #E3A24B; --third: #C38175;
  --ivory: #F4CD9B; --shade: #95685A; --outline: #D5B7A8; --good: #487544;
  --hi: #FFFCF7; --lo: #291A1C; --clear: transparent; --photo: sepia(.2);
}
[data-colorway="lagoon"] {
  --bg: #EAF7F3; --surface: #F7FFFB; --ink: #1D4041; --muted: #466463;
  --accent: #246A72; --on-accent: #FFFFFF; --second: #77BCA9; --third: #5B95AD;
  --ivory: #E4D4A5; --shade: #6B8272; --outline: #ABCCC1; --good: #347657;
  --hi: #FFFFFF; --lo: #10292D; --clear: transparent; --photo: hue-rotate(15deg);
}
[data-colorway="orchid"] {
  --bg: #F5EDF8; --surface: #FEF9FF; --ink: #3A2C42; --muted: #605168;
  --accent: #78528A; --on-accent: #FFFFFF; --second: #D09CA3; --third: #A18BC1;
  --ivory: #EDD1B7; --shade: #856D81; --outline: #CCB9D2; --good: #466C52;
  --hi: #FFFFFF; --lo: #281C2C; --clear: transparent; --photo: hue-rotate(321deg);
}
[data-colorway="olive"] {
  --bg: #F1F2E5; --surface: #FDFBEF; --ink: #333B26; --muted: #57604B;
  --accent: #58673C; --on-accent: #FFFFFF; --second: #B89B63; --third: #9AAE74;
  --ivory: #E4D6A5; --shade: #7C795D; --outline: #BEC3A6; --good: #406B42;
  --hi: #FFFFF7; --lo: #20291C; --clear: transparent; --photo: saturate(.64);
}

* { box-sizing:border-box; }
html,body { margin:0; width:1152px; height:708px; overflow:hidden; }
body { font-family:Inter,Arial,sans-serif; background:var(--bg); color:var(--ink); }
.reel { isolation:isolate; position:relative; width:576px; height:354px; transform-origin:top left; transform:scale(2); overflow:hidden; background:var(--bg); touch-action:pan-x; }
.wash { position:absolute; inset:0; z-index:-1; background:var(--tone); }
.wash:nth-child(1) { --tone:var(--bg); }.wash:nth-child(2) { --tone:var(--surface); }.wash:nth-child(3) { --tone:var(--second); }.wash:nth-child(4) { --tone:var(--third); }
header { position:absolute; display:flex; align-items:center; justify-content:space-between; top:26px; left:48px; right:34px; height:16px; }
button { color:inherit; font:inherit; cursor:pointer; }
.menu,.next { display:grid; place-items:center; border:1px solid color-mix(in srgb,var(--ink) 18%,var(--clear)); background:var(--clear); border-radius:50%; }
.menu { width:17px; height:17px; padding:4px; }
.menu svg,.next svg { fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; }
header .meta,.description { font-size:3.8px; font-weight:550; line-height:1.45; letter-spacing:.18px; text-transform:uppercase; color:var(--ink); }
.titles { position:absolute; top:100px; left:47px; width:259px; height:85px; overflow:hidden; }
h1 { position:absolute; left:0; top:0; margin:0; font-size:73px; line-height:1.22; font-weight:615; letter-spacing:-3.7px; will-change:transform; }
.next { position:absolute; left:248px; top:174px; width:35px; height:35px; padding:11px; z-index:2; opacity:.7; }
.next:hover,.menu:hover { opacity:1; border-color:var(--ink); }
.description { position:absolute; top:250px; left:47px; color:color-mix(in srgb,var(--lo) 82%,var(--ink)); }
.description p { margin:0 0 6px; max-width:66px; }
.project { position:absolute; top:110px; left:335px; width:169px; height:121px; padding:0; border:0; background:var(--clear); transform-origin:50% 50%; transform-style:preserve-3d; backface-visibility:hidden; will-change:transform; }
.image { display:block; width:100%; height:100%; background-image:url(original-architecture-atlas.webp); background-size:400% 100%; background-position:var(--image-x) center; background-repeat:no-repeat; filter:var(--photo); }
.index { z-index:8; position:absolute; top:51px; left:49px; display:flex; gap:3px; flex-direction:column; padding:5px; border-radius:3px; background:var(--surface); box-shadow:0 4px 13px color-mix(in srgb,var(--lo) 20%,var(--clear)); }
.index[hidden] { display:none; }
.index button { color:var(--on-accent); border:0; padding:3px 6px; text-align:left; background:color-mix(in srgb,var(--bg) 70%,var(--hi)); font-size:7px; }
:focus-visible { outline:1px solid var(--ink); outline-offset:2px; }
:root[data-colorway="mono"] { filter:grayscale(1); }


[data-colorway="original"] .ink-meta { color: var(--meta-ink); }
[data-colorway="original"] main.reel > div.titles > h1:nth-of-type(2) { color: var(--onyx-ink); }
:is([data-colorway="original"], [data-colorway="dark"]) .ink-description { color: var(--description-ink); }
</style></head><body>
<main class="reel" aria-label="Architecture project carousel" tabindex="0"><div class="backgrounds" aria-hidden="true"><i class="wash"></i><i class="wash"></i><i class="wash"></i><i class="wash"></i></div>
<header><button type="button" class="menu" aria-label="Open project index" aria-expanded="false"><svg viewBox="0 0 12 12"><path d="M3 4.8h6M4 7h4" stroke-width=".8"/></svg></button><span class="meta ink-meta">Selected work &nbsp; / &nbsp; 01 — 04</span></header><nav class="index" aria-label="Project index" hidden></nav>
<div class="titles" aria-live="polite"></div><button class="next" type="button" aria-label="Next architecture project"><svg viewBox="0 0 12 12"><path d="M2.5 6h6M6 3.5 8.5 6 6 8.5"/></svg></button><div class="description"><p class="ink-description">A collection of architecture<br>in form, proportion<br>and light.</p><p class="ink-description">Selected residences<br>Building studies</p></div><div class="photos"></div></main><script>

const projects=['Aether','Onyx','Birch','Fjord'];
const titles=document.querySelector('.titles'),photos=document.querySelector('.photos'),indexMenu=document.querySelector('.index');
projects.forEach((name,i)=>{
 const title=document.createElement('h1');title.textContent=name;titles.append(title);
 const card=document.createElement('button');card.type='button';card.className='project';card.setAttribute('aria-label','Show '+name);card.style.setProperty('--image-x',(100*i/3)+'%');card.innerHTML='<span class="image"></span>';
 card.onclick=()=>manualSlide(i===activeSlide()?(i+1)%4:i);photos.append(card);
 const tab=document.createElement('button');tab.textContent=name;tab.onclick=()=>{manualSlide(i);toggleMenu(false);};indexMenu.append(tab);
});
const names=[...titles.children], cards=[...photos.children], washes=[...document.querySelectorAll('.wash')];
const pose=[
 {transform:'translate(0px,0px) perspective(400px) rotateX(0deg) rotateZ(0deg) scale(1,1)',opacity:1,filter:'blur(0px)',zIndex:4},
 {transform:'translate(-15px,100px) perspective(310px) rotateX(49deg) rotateZ(1deg) skewX(-10deg) scale(.80,.83)',opacity:.60,filter:'blur(1.25px)',zIndex:2},
 {transform:'translate(-14px,149px) perspective(310px) rotateX(64deg) rotateZ(0deg) scale(.41,.4)',opacity:0,filter:'blur(3px)',zIndex:1},
 {transform:'translate(-42px,-94px) perspective(380px) rotateX(-22deg) rotateZ(-3deg) skewX(12deg) scale(1.17,1.13)',opacity:.62,filter:'blur(2px)',zIndex:3}
];
const titlePose=rel=>({transform:'translateY('+(rel===0?0:rel===3?-86:86)+'px)',opacity:rel===0?1:0});
const washPose=rel=>({opacity:rel===0?1:0});
const tracks=[];
function framesFor(index,lookup) {
 const frames=[];
 for(let step=0;step<4;step++){
   const rel=(index-step+4)%4, style=lookup(rel);
   frames.push({...style,offset:step/4,easing:'cubic-bezier(.4,0,.16,1)'});
   frames.push({...style,offset:(step+.65)/4,easing:'cubic-bezier(.4,0,.16,1)'});
 }
 frames.push({...lookup(index),offset:1});return frames;
}
function track(element,i,get){tracks.push(element.animate(framesFor(i,get),{duration:10000,iterations:Infinity,fill:'both'}));}
for(let i=0;i<4;i++){track(cards[i],i,rel=>pose[rel]);track(names[i],i,titlePose);track(washes[i],i,washPose);}
let manualIndex=null, slideAnimations=[];
function activeSlide(){if(manualIndex!==null)return manualIndex;return Math.round(((tracks[0].currentTime||0)%10000)/2500)%4;}
function manualSlide(next) {
 const index=(next+projects.length)%projects.length;
 const snapshots=[];
 for(const node of [...cards,...names,...washes]){const style=getComputedStyle(node);snapshots.push({transform:style.transform,opacity:style.opacity,filter:style.filter,zIndex:style.zIndex});}
 tracks.forEach(animation=>animation.cancel());slideAnimations.forEach(animation=>animation.cancel());slideAnimations=[];
 manualIndex=index;
 for(let i=0;i<4;i++){
  const rel=(i-index+4)%4, dests=[pose[rel],titlePose(rel),washPose(rel)];
  [cards[i],names[i],washes[i]].forEach((node,j)=>{
   const goal=dests[j], from=snapshots[i+j*4], start={};Object.keys(goal).forEach(property=>start[property]=from[property]);
   Object.assign(node.style,goal);
   slideAnimations.push(node.animate([start,goal],{duration:520,easing:'cubic-bezier(.23,.72,.2,1)'}));
  });
 }
}
function toggleMenu(open){indexMenu.hidden=!open;document.querySelector('.menu').setAttribute('aria-expanded',String(open));}
document.querySelector('.menu').onclick=()=>toggleMenu(indexMenu.hidden);
document.querySelector('.next').onclick=()=>manualSlide(activeSlide()+1);
let wheelGate=0;
document.querySelector('.reel').addEventListener('wheel',event=>{event.preventDefault();if(performance.now()<wheelGate||!event.deltaY)return;wheelGate=performance.now()+580;manualSlide(activeSlide()+Math.sign(event.deltaY));},{passive:false});
document.addEventListener('keydown',event=>{if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(event.key)){event.preventDefault();manualSlide(activeSlide()+(['ArrowDown','ArrowRight'].includes(event.key)?1:-1));}if(event.key==='Escape')toggleMenu(false);});
let touchY; document.querySelector('.reel').addEventListener('touchstart',event=>touchY=event.touches[0].clientY,{passive:true});document.querySelector('.reel').addEventListener('touchend',event=>{const dy=touchY-event.changedTouches[0].clientY;if(Math.abs(dy)>25)manualSlide(activeSlide()+Math.sign(dy));},{passive:true});
if(matchMedia('(prefers-reduced-motion:reduce)').matches&&!new URLSearchParams(location.search).has('t'))manualSlide(0);

</script><script>  const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
  pick();
  addEventListener("hashchange", pick);
  const t = new URLSearchParams(location.search).get("t");
  if (t !== null) {
    const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; });
    freeze();
    addEventListener("load", freeze);
  }</script></body></html>
