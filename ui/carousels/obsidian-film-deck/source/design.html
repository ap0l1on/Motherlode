* {box-sizing:border-box;}html,body {width:1152px;height:628px;margin:0;overflow:hidden;}

.details {font-size:9px;line-height:14px;padding-top:7px;color:var(--muted);border-top:1px solid var(--outline);}.card.side .story p,.card.side .details,.card.side .number,.card.side header {visibility:hidden;}.card.side h2 {font-size:15px;}.card.side .story {bottom:25px;}.card.side {filter:brightness(.82);}

const ns='http://www.w3.org/2000/svg',get=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];
function tag(type,attrs){const el=document.createElementNS(ns,type);for(const [name,value] of Object.entries(attrs))el.setAttribute(name,value);return el;}
for(let i=0;i<28;i++){const x=(i*187)%1190-80,y=(i*71)%660-80,w=94+(i*57)%240;get('.shards').append(tag('path',{d:'M'+x+' '+y+'l'+w+' 42 '+(-w*.45)+' 93 '+(-w*.68)+' -41Z',fill:i%3?'var(--surface)':'var(--lo)',opacity:.15+(i%4)*.08,stroke:'var(--outline)','stroke-width':1}));}
const films=[['orbit','The Last Orbit','A ring of sunlight on the edge of the unknown.','A crew of surveyors follows a broken signal to the curved edge of a distant star.'],['city','North Elevation','A city built from the corners of a dream.','Seven intersections repeat across a glass city. An architect searches for the street that connects them.'],['water','Blue Current','A diver follows a luminous school of fish.','In a deep coastal trench, a diver traces the migrations of a fish that returns once every thirty years.'],['rain','After the Rain','The lights of an empty city reappear.','A night courier crosses the waterfront as the skyline comes back to life after a summer storm.'],['tower','The Observatory','A silent instrument hidden in the hills.','Two researchers restore a weather station and find its still-running record of a century of changing skies.'],['mesa','Red Divide','A journey to the far side of sandstone.','A cartographer enters a red canyon to finish the trail her mentor left off the map.'],['dune','Quiet Sand','The desert keeps its own calendar.','Wind and shifting dunes tell the story of a traveling settlement on the rim of an ancient lake.']];
const deck=get('.deck'),cards=[],favorites=new Set([0]);let index=0,tracks=[],live=false;
films.forEach(([id,title,line,desc],i)=>{const el=document.createElement('article');el.className='card';el.tabIndex=0;el.setAttribute('aria-label','Select '+title);el.innerHTML='<svg class="poster" viewBox="0 0 300 280" preserveAspectRatio="xMidYMid slice"><use href="#'+id+'"/></svg><div class="fade"></div><header><button type="button">↗ &nbsp;Expand</button><button type="button" aria-label="Save '+title+'">···</button></header><div class="story"><h2><span class="number">'+(i+1)+' / 7</span>'+title+'</h2><p>'+desc+'</p><div class="details">◈ &nbsp;Original film study · Studio collection<br>↳ &nbsp;Atmosphere &nbsp; · &nbsp; Field notes &nbsp; · &nbsp; Short fiction</div></div>';el.addEventListener('click',event=>{if(event.target.closest('header button')){focus(i);if(event.target===el.querySelector('button'))openFull();else favorite();}else focus(i);});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target===el){focus(i);openFull();}});cards.push(el);deck.append(el);});
function pose(i,active){const d=(i-active+10)%7-3,k=Math.abs(d),dir=-Math.sign(d);return {transform:'translate3d('+(dir*[0,220,393,539][k])+'px,'+([0,9,12,18][k])+'px,'+(-k*55)+'px) rotateY('+(-dir*[0,16,29,42][k])+'deg) scale('+[1,.88,.74,.64][k]+')',opacity:[1,.94,.80,.62][k],zIndex:9-k};}
function text(i){const f=films[i];get('.caption strong').innerHTML=f[1]+' &nbsp;<span class="rate">★ 8.'+((7+i)%10)+'</span>';get('.caption small').textContent=f[2];get('.mini use').setAttribute('href','#'+f[0]);all('.favorite').forEach(b=>b.classList.toggle('active',favorites.has(i)));}
function focus(i){get('.controls').classList.remove('touring');live=true;tracks.forEach(t=>t.cancel());tracks=[];index=(i+7)%7;cards.forEach((card,j)=>{Object.assign(card.style,pose(j,index));card.style.transition='transform .38s ease,opacity .38s ease';card.classList.toggle('side',j!==index);});text(index);}
function openFull(){const f=films[index];get('.full').hidden=false;get('.full use').setAttribute('href','#'+f[0]);get('.full h2').textContent=f[1];get('.full p').textContent=f[3];get('.full button').focus();}
function favorite(){if(favorites.has(index))favorites.delete(index);else favorites.add(index);text(index);}
const sequence=[0,0,1,2,2,3,4,5,3,2,1,0],times=[0,.10,.18,.26,.36,.44,.54,.64,.73,.82,.91,1];
const captions=films.map((f,i)=>{const row=document.createElement('div');row.className='alternate';row.innerHTML='<svg class="mini" viewBox="0 0 300 280"><use href="#'+f[0]+'"/></svg><div class="caption"><strong>'+f[1]+' <span class="rate">★ 8.'+((7+i)%10)+'</span></strong><small>'+f[2]+'</small></div>';get('.controls').append(row);return row;});
function tour(){get('.controls').classList.add('touring');tracks.forEach(t=>t.cancel());tracks=[];live=false;index=0;get('.full').hidden=true;text(0);captions.forEach((cap,i)=>tracks.push(cap.animate(sequence.map((active,k)=>({offset:times[k],opacity:active===i?1:0})),{duration:5600,iterations:Infinity,easing:'linear'})));cards.forEach((card,i)=>{card.removeAttribute('style');card.classList.remove('side');const opts={duration:5600,iterations:Infinity,easing:'linear'};tracks.push(card.animate(sequence.map((active,k)=>({offset:times[k],...pose(i,active)})),opts));for(const part of card.querySelectorAll('.story p,.details,.number,header'))tracks.push(part.animate(sequence.map((active,k)=>({offset:times[k],opacity:active===i?1:0})),opts));});}
function current(){if(live||!tracks.length)return index;const t=(tracks[0].currentTime%5600)/5600;return sequence[times.reduce((p,v,i)=>Math.abs(v-t)<Math.abs(times[p]-t)?i:p,0)];}
all('[data-do]').forEach(b=>b.addEventListener('click',()=>{const action=b.dataset.do,from=current();if(action==='play'){tour();return;}if(action==='next'||action==='prev'||action==='first'){focus(action==='first'?0:from+(action==='next'?1:-1));return;}focus(from);if(action==='expand')openFull();else favorite();}));
get('.full button').addEventListener('click',()=>get('.full').hidden=true);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();focus(current()+(e.key==='ArrowRight'?1:-1));}if(e.key==='Escape')get('.full').hidden=true;});tour();
if(matchMedia('(prefers-reduced-motion: reduce)').matches&&!new URLSearchParams(location.search).has('t'))focus(0);
</script><script>  const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
