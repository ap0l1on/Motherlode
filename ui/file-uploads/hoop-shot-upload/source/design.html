</style></head><body><main><section class="sheet"><header><h1>Upload files</h1><div><button type="button" class="sound" aria-label="Toggle upload sound" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h4l5-4v12l-5-4H4Zm12-1q3 3 0 6m3-9q6 6 0 12"/></svg></button><span class="badge">Uploaded &nbsp;<b><span class="two">2</span><span class="three">3</span></b></span></div></header><p>Drag and drop, or take the shot.</p>

<script>
const get=s=>document.querySelector(s),target=get('.target'),input=get('input'),paper=get('.paper');let tracks=[],total=2,sound=false,timer;
function add(el,keyframes){const a=el.animate(keyframes.map(frame=>({easing:'ease-in-out',...frame})),{duration:5600,iterations:Infinity,easing:'linear'});tracks.push(a);}
const fade=(a,b)=>[{offset:0,opacity:0},{offset:a,opacity:0},{offset:b,opacity:1},{offset:.89,opacity:1},{offset:.98,opacity:0},{offset:1,opacity:0}];
function demo(){add(paper,[{offset:0,transform:'translate(0,0) rotate(-4deg)'},{offset:.12,transform:'translate(-112px,45px) rotate(-6deg)'},{offset:.22,transform:'translate(-63px,-115px) rotate(-29deg) scale(.7)'},{offset:.286,transform:'translate(-12px,-197px) rotate(-15deg) scale(.48)'},{offset:.33,transform:'translate(13px,-175px) rotate(-10deg) scale(.45)'},{offset:.39,opacity:1,transform:'translate(33px,-118px) rotate(6deg) scale(.34)'},{offset:.45,opacity:0,transform:'translate(34px,-78px) scale(.13)'},{offset:.50,opacity:0,transform:'translate(-78px,41px)'},{offset:.55,opacity:1,transform:'translate(-78px,41px)'},{offset:.93,transform:'translate(-78px,41px)'},{offset:1,transform:'translate(0,0)'}]);add(get('.status'),fade(.41,.46));add(get('.prompt'),[{offset:0,opacity:1},{offset:.41,opacity:1},{offset:.46,opacity:0},{offset:.89,opacity:0},{offset:.98,opacity:1},{offset:1,opacity:1}]);add(get('.fill'),[{offset:0,transform:'scaleX(0)'},{offset:.43,transform:'scaleX(0)'},{offset:.61,transform:'scaleX(1)'},{offset:1,transform:'scaleX(1)'}]);add(get('.three'),fade(.54,.58));add(get('.two'),[{offset:0,opacity:1},{offset:.54,opacity:1},{offset:.58,opacity:0},{offset:.89,opacity:0},{offset:.98,opacity:1},{offset:1,opacity:1}]);add(get('.basket'),[{offset:0,transform:'scale(1)'},{offset:.39,transform:'scale(1)'},{offset:.43,transform:'scale(.96,1.05)'},{offset:.48,transform:'scale(1)'},{offset:1,transform:'scale(1)'}]);}
function beep(){if(!sound)return;try{const ac=new AudioContext(),osc=ac.createOscillator(),gain=ac.createGain();osc.connect(gain);gain.connect(ac.destination);osc.frequency.setValueAtTime(420,ac.currentTime);osc.frequency.exponentialRampToValueAtTime(760,ac.currentTime+.1);gain.gain.setValueAtTime(.05,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.15);osc.start();osc.stop(ac.currentTime+.16);osc.onended=()=>ac.close();}catch{}}
function shot(file){if(!file)return;clearTimeout(timer);tracks.forEach(a=>a.cancel());tracks=[];get('.filename').textContent=file.name;get('.type').textContent=(file.name.split('.').pop()||'FILE').slice(0,5).toUpperCase();get('.size').textContent=file.size<1048576?(Math.max(1,file.size/1024).toFixed(0)+' KB'):((file.size/1048576).toFixed(1)+' MB');get('.two').textContent=total;get('.three').textContent=total+1;demo();tracks.forEach(a=>{a.currentTime=0;a.play();});timer=setTimeout(()=>{total++;tracks.forEach(a=>{a.pause();a.currentTime=3900;});beep();},2800);}
input.addEventListener('change',()=>{shot(input.files[0]);input.value='';});target.addEventListener('dragover',e=>{e.preventDefault();target.classList.add('hover');});target.addEventListener('dragleave',()=>target.classList.remove('hover'));target.addEventListener('drop',e=>{e.preventDefault();target.classList.remove('hover');shot(e.dataTransfer.files[0]);});get('.sound').addEventListener('click',e=>{sound=!sound;e.currentTarget.setAttribute('aria-pressed',String(sound));beep();});demo();
if(matchMedia('(prefers-reduced-motion: reduce)').matches&&!new URLSearchParams(location.search).has('t'))tracks.forEach(a=>{a.pause();a.currentTime=0;});
</script><script>  const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
