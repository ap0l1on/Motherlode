<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="motherlode:size" content="864x576">
<meta name="motherlode:scale" content="2">
<meta name="motherlode:loop" content="8">
<meta name="motherlode:still" content="3">
<title>Rose filament torus</title><style>
:root, [data-colorway="original"] {
  --bg: #050306; --halo: #85102E; --inner: #FFD4AE; --middle: #FF97A7;
  --edge: #FF3486; --clear: transparent;
}
[data-colorway="light"] {
  --bg: #F5F0F3; --halo: #BC9AAC; --inner: #683956; --middle: #A74A80;
  --edge: #BE3069; --clear: transparent;
}
[data-colorway="dark"] {
  --bg: #080B14; --halo: #351C54; --inner: #FFD7C0; --middle: #CF82E2;
  --edge: #E759BC; --clear: transparent;
}
[data-colorway="mono"] {
  --bg: #060606; --halo: #555555; --inner: #FAFAFA; --middle: #CBCBCB;
  --edge: #898989; --clear: transparent;
}
[data-colorway="ember"] {
  --bg: #120809; --halo: #853B0D; --inner: #FFF5A4; --middle: #FFB267;
  --edge: #F15739; --clear: transparent;
}
[data-colorway="lagoon"] {
  --bg: #021014; --halo: #0E535B; --inner: #D8FFE8; --middle: #76E9D1;
  --edge: #33AEC9; --clear: transparent;
}
[data-colorway="orchid"] {
  --bg: #10091B; --halo: #582B75; --inner: #F7D9FF; --middle: #DE9AFF;
  --edge: #9761F0; --clear: transparent;
}
[data-colorway="mint"] {
  --bg: #03120B; --halo: #174C2C; --inner: #ECFFD0; --middle: #B2F59C;
  --edge: #44C78F; --clear: transparent;
}
* { box-sizing:border-box; }html,body { margin:0; }
main,button { width:864px; height:576px; position:relative; overflow:hidden; }
main { background:radial-gradient(ellipse 22% 37% at 50% 49%,color-mix(in srgb,var(--halo) 27%,var(--bg)),var(--bg) 120%); }
button { display:block; margin:0; border:0; padding:0; background:none; cursor:pointer; }
button:focus-visible { outline:2px solid var(--edge); outline-offset:-5px; }
svg { width:100%; height:100%; display:block; }
h1 { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
</style></head><body><main><h1>Rose filament torus</h1><button type="button" aria-label="Pause loader motion" aria-pressed="false"><svg viewBox="0 0 576 384" aria-hidden="true"><defs>
  <radialGradient id="thread-color" gradientUnits="userSpaceOnUse" cx="288" cy="188" r="108"><stop offset=".37" style="stop-color:var(--inner)"/><stop offset=".54" style="stop-color:var(--inner)"/><stop offset=".73" style="stop-color:var(--middle)"/><stop offset=".96" style="stop-color:var(--edge)"/></radialGradient>
  <filter id="glow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="2.65"/></filter>
</defs><g id="wheel" fill="none" stroke="url(#thread-color)" stroke-linecap="round" stroke-linejoin="round"></g></svg></button><script>
  const tau=2*Math.PI,ns='http://www.w3.org/2000/svg';
  const rotations=[];
  const wheel=document.querySelector('#wheel');
  function point(angle,radius,first) {
    const x=288+radius*Math.cos(angle),y=188+radius*Math.sin(angle)*.99;
    return (first?'M':'L')+x.toFixed(1)+' '+y.toFixed(1);
  }
  function blades(bend,count) {
    const parts=[];
    for(let i=0;i<count;i++) {
      const a=tau*i/count;
      for(let j=0;j<28;j++) {
        const b=tau*j/28,u=(Math.cos(b)+1)/2;
        const radius=78+25*Math.cos(b)+10.7*bend*Math.sin(8*a-2.2*u);
        const angle=a+.55*u+.09*bend*Math.sin(8*a)+Math.sin(b)*(.018+.055*(1-bend));
        parts.push(point(angle,radius,j===0));
      }
      parts.push('Z');
    }
    return parts.join('');
  }
  function weave(twist) {
    const parts=[];
    for(let ring=0;ring<8;ring++) {
      for(let j=0;j<650;j++) {
        const a=tau*j/650,phase=31*a+ring*1.74;
        const radius=55+6.55*ring+6.4*Math.cos(phase)+1.7*Math.sin(5*a-ring*.44)+twist*2.9*Math.sin(8*a-ring*.42);
        const angle=a+ring*.014+.057*Math.sin(phase)+twist*.025*Math.sin(8*a);
        parts.push(point(angle,radius,j===0));
      }
      parts.push('Z');
    }
    return parts.join('');
  }
  const outlines=[blades(1,112),blades(.56,66),weave(.34),weave(1)];
  const sequence=[[0,1,0,0,0],[.07,.8,.2,0,0],[.16,0,1,0,0],[.255,0,.32,.68,0],[.32,0,0,1,0],[.50,0,0,1,0],[.59,0,0,.1,.9],[.67,0,0,1,0],[.81,0,.78,.22,0],[.91,.63,.37,0,0],[1,1,0,0,0]];
  const options={duration:8000,iterations:Infinity,easing:'linear'};
  outlines.forEach((d,index)=>{
    const group=document.createElementNS(ns,'g');
    const shape=document.createElementNS(ns,'path');shape.id='strand-'+index;shape.setAttribute('d',d);
    document.querySelector('defs').append(shape);
    for(const isGlow of [true,false]) {
      const use=document.createElementNS(ns,'use');use.setAttribute('href','#'+shape.id);
      use.setAttribute('stroke-width',isGlow?'4.1':'1.20');use.setAttribute('opacity',isGlow?'.84':'.87');
      if(isGlow)use.setAttribute('filter','url(#glow)');group.append(use);
    }
    wheel.append(group);
    rotations.push(group.animate(sequence.map(row=>({offset:row[0],opacity:row[index+1]})),options));
  });
  wheel.style.transformOrigin='288px 188px';
  rotations.push(wheel.animate([{transform:'rotate(0deg)'},{transform:'rotate(45deg)'}],options));
  const control=document.querySelector('button');
  function pauseAll(pause) {
    rotations.forEach(animation=>pause?animation.pause():animation.play());
    control.setAttribute('aria-pressed',String(pause));control.setAttribute('aria-label',pause?'Resume loader motion':'Pause loader motion');
  }
  control.addEventListener('click',()=>pauseAll(rotations[0].playState==='running'));
  if(matchMedia('(prefers-reduced-motion: reduce)').matches&&!new URLSearchParams(location.search).has('t')){
    pauseAll(true);rotations.forEach(animation=>animation.currentTime=3000);
  }
</script><script>
  const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
  pick();
  addEventListener("hashchange", pick);
  const t = new URLSearchParams(location.search).get("t");
  if (t !== null) {
    const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; });
    freeze();
    addEventListener("load", freeze);
  }
</script></main></body></html>
