:root { --height: 238px; --bar-y: 95px; --bar-height: 76px; }

* { box-sizing: border-box; }
html, body { width: 576px; height: var(--height); margin: 0; overflow: hidden; }
body { background: var(--wall); font: 500 10px/1.15 Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
main { position: relative; width: 100%; height: 100%; isolation: isolate; }
.room { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.dock { position: absolute; left: 62px; top: var(--bar-y); width: 445px; height: var(--bar-height); }
.surface { position: absolute; inset: 0; border: 1px solid color-mix(in srgb, var(--white) 32%, transparent);
  border-radius: 35px; overflow: hidden;
  background: linear-gradient(110deg,color-mix(in srgb,var(--glass) 48%,transparent),color-mix(in srgb,var(--glass) 66%,transparent));
  box-shadow: inset 0 1px 1px color-mix(in srgb,var(--white) 9%,transparent), 0 5px 12px color-mix(in srgb,var(--black) 16%,transparent);
  backdrop-filter: blur(9px); }
.choices { position: absolute; inset: 0 13px; display: grid; grid-template-columns: repeat(5,1fr); }
button { font: inherit; color: var(--ink); padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.choice { position: relative; min-width: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; }
.choice:focus-visible { outline: 1px solid var(--accent); outline-offset: -6px; border-radius: 21px; }
.glyph { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.label { letter-spacing: .018em; line-height: 1; white-space: nowrap; }
@property --cursor { syntax: '<length>'; inherits: true; initial-value: 53px; }
@property --tint { syntax: '<number>'; inherits: true; initial-value: 0; }

.dock { --gel: color-mix(in srgb,var(--rose) calc(var(--tint) * 100%),var(--honey)); }
.fluid { position: absolute; left: 0; top: -98px; width: 445px; height: 174px; overflow: visible; }
.drop-shape { fill: var(--gel); }
.gel-gloss { fill: url(#gel-sheen); stroke: color-mix(in srgb,var(--white) 60%,transparent); stroke-width: 1.2px; }
.choices { inset-inline: 0; }
.choice { gap: 5px; color: var(--honey-ink); font-weight: 600; padding-bottom: 2px; }
.choice .glyph { width: 21px; height: 21px; stroke-width: 1.95px; }
.select-dot { position: absolute; left: -2px; bottom: 7px; width: 4px; height: 4px; transform: translateX(var(--cursor));
  border-radius: 50%; background: var(--honey-ink); }
.flying-glyph { position: absolute; width: 22px; height: 22px; top: 18px; margin-left: -11px;
  color: var(--honey-ink); pointer-events: none; opacity: 0; }
.flying-glyph .glyph { width: 22px; height: 22px; }

.drop-body,.neck { transform-box:fill-box; transform-origin:center; }
.neck { transform:scaleY(0); }

<script>

const styleName = 'honey';
const dock = document.querySelector('.dock');

  const first = forIndex(initial);

}
function notch(center) {
  const lead = Math.max(20,center-53);
  return 'path("M 1 44 Q 1 9 20 8 H '+lead+
    ' C '+(center-38)+' 8 '+(center-36)+' 18 '+(center-28)+' 26 C '+(center-14)+' 43 '+(center+14)+' 43 '+(center+28)+' 26 C '+
    (center+37)+' 13 '+(center+40)+' 7 '+(center+52)+' 7 H 415 Q 444 7 444 41 Q 444 79 412 79 H 32 Q 1 79 1 44 Z")';
}

  makeTrack(at('.notch-underlay'),i=>({'clip-path':notch(centers[i])}));

}

  makeTrack(buttons[0].querySelector('.glyph'),i=>({fill:i===0?'var(--ink)':'transparent'}));

}
buttons.forEach((button,n) => {
  const glyph = button.querySelector('.glyph');
  if (styleName === 'spot') makeTrack(glyph,i=>({transform:i===n?'scale(1.09)':'scale(.94)',opacity:i===n?'1':'.8',color:i===n?'var(--ink)':'var(--muted)'}));

function pulse(element,index,start,unit,mapper,repeat) {
  const keys=[[0,0],...[[0,0],[.12,.16],[.32,.68],[.52,1],[.68,.92],[.82,.48],[1,0]]

  const k = keys.map(([t,h])=>({...mapper(h),offset:Math.min(1,t/total),easing:'cubic-bezier(.28,.45,.44,.95)'}));

  const body = dock.querySelectorAll('.drop-body')[n], neck = dock.querySelectorAll('.neck')[n];
  const flyer = dock.querySelectorAll('.flying-glyph')[n], glyph=buttons[n].querySelector('.glyph');
  const unit=.67;
  const neckHeight=h=>h>0&&h<.69?Math.sin(h/.69*Math.PI):0;

buttons[initial].setAttribute('aria-pressed','true');
buttons.forEach((button,i)=>{
  button.addEventListener('click',()=>choose(i));
  button.addEventListener('keydown',event=>{
    const next = event.key==='ArrowRight' ? (i+1)%5 : event.key==='ArrowLeft' ? (i+4)%5 : event.key==='Home' ? 0 : event.key==='End' ? 4 : null;
    if(next!==null){ event.preventDefault(); buttons[next].focus(); choose(next); }
  });
});

</script>
<script>
  const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
  pick();
  addEventListener("hashchange", pick);
  const t = new URLSearchParams(location.search).get("t");
  if (t !== null) {
    const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; });
    freeze();
    addEventListener("load", freeze);
  }
</script>
