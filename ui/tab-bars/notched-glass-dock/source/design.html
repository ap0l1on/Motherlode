:root { --height: 144px; --bar-y: 38px; --bar-height: 80px; }

* { box-sizing: border-box; }
html, body { width: 576px; height: var(--height); margin: 0; overflow: hidden; }
body { background: var(--wall); font: 500 10px/1.15 Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
main { position: relative; width: 100%; height: 100%; isolation: isolate; }
.room { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.dock { position: absolute; left: 62px; top: var(--bar-y); width: 445px; height: var(--bar-height); }
.surface { position: absolute; inset: 0; border: 1px solid color-mix(in srgb, var(--white) 32%, transparent);
  border-radius: 35px; overflow: hidden;
  background: linear-gradient(110deg,color-mix(in srgb,var(--glass) 48%,transparent),color-mix(in srgb,var(--glass) 66%,transparent));
  box-shadow: inset 0 1px 1px color-mix(in srgb,var(--white) 9%,transparent), 0 5px 12px color-mix(in srgb,var(--black) 16%,transparent);
  backdrop-filter: blur(9px); }
.choices { position: absolute; inset: 0 13px; display: grid; grid-template-columns: repeat(5,1fr); }
button { font: inherit; color: var(--ink); padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.choice { position: relative; min-width: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; }
.choice:focus-visible { outline: 1px solid var(--accent); outline-offset: -6px; border-radius: 21px; }
.glyph { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.label { letter-spacing: .018em; line-height: 1; white-space: nowrap; }
@property --cursor { syntax: '<length>'; inherits: true; initial-value: 53px; }
@property --tint { syntax: '<number>'; inherits: true; initial-value: 0; }

.notch-underlay { position:absolute; inset:-1px 0 0; background:color-mix(in srgb,var(--glass) 14%,transparent); backdrop-filter:blur(11px); }
.outline { position: absolute; width: 445px; height: 81px; left: 0; bottom: 0; overflow: visible; }
.shell { fill: url(#frost); stroke: color-mix(in srgb,var(--white) 51%,transparent); stroke-width: 1.35px; }
.bloom { fill: none; stroke: color-mix(in srgb,var(--white) 39%,transparent); stroke-width: 3.5px; filter: blur(3px); }
.floating { position: absolute; z-index: 1; top: -15px; left: -24px; width: 48px; height: 48px; border-radius: 50%;
  transform: translateX(var(--cursor)); display: grid; place-items: center; color: var(--ink);
  background: linear-gradient(130deg,color-mix(in srgb,var(--accent) 39%,var(--screen)),color-mix(in srgb,var(--accent) 18%,var(--screen)));
  box-shadow: inset 0 0 0 1.4px color-mix(in srgb,var(--white) 38%,transparent), inset 3px 4px 9px color-mix(in srgb,var(--accent) 16%,transparent),0 3px 7px color-mix(in srgb,var(--black) 60%,transparent);
  pointer-events: none; }
.floating .glyph { position: absolute; width: 21px; height: 21px; }
.floating .glyph, .choice:first-child .glyph { stroke-width: 2.05; }
.grip { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); height: 5px; width: 110px; border-radius: 4px;
  background: color-mix(in srgb,var(--paper) 79%,transparent); box-shadow: 0 1px color-mix(in srgb,var(--black) 22%,transparent); }
.choices { padding-bottom: 14px; }

.drop-body,.neck { transform-box:fill-box; transform-origin:center; }
.neck { transform:scaleY(0); }

 href="#icon-user"/></svg><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-bell"/></svg></div><i class="grip"></i><nav class="choices" aria-label="Section navigation"><button class="choice" type="button" aria-label="Home" aria-pressed="false"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-home"/></svg></button>

<script>

const styleName = 'orbit';
const dock = document.querySelector('.dock');
const buttons = [...dock.querySelectorAll('.choice')];
const centers = [55.5, 139, 222.5, 306, 389.5];
const loop = 2.5;
const initial = styleName === 'honey' ? 4 : 0;
const at = (selector) => dock.querySelector(selector);
const slots = [];
const tracks = [];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches && !location.search.includes('t=');
const easing = 'cubic-bezier(.2,.73,.22,1)';
// Times are local to this control. The neighboring demonstrations and pauses
// in the screen recording have been removed from its standalone loop.
const beats = styleName === 'honey'
  ? [[0,4],[.29,4],[.39,2],[.93,2],[1.04,1],[1.88,1],[2.02,4],[2.5,4]]
  : [[0,0],[.23,0],[.54,1],[.8,1],[1.14,2],[1.88,2],[2.25,0],[2.5,0]];
function makeTrack(element, forIndex) {
  const first = forIndex(initial);
  for (const [key, value] of Object.entries(first)) element.style.setProperty(key,value);
  const frames = beats.map(([time, index]) => ({...forIndex(index),offset:time/loop,easing}));
  if (!reduced) tracks.push(element.animate(frames,{duration:loop*1000,iterations:Infinity,fill:'both'}));
  slots.push([element, forIndex]);
}
function notch(center) {
  const lead = Math.max(20,center-53);
  return 'path("M 1 44 Q 1 9 20 8 H '+lead+
    ' C '+(center-38)+' 8 '+(center-36)+' 18 '+(center-28)+' 26 C '+(center-14)+' 43 '+(center+14)+' 43 '+(center+28)+' 26 C '+
    (center+37)+' 13 '+(center+40)+' 7 '+(center+52)+' 7 H 415 Q 444 7 444 41 Q 444 79 412 79 H 32 Q 1 79 1 44 Z")';
}
makeTrack(dock,i=>({'--cursor':centers[i]+'px'}));
if (styleName === 'orbit') {
  makeTrack(at('.notch-underlay'),i=>({'clip-path':notch(centers[i])}));
  [at('.shell'),at('.bloom')].forEach(path=>makeTrack(path,i=>({d:notch(centers[i])})));
  [...at('.floating').children].forEach((glyph,n)=>makeTrack(glyph,i=>({opacity:i===n?'1':'0'})));
}
if (styleName === 'wave') {
  makeTrack(buttons[0].querySelector('.glyph'),i=>({fill:i===0?'var(--ink)':'transparent'}));
  makeTrack(at('.search-field'),i=>({opacity:i===1?'1':'0',transform:i===1?'scale(1,1)':'scale(.12,.65)'}));
}
buttons.forEach((button,n) => {
  const glyph = button.querySelector('.glyph');
  if (styleName === 'spot') makeTrack(glyph,i=>({transform:i===n?'scale(1.09)':'scale(.94)',opacity:i===n?'1':'.8',color:i===n?'var(--ink)':'var(--muted)'}));
  if (styleName === 'wave') {
    makeTrack(button.querySelector('.spark'),i=>({opacity:i===n?'1':'0'}));
    makeTrack(glyph,i=>({filter:i===n?'drop-shadow(0 0 2px var(--accent))':'drop-shadow(0 0 0px transparent)'}));
  }
  if (styleName === 'orbit') makeTrack(glyph,i=>({opacity:i===n?'0':'1',transform:i===n?'translateY(-12px)':'translateY(0)'}));
});
function pulse(element,index,start,unit,mapper,repeat) {
  const keys=[[0,0],...[[0,0],[.12,.16],[.32,.68],[.52,1],[.68,.92],[.82,.48],[1,0]]
    .map(([t,h])=>[start+t*unit,h]),[repeat ? loop : start+unit,0]];
  const total = repeat ? loop : start+unit;
  const k = keys.map(([t,h])=>({...mapper(h),offset:Math.min(1,t/total),easing:'cubic-bezier(.28,.45,.44,.95)'}));
  return element.animate(k,{duration:total*1000,iterations:repeat?Infinity:1,fill:repeat?'both':'none'});
}
function droplet(n,start,repeat) {
  const body = dock.querySelectorAll('.drop-body')[n], neck = dock.querySelectorAll('.neck')[n];
  const flyer = dock.querySelectorAll('.flying-glyph')[n], glyph=buttons[n].querySelector('.glyph');
  const unit=.67;
  const neckHeight=h=>h>0&&h<.69?Math.sin(h/.69*Math.PI):0;
  tracks.push(pulse(body,n,start,unit,h=>({transform:'translateY('+(-109*h)+'px) scale('+(.88+.12*h)+','+(1+.1*Math.sin(Math.PI*h))+')'}),repeat));
  tracks.push(pulse(neck,n,start,unit,h=>({transform:'translateY('+(-18*neckHeight(h))+'px) scale(1,'+(neckHeight(h)*1.7)+')'}),repeat));
  tracks.push(pulse(flyer,n,start,unit,h=>({opacity:h>0?'1':'0',transform:'translateY('+(-109*h)+'px)'}),repeat));
  tracks.push(pulse(glyph,n,start,unit,h=>({opacity:h>0?'0':'1'}),repeat));
}
if (styleName === 'honey') {
  makeTrack(dock,i=>({'--tint':i===1?'1':'0'}));
  if (!reduced) { droplet(2,.28,true); droplet(1,.98,true); }
}
let current=initial;
function choose(index) {
  const values=slots.map(([element,build])=>{
    const target=build(index); const css=getComputedStyle(element);
    return [element,Object.fromEntries(Object.keys(target).map(k=>[k,css.getPropertyValue(k)])),target];
  });
  for (const animation of tracks.splice(0)) animation.cancel();
  for (const [element,from,to] of values) {
    for (const [k,v] of Object.entries(to)) element.style.setProperty(k,v);
    if (!reduced) tracks.push(element.animate([from,to],{duration:310,easing}));
  }
  if (styleName==='honey'&&!reduced) droplet(index,0,false);
  current=index;
  buttons.forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));
  if (styleName==='wave') at('input').tabIndex = index===1 ? 0 : -1;
}
buttons[initial].setAttribute('aria-pressed','true');
buttons.forEach((button,i)=>{
  button.addEventListener('click',()=>choose(i));
  button.addEventListener('keydown',event=>{
    const next = event.key==='ArrowRight' ? (i+1)%5 : event.key==='ArrowLeft' ? (i+4)%5 : event.key==='Home' ? 0 : event.key==='End' ? 4 : null;
    if(next!==null){ event.preventDefault(); buttons[next].focus(); choose(next); }
  });
});

</script>
<script>
  const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
  pick();
  addEventListener("hashchange", pick);
  const t = new URLSearchParams(location.search).get("t");
  if (t !== null) {
    const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; });
    freeze();
    addEventListener("load", freeze);
  }
</script>
