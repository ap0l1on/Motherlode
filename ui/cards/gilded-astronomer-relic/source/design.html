<div class="tilt"><button type="button" aria-label="Flip the astronomer relic card" aria-pressed="false"><span class="face"><span class="title">The astronomer</span><span class="caption">Read the stars</span></span><span class="face back"></span></button></div><p class="guide">Move to tilt · Drag to rotate · Double click to flip</p></main><script>
const get=s=>document.querySelector(s),stage=get('main'),tilt=get('.tilt'),card=get('button'),piece=get('.relic-wrap');let tracks=[],live=false,angle=0,dragStart=null,skipClick=false,lastClick=0;
function anim(el,frames){tracks.push(el.animate(frames.map(k=>({easing:'ease-in-out',...k})),{duration:7800,iterations:Infinity}));}

function manual(){if(live)return;live=true;tracks.forEach(a=>a.cancel());get('.intro').style.opacity=0;piece.style.opacity=1;tilt.style.opacity=1;get('.guide').style.opacity=1;card.style.transition='transform .48s cubic-bezier(.25,.75,.25,1)';}
function flip(){manual();angle+=180;card.style.transform='rotateY('+angle+'deg)';card.setAttribute('aria-pressed',String(Math.round(angle/180)%2===1));}
stage.addEventListener('pointermove',e=>{if(!live)return;const box=stage.getBoundingClientRect(),x=(e.clientX-box.left)/box.width-.5,y=(e.clientY-box.top)/box.height-.5;tilt.style.transform='rotateY('+(x*14)+'deg) rotateX('+(-y*9)+'deg)';piece.style.transform='translate('+(x*6)+'px,'+(y*4)+'px)';if(dragStart){const dx=e.clientX-dragStart.x;if(Math.abs(dx)>5){skipClick=true;card.style.transition='none';card.style.transform='rotateY('+(dragStart.angle+dx*.45)+'deg)';}}});
card.addEventListener('pointerdown',e=>{manual();skipClick=false;dragStart={x:e.clientX,angle};card.setPointerCapture(e.pointerId);});card.addEventListener('pointerup',e=>{if(dragStart&&skipClick){angle=Math.round((dragStart.angle+(e.clientX-dragStart.x)*.45)/180)*180;card.style.transition='transform .3s';card.style.transform='rotateY('+angle+'deg)';}dragStart=null;});card.addEventListener('click',()=>{if(skipClick){skipClick=false;return;}const now=performance.now();if(now-lastClick>280)flip();lastClick=now;});

</script><script>  const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
