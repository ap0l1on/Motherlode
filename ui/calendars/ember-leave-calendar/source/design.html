* { box-sizing: border-box; }
html,body { margin: 0; width: 864px; height: 855px; overflow: hidden; }
body { color: var(--ink); background: var(--bg); font-family: Inter, Arial, sans-serif; }
.calendar-stage { position: relative; width: 576px; height: 570px; transform: scale(1.5); transform-origin: top left; background: radial-gradient(ellipse at 23% 28%,var(--surface),var(--bg) 59%,var(--lo) 100%); font-size: 9px; }
button,input,select,textarea { color: inherit; font: inherit; }

.panel { position: absolute; left: 49px; top: 97px; width: 294px; min-height: 310px; padding: 17px; border-radius: 13px; background: color-mix(in srgb,var(--surface) 65%,var(--clear)); box-shadow: 0 8px 19px color-mix(in srgb,var(--lo) 21%,var(--clear)); }
header { display: flex; align-items: center; gap: 6px; padding-bottom: 18px; }
h1 { margin: 0 auto 0 0; font-size: 16px; letter-spacing: -.65px; font-weight: 500; }
.today,.step,.add { border-radius: 15px; height: 24px; }
.today { padding: 0 10px; font-size: 8px; border: 1px solid var(--outline); background: var(--clear); }
.step { width: 16px; padding: 0; background: var(--clear); font-size: 12px; color: var(--muted); }
.add { background: var(--accent); color: var(--on-accent); width: 40px; font-size: 14px; }
.calendar { padding: 14px 17px 15px; background: var(--bg); border-radius: 12px; }
.week,.days { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
.week { margin-bottom: 4px; }
.week span,.day { position: relative; display: flex; justify-content: center; align-items: center; border-radius: 5px; overflow: hidden; background: color-mix(in srgb,var(--outline) 80%,var(--bg)); }
.week span { height: 21px; color: var(--muted); font-size: 8px; }
.day { padding: 0; height: 27px; color: var(--muted); font-size: 8px; }
.day.prev-month { opacity: .57; }
.day.has-event::after { content: ''; position: absolute; right: 6px; top: 5px; height: 3.5px; width: 3.5px; border-radius: 50%; background: var(--second); }
.day.in-range { background: color-mix(in srgb,var(--accent) 43%,var(--bg)); color: var(--ink); }
.day.chosen { color: var(--on-accent); background: var(--accent); font-weight: 650; }
.day:hover,.year-view button:hover { box-shadow: inset 0 0 0 1px var(--accent); }
footer { margin-top: 15px; display: flex; align-items: center; gap: 7px; min-height: 16px; }
footer button { display: inline-flex; align-items: center; gap: 4px; padding: 0; background: var(--clear); font-size: 8px; }
footer button::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--second); }
footer button:nth-child(2)::before { background: var(--third); }
footer span { font-size: 8px; margin-left: auto; }
.year-view { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; }
.year-view button { height: 38px; background: var(--outline); border-radius: 5px; }
.editor { position: absolute; top: 176px; left: 352px; width: 201px; min-height: 290px; padding: 14px 17px 18px; border-radius: 13px; background: var(--surface); box-shadow: 0 5px 20px color-mix(in srgb,var(--lo) 55%,var(--clear)); }
.editor label { display: block; font-size: 8px; line-height: 1.3; margin: 0 0 4px; }
.fields { display: grid; grid-template-columns: 1.4fr 1fr; gap: 4px; margin-bottom: 10px; }
input,select,textarea { box-sizing: border-box; min-width: 0; border: 0; border-radius: 3px; background: color-mix(in srgb,var(--outline) 75%,var(--surface)); font-size: 8px; padding: 0 8px; }
input,select { height: 29px; }
input[type="time"] { padding: 0 2px 0 6px; }
select,textarea { width: 100%; margin-bottom: 9px; }
textarea { height: 27px; padding: 7px 9px; resize: none; }
textarea::placeholder { color: var(--muted); }
.actions { display: flex; justify-content: flex-end; gap: 5px; }
.actions button { height: 26px; padding: 0 14px; border-radius: 16px; }
.cancel { background: var(--clear); border: 1px solid var(--outline); }
.apply { background: var(--accent); color: var(--on-accent); }
.toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); margin: 0; padding: 6px 12px; border-radius: 14px; background: var(--outline); color: var(--ink); font-size: 8px; opacity: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }

</style></head><body>
<main class="calendar-stage" aria-label="Leave planner"><section class="panel"><header><h1>October, 2026</h1><button class="today" type="button">Today</button><button class="step prev" type="button" aria-label="Previous month">‹</button><button class="step next" type="button" aria-label="Next month">›</button><button class="add" type="button" aria-label="Add leave">+</button></header><div class="calendar"><div class="month-view"><div class="week"></div><div class="days"></div></div><div class="year-view" hidden></div></div><footer><button type="button" class="monthly">Monthly</button><button type="button" class="yearly">Yearly</button><span class="count">3 Upcoming Events</span></footer></section>
<form class="editor" aria-label="Edit leave period"><label for="start">Start date</label><div class="fields"><input id="start" aria-label="Start date" type="date" required><input name="startTime" aria-label="Start time" type="time" value="09:00" required></div><label for="end">End date</label><div class="fields"><input id="end" aria-label="End date" type="date" required><input name="endTime" aria-label="End time" type="time" value="09:00" required></div><label for="type">Leave type</label><select id="type"><option>Casual leave</option><option>Annual leave</option><option>Sick leave</option></select><label for="reason">Reason</label><textarea id="reason" placeholder="Type here" class="ink-editor"></textarea><div class="actions"><button class="cancel" type="button">Cancel</button><button class="apply ink-apply" type="submit">Apply</button></div></form><p class="toast" role="status">Casual leave saved: Oct 10 to Oct 17</p></main><script>

const $=selector=>document.querySelector(selector);
const monthLabels = Array.from({length:12},(_,index)=>new Date(2026,index,1).toLocaleString('en-US',{month:'long'}));
const initial='2026-10-10';
let shown=new Date(2026,9,1), selected=initial, endDay=initial, annual=false, manual=false, previewEnd=false;
const events=[{start:'2026-10-09',end:'2026-10-09'},{start:'2026-11-04',end:'2026-11-04'},{start:'2026-12-18',end:'2026-12-18'}];
const tracks=[];
const days=$('.days'), editor=$('.editor'), toast=$('.toast');
function dateId(date) {
  return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
}
function fillDates(start,end) {
  $('#start').value=start; $('#end').value=end; $('#end').min=start;
}
$('.week').innerHTML=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(day=>'<span>'+day.toUpperCase()+'</span>').join('');
monthLabels.forEach((name,i)=>{const button=document.createElement('button');button.type='button';button.textContent=name.slice(0,3);button.onclick=()=>{takeControl();shown=new Date(shown.getFullYear(),i,1);annual=false;draw();};$('.year-view').append(button);});
function draw() {
  $('h1').textContent=annual?String(shown.getFullYear()):monthLabels[shown.getMonth()]+', '+shown.getFullYear();
  $('.year-view').hidden=!annual; $('.month-view').hidden=annual;
  $('.count').textContent=events.length+' Upcoming Events';
  days.replaceChildren();
  const year=shown.getFullYear(), month=shown.getMonth(), offset=(new Date(year,month,1).getDay()+6)%7;
  const monthLength=new Date(year,month+1,0).getDate();
  const cellCount=Math.ceil((monthLength+offset)/7)*7;
  for (let i=0;i<cellCount;i++) {
    const date=new Date(year,month,1-offset+i), id=dateId(date), button=document.createElement('button');
    button.type='button'; button.className='day'; button.textContent=date.getDate(); button.dataset.date=id;button.setAttribute('aria-label',date.toLocaleDateString('en-US',{dateStyle:'long'}));
    button.classList.toggle('prev-month',date.getMonth()!==month);
    button.classList.toggle('has-event',events.some(item=>item.start===id));
    button.classList.toggle('in-range',(id>selected && id<=endDay)||events.slice(3).some(item=>id>=item.start&&id<=item.end));
    button.classList.toggle('chosen',id===selected); button.setAttribute('aria-pressed',String(id===selected));
    button.onclick=()=>{
      takeControl(); annual=false;
      if (previewEnd&&id>=selected) {endDay=id;previewEnd=false;} else {selected=id;endDay=id;previewEnd=true;}
      shown=new Date(date.getFullYear(),date.getMonth(),1);fillDates(selected,endDay);editor.hidden=false;draw();
    };
    days.append(button);
  }
}
function takeControl() {
  if (!manual) {
    const phase=tracks[0].effect.getComputedTiming().progress;
    editor.hidden=phase<.25||phase>.78;
    tracks.forEach(animation=>animation.cancel()); manual=true; toast.style.opacity=0;
  }
}
editor.addEventListener('focusin',takeControl);
$('.today').onclick=()=>{takeControl();const now=new Date();shown=new Date(now.getFullYear(),now.getMonth(),1);selected=dateId(now);endDay=selected;annual=false;editor.hidden=true;draw();};
function stepMonth(delta){takeControl();shown=new Date(shown.getFullYear()+(annual?delta:0),shown.getMonth()+(annual?0:delta),1);draw();}
$('.prev').onclick=()=>stepMonth(-1);$('.next').onclick=()=>stepMonth(1);
$('.monthly').onclick=()=>{takeControl();annual=false;draw();};
$('.yearly').onclick=()=>{takeControl();annual=true;draw();};
$('.add').onclick=()=>{takeControl();fillDates(selected,endDay);previewEnd=true;editor.hidden=false;$('#start').focus();};
$('.cancel').onclick=()=>{takeControl();editor.hidden=true;previewEnd=false;endDay=selected;draw();};
$('#start').onchange=()=>{if(!$('#start').value)return;$('#end').min=$('#start').value;if($('#end').value<$('#start').value)$('#end').value=$('#start').value;};
editor.addEventListener('submit',event=>{
  event.preventDefault();takeControl();
  const start=$('#start').value,end=$('#end').value;
  if (!start||!end||end<start) return;
  selected=start;endDay=end; const [y,m]=start.split('-').map(Number); shown=new Date(y,m-1,1);
  events.push({start,end,type:$('#type').value,reason:$('#reason').value,startTime:editor.elements.startTime.value,endTime:editor.elements.endTime.value});
  editor.hidden=true;previewEnd=false;annual=false;draw();toast.textContent=$('#type').value+' saved · '+start+' – '+end;
  toast.getAnimations().forEach(animation=>animation.cancel());toast.animate([{opacity:1,offset:0},{opacity:1,offset:.8},{opacity:0}],{duration:2800,fill:'forwards'});
});
fillDates(initial,initial);draw();
const timing={duration:8400,iterations:Infinity,fill:'both'};
function tour(element,states) { tracks.push(element.animate(states,timing)); }
tour(editor,[{offset:0,opacity:0,transform:'translateY(5px)',visibility:'hidden'},{offset:.24,opacity:0,transform:'translateY(5px)',visibility:'hidden'},{offset:.29,opacity:1,transform:'translateY(0px)',visibility:'visible'},{offset:.77,opacity:1,visibility:'visible'},{offset:.8,opacity:0,visibility:'hidden'},{offset:1,opacity:0,visibility:'hidden'}]);
tour(toast,[{offset:0,opacity:0},{offset:.78,opacity:0},{offset:.81,opacity:1},{offset:.93,opacity:1},{offset:1,opacity:0}]);
days.querySelectorAll('button').forEach(button=>{
  const id=button.dataset.date;
  if(id>'2026-10-10'&&id<='2026-10-17') tour(button,[{offset:0,backgroundColor:'var(--outline)'},{offset:.64,backgroundColor:'var(--outline)'},{offset:.7,backgroundColor:'color-mix(in srgb,var(--accent) 53%,var(--bg))'},{offset:.94,backgroundColor:'color-mix(in srgb,var(--accent) 53%,var(--bg))'},{offset:1,backgroundColor:'var(--outline)'}]);
});
if(matchMedia('(prefers-reduced-motion: reduce)').matches&&!new URLSearchParams(location.search).has('t')){takeControl();editor.hidden=false;}

</script><script>  const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
  pick();
  addEventListener("hashchange", pick);
  const t = new URLSearchParams(location.search).get("t");
  if (t !== null) {
    const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; });
    freeze();
    addEventListener("load", freeze);
  }</script></body></html>
