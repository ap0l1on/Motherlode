<script>
const stage = document.querySelector('main');
const duration = Number(document.querySelector('[name="motherlode:loop"]').content);
const motion = [];
function animate(target, keys, options = {}) {
  if (typeof target === 'string') target = document.querySelector(target);
  const list = keys.map(([time, value]) => ({ offset: time / duration, ...value }));
  const effect = target.animate(list, { duration: duration * 1000, iterations: Infinity, fill: 'both', easing: 'linear', ...options });
  motion.push(effect);
  return effect;
}
function hold(seconds) {
  for (const effect of motion) { effect.pause(); effect.currentTime = Math.max(0,Math.min(duration - .001,seconds)) * 1000; }
}
function replay() {
  for (const effect of motion) { effect.currentTime = 0; effect.play(); }
}
function bind(element, callback) {
  element.addEventListener('click', callback);
  element.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); callback(event); }
  });
}
