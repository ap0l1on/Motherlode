<svg viewBox="0 0 576 314" role="img" aria-label="Slender palms stand against a near-black coast while rising rockets burst into colorful New Year letters." xmlns="http://www.w3.org/2000/svg"><defs></defs></svg>
<script>
const ns = 'http://www.w3.org/2000/svg';
const stage = document.querySelector('svg');
const defs = stage.querySelector('defs');
const W = stage.viewBox.baseVal.width, H = stage.viewBox.baseVal.height;
const duration = Number(document.querySelector('[name="motherlode:loop"]').content);
let seed = 1713580;
function random() {
  seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
  return seed / 4294967296;
}
const range = (a,b) => a + (b-a)*random();
const polar = (x,y,r,angle) => [x+r*Math.cos(angle),y+r*Math.sin(angle)];
const tau = Math.PI*2;
const css = name => 'var(--'+name+')';
function node(type, attrs={}, parent=stage) {
  const element = document.createElementNS(ns,type);
  for (const [name,value] of Object.entries(attrs)) element.setAttribute(name,value);
  parent.append(element);
  return element;
}
const group = (parent=stage,attrs={}) => node('g',attrs,parent);
const path = (d,attrs={},parent=stage) => node('path',{d,...attrs},parent);
const circle = (cx,cy,r,fill,parent=stage,attrs={}) => node('circle',{cx,cy,r,fill,...attrs},parent);
const rect = (x,y,width,height,fill,parent=stage,attrs={}) => node('rect',{x,y,width,height,fill,...attrs},parent);
const line = (x1,y1,x2,y2,stroke,width=1,parent=stage,attrs={}) => node('line',{x1,y1,x2,y2,stroke,'stroke-width':width,...attrs},parent);
function words(content, x,y, attrs={},parent=stage) {
  const text = node('text',{x,y,...attrs},parent);
  text.textContent=content;
  return text;
}
function gradient(id, stops, attrs={}, radial=false) {
  const grad = node(radial?'radialGradient':'linearGradient', {id,...attrs},defs);
  for (const [offset,tone,opacity=1] of stops) node('stop',{offset:offset+'%','stop-color':css(tone),'stop-opacity':opacity},grad);
  return 'url(#'+id+')';
}
function soft(id, radius) {
  const filter=node('filter',{id,x:'-50%',y:'-50%',width:'200%',height:'200%'},defs);
  node('feGaussianBlur',{stdDeviation:radius},filter);
  return 'url(#'+id+')';
}
function shape(points,closed=false) {
  return points.map(([x,y],i)=>(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)).join(' ')+(closed?'Z':'');
}
const animations=[];
function animate(element,frames,options={}) {
  const motion=element.animate(frames,{duration:duration*1000,iterations:Infinity,easing:'linear',...options});
  animations.push(motion);
  return motion;
}
function tweenPath(element, outlines, period=duration, offset=0) {
  element.setAttribute('d',outlines[0]);
  animate(element,outlines.map(d=>({d:'path("'+d+'")'})),{duration:period*1000,delay:-offset*1000});
}
function origin(element,x,y) {element.style.transformOrigin=x+'px '+y+'px';}
function at(event){
  const bounds=stage.getBoundingClientRect();
  return [(event.clientX-bounds.left)*W/bounds.width,(event.clientY-bounds.top)*H/bounds.height];
}


const night=gradient('midnight',[[0,'base'],[100,'bg']],{x2:'0%',y2:'100%'});rect(0,0,W,H,night);
const crowns=group(),sparkles=group(),letters=group();
const locations=[[86,179,-3],[112,130,15],[144,117,-9],[180,119,11],[225,173,-4],[272,88,-11],[299,163,9],[336,134,-17],[376,157,7],[421,132,11],[456,105,-8],[493,127,-16],[492,167,10]];
for(const [i,[x,y,bend]] of locations.entries()){
 const foot=x+bend;path('M'+(foot-3)+' 316Q'+(x+bend*.18)+' '+(y+82)+' '+x+' '+y+'Q'+(x+bend*.48)+' '+(y+85)+' '+(foot+1.4)+' 316Z',{fill:css('high'),'fill-opacity':.88},crowns);
 for(let f=0;f<12;f++){
  const angle=-Math.PI*1.01+f*Math.PI/10.7+range(-.12,.12),length=range(41,69),bendDown=range(22,52);
  const endX=x+Math.cos(angle)*length,endY=y+Math.sin(angle)*length+bendDown*.41;
  const midX=x+Math.cos(angle-.13)*length*.54,midY=y+Math.sin(angle-.13)*length*.62-5;
  path('M'+x+' '+y+'Q'+midX+' '+midY+' '+endX+' '+endY,{fill:'none',stroke:css('high'),'stroke-width':1.05},crowns);
  for(let k=1;k<12;k++){
   const t=k/12,s=1-t,px=s*s*x+2*s*t*midX+t*t*endX,py=s*s*y+2*s*t*midY+t*t*endY;
   for(const side of [-1,1]){
    const q=8.2*(.85+Math.sin(t*Math.PI))*(1-t*.72),ang=angle+side*(.47+.68*(1-t));
    path('M'+px+' '+py+'q'+Math.cos(ang)*q*.52+' '+(Math.sin(ang)*q*.54+.6)+' '+Math.cos(ang+.14)*q+' '+(Math.sin(ang)*q+2.8),{fill:'none',stroke:css('high'),'stroke-width':.93,opacity:.81},crowns);
   }
  }
 }
}
const message=['HAPPY','NEW','YEAR'];const colors=['a','g','b','c','h','d','e','f'];
for(const [wordIndex,word] of message.entries()) {
 const starts=[.00,.31,.58];for(const [j,char] of [...word].entries()){
  const px=75+j*(426/Math.max(word.length-1,1))+range(-7,7),py=110+Math.cos(j*1.4+wordIndex)*28;
  const tone=colors[(j+wordIndex*2)%colors.length];const burst=group(letters),timing=starts[wordIndex]+j*.020;
  const trails=group(burst);for(let k=0;k<20;k++){const a=range(0,tau),r=range(9,21);line(...polar(0,0,r*.3,a),...polar(0,0,r,a),css(tone),.67,trails,{opacity:range(.24,.72)});}
  words(char,0,0,{'text-anchor':'middle','dominant-baseline':'middle','font-size':30,'font-family':'Georgia, serif','font-weight':700,fill:css(tone)},burst);
  const wrap=group(sparkles);path('M'+(px-1)+' 314Q'+(px+5)+' '+(py+91)+' '+px+' '+py,{fill:'none',stroke:css('ink'),'stroke-width':.69,opacity:.56},wrap);
  const t=Math.min(timing,.86);animate(burst,[{opacity:0,transform:'translate('+px+'px,'+(py+30)+'px) scale(.12)'},{opacity:0,transform:'translate('+px+'px,'+(py+30)+'px) scale(.12)',offset:t},{opacity:1,transform:'translate('+px+'px,'+py+'px) scale(1.05)',offset:t+.07},{opacity:.84,transform:'translate('+px+'px,'+(py-3)+'px) scale(1)',offset:t+.125},{opacity:0,transform:'translate('+px+'px,'+(py+2)+'px) scale(1.32)',offset:Math.min(.996,t+.19)},{opacity:0}]);
  animate(wrap,[{opacity:0},{opacity:0,offset:t},{opacity:.8,offset:t+.026},{opacity:0,offset:t+.09},{opacity:0}]);
 }
}

</script><script>
const pick = () => {document.documentElement.dataset.colorway = location.hash.slice(1) || 'original';};
pick();
addEventListener('hashchange',pick);
const time = new URLSearchParams(location.search).get('t');
if (time !== null || matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const seconds=time !== null ? Number(time) : Number(document.querySelector('[name="motherlode:still"]').content);
  function freeze() {for (const animation of document.getAnimations()) {animation.pause();animation.currentTime=seconds*1000;}}
  freeze();
  addEventListener('load', freeze);
}
</script></body></html>
