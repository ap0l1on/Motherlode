<svg viewBox="0 0 576 365" role="img" aria-label="Soft green and violet auroral curtains rise behind several depths of drifting snow." xmlns="http://www.w3.org/2000/svg"><defs></defs></svg>
<script>
const ns = 'http://www.w3.org/2000/svg';
const stage = document.querySelector('svg');
const defs = stage.querySelector('defs');
const W = stage.viewBox.baseVal.width, H = stage.viewBox.baseVal.height;
const duration = Number(document.querySelector('[name="motherlode:loop"]').content);
let seed = 1682424;
function random() {
  seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
  return seed / 4294967296;
}
const range = (a,b) => a + (b-a)*random();
const polar = (x,y,r,angle) => [x+r*Math.cos(angle),y+r*Math.sin(angle)];
const tau = Math.PI*2;
const css = name => 'var(--'+name+')';
function node(type, attrs={}, parent=stage) {
  const element = document.createElementNS(ns,type);
  for (const [name,value] of Object.entries(attrs)) element.setAttribute(name,value);
  parent.append(element);
  return element;
}
const group = (parent=stage,attrs={}) => node('g',attrs,parent);
const path = (d,attrs={},parent=stage) => node('path',{d,...attrs},parent);
const circle = (cx,cy,r,fill,parent=stage,attrs={}) => node('circle',{cx,cy,r,fill,...attrs},parent);
const rect = (x,y,width,height,fill,parent=stage,attrs={}) => node('rect',{x,y,width,height,fill,...attrs},parent);
const line = (x1,y1,x2,y2,stroke,width=1,parent=stage,attrs={}) => node('line',{x1,y1,x2,y2,stroke,'stroke-width':width,...attrs},parent);
function words(content, x,y, attrs={},parent=stage) {
  const text = node('text',{x,y,...attrs},parent);
  text.textContent=content;
  return text;
}
function gradient(id, stops, attrs={}, radial=false) {
  const grad = node(radial?'radialGradient':'linearGradient', {id,...attrs},defs);
  for (const [offset,tone,opacity=1] of stops) node('stop',{offset:offset+'%','stop-color':css(tone),'stop-opacity':opacity},grad);
  return 'url(#'+id+')';
}
function soft(id, radius) {
  const filter=node('filter',{id,x:'-50%',y:'-50%',width:'200%',height:'200%'},defs);
  node('feGaussianBlur',{stdDeviation:radius},filter);
  return 'url(#'+id+')';
}
function shape(points,closed=false) {
  return points.map(([x,y],i)=>(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)).join(' ')+(closed?'Z':'');
}
const animations=[];
function animate(element,frames,options={}) {
  const motion=element.animate(frames,{duration:duration*1000,iterations:Infinity,easing:'linear',...options});
  animations.push(motion);
  return motion;
}
function tweenPath(element, outlines, period=duration, offset=0) {
  element.setAttribute('d',outlines[0]);
  animate(element,outlines.map(d=>({d:'path("'+d+'")'})),{duration:period*1000,delay:-offset*1000});
}
function origin(element,x,y) {element.style.transformOrigin=x+'px '+y+'px';}
function at(event){
  const bounds=stage.getBoundingClientRect();
  return [(event.clientX-bounds.left)*W/bounds.width,(event.clientY-bounds.top)*H/bounds.height];
}


const back=gradient('night',[[0,'low'],[53,'base'],[100,'d']],{x2:'0%',y2:'100%'});
rect(0,0,W,H,back);
const haze=soft('haze',15);
const hf=document.getElementById('haze');for(const [key,val] of Object.entries({filterUnits:'userSpaceOnUse',x:-100,y:-100,width:790,height:580}))hf.setAttribute(key,val);
const aurora=group();
for(const [x,width,tone,tilt,opa] of [[-22,100,'a',-8,.56],[64,125,'b',-11,.61],[158,78,'c',-6,.88],[201,120,'b',-7,.54],[259,98,'d',-9,.77],[326,123,'a',-8,.80],[359,81,'e',-2,.98],[408,52,'f',-5,.65],[465,95,'g',-10,.48],[531,95,'c',-4,.72],[577,64,'f',-8,.44]]) {
 const center=gradient('curtain'+Math.round(x+50),[[0,tone,0],[27,tone,.20],[52,tone,.84],[73,tone,.37],[100,tone,0]]);
 const light=rect(x-width/2,-33,width,H+89,center,aurora,{opacity:opa,filter:haze,transform:'skewX('+tilt+')'});
 const wave=group(aurora);const streak=path('M'+x+' -25C'+(x-11)+' 92 '+(x+19)+' 193 '+(x+8)+' 400',{stroke:css(tone),'stroke-opacity':opa*.36,'stroke-width':width*.42,fill:'none',filter:haze},wave);
 animate(wave,[{transform:'translate(-8px,0)'},{transform:'translate(9px,0)',offset:.5},{transform:'translate(-8px,0)'}]);
}
const lower=gradient('lower',[[0,'d',0],[100,'d',.49]],{x2:'0%',y2:'100%'});rect(0,138,W,H-138,lower);
rect(0,0,W,H,'color-mix(in srgb,'+css('h')+' 46%,'+css('g')+')',stage,{opacity:.14});
const dotBlur=soft('flake-blur',.7);
for(let depth=0;depth<3;depth++) {
 const sheet=group(), count=[510,302,78][depth], distance=[25,43,73][depth];
 for(let i=0;i<count;i++){
  const x=range(-18,W+18),y=range(-distance,H),r=range(.38,1.28)*(1+depth*.69),opacity=range(.23,.73);
  circle(x,y,r,css(i%5?'h':'ink'),sheet,{opacity,filter:depth===2?dotBlur:''});
  if(depth===2&&i%7===0){path('M'+(x-r*3.4)+' '+y+'Q'+x+' '+(y-r*.5)+' '+(x+r*3.4)+' '+(y+r*.23)+'M'+x+' '+(y-r*3.5)+'Q'+(x+r*.6)+' '+y+' '+(x-r*.2)+' '+(y+r*3.5),{stroke:css('ink'),'stroke-width':.85,opacity:opacity*.95,fill:'none'},sheet);}
 }
 animate(sheet,[{transform:'translate(0,0)'},{transform:'translate('+(-distance*.22)+'px,'+distance+'px)'}],{duration:duration*1000});
}

</script><script>
const pick = () => {document.documentElement.dataset.colorway = location.hash.slice(1) || 'original';};
pick();
addEventListener('hashchange',pick);
const time = new URLSearchParams(location.search).get('t');
if (time !== null || matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const seconds=time !== null ? Number(time) : Number(document.querySelector('[name="motherlode:still"]').content);
  function freeze() {for (const animation of document.getAnimations()) {animation.pause();animation.currentTime=seconds*1000;}}
  freeze();
  addEventListener('load', freeze);
}
</script></body></html>
