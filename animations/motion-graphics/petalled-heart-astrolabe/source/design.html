  <style>

[data-colorway="light"] { --background: #fcf6f1; --shade: #78253d; --middle: #a13955; --bright: #b85a76; --highlight: #e39394; --leaf: #2a6651; }
[data-colorway="dark"] { --background: #111322; --shade: #6b3f70; --middle: #b75086; --bright: #ea899f; --highlight: #ffcfb6; --leaf: #83ab97; }
[data-colorway="mono"] { --background: #121212; --shade: #505050; --middle: #878787; --bright: #bebebe; --highlight: #f1f1f1; --leaf: #9d9d9d; }
[data-colorway="ocean"] { --background: #071824; --shade: #204e70; --middle: #348eab; --bright: #5bc8d4; --highlight: #c5f1e6; --leaf: #65b5a6; }
[data-colorway="matcha"] { --background: #101c15; --shade: #3e563d; --middle: #71916a; --bright: #b4c989; --highlight: #eaf2c7; --leaf: #91b395; }
[data-colorway="sunset"] { --background: #21101f; --shade: #723355; --middle: #b95161; --bright: #ec825d; --highlight: #ffdd9e; --leaf: #ab9976; }

<body>
  <svg viewBox="0 0 576 894" role="img" aria-labelledby="art-title description" xmlns="http://www.w3.org/2000/svg">
    <title id="art-title">Petalled heart astrolabe</title>
    <desc id="description">Rose enamel, tiny gold curls and concentric hearts emerge inside a pink lace medallion on a tall plum field.</desc>
  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 43 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    function pointsPath(points, close = false) {
      return points.length ? "M" + points.map(p => p[0].toFixed(2) + " " + p[1].toFixed(2)).join("L") + (close ? "Z" : "") : "";
    }
    function line(parent, data, color, width = 1, opacity = 1) {
      return element("path", {d: data, fill: "none", stroke: "var(--" + color + ")",
        "stroke-width": width, "stroke-linejoin": "round", "stroke-linecap": "round", opacity}, parent);
    }
    function radial(defs, id, stops) {
      const gradient = element("radialGradient", {id}, defs);
      for (const [offset, color, opacity] of stops) element("stop", {
        offset, "stop-color": "var(--" + color + ")", "stop-opacity": opacity}, gradient);
      return "url(#" + id + ")";
    }

    const defs=element("defs",{});
    const aurora=radial(defs,"petal-haze",[[0,"bright",.42],[.51,"middle",.31],[1,"background",0]]);
    const metal=element("linearGradient",{id:"inlay",x1:0,x2:0,y1:0,y2:1,gradientUnits:"objectBoundingBox"},defs);
    for(const [offset,c] of [[0,"highlight"],[.28,"bright"],[.55,"middle"],[.76,"bright"],[1,"highlight"]])
      element("stop",{offset,"stop-color":"var(--"+c+")"},metal);
    const center=[288,439],tau2=Math.PI*2;
    const polar=(r,a)=>[center[0]+r*Math.cos(a),center[1]+r*Math.sin(a)];
    function appear(node,start,length=.075) {
      node.animate([{offset:0,opacity:0},{offset:start,opacity:0},{offset:start+length,opacity:1},
        {offset:.985,opacity:1},{offset:1,opacity:0}],{duration,iterations:Infinity});return node;
    }
    const backdrop=element("g",{});
    for(let i=0;i<31;i++){
      const a=tau2*i/31;
      line(backdrop,pointsPath([polar(171,a),[288+Math.cos(a)*538,439+Math.sin(a)*655]]),"shade",.72,.7);
    }
    for(const sign of [-1,1])for(let j=0;j<3;j++) {
      const y=center[1]+sign*248;
      element("ellipse",{cx:288,cy:y,rx:19+12*j,ry:164,transform:"rotate("+((j-1)*8)+" 288 "+y+")",
        fill:"none",stroke:"var(--middle)","stroke-width":.73,opacity:.55},backdrop);
    }
    appear(backdrop,0,.11);
    const lattice=element("g",{});
    for(let i=0;i<68;i++) {
      const a=tau2*i/68;
      line(lattice,pointsPath([polar(219,a),polar(168,a+.41),polar(217,a+.79)]),"bright",.88,.55);
      line(lattice,pointsPath([polar(221,a),polar(177,a-.36)]),"middle",.73,.70);
    }
    [165,177,206,218].forEach(r=>element("circle",{cx:288,cy:439,r,fill:"none",stroke:"var(--bright)","stroke-width":1.05},lattice));
    line(lattice,"M48 439H120 M456 439H528","highlight",2,.8);appear(lattice,.075,.14);
    function heart(scale){
      const pts=[];for(let i=0;i<=180;i++){
        const a=tau2*i/180;
        pts.push([288+16*Math.sin(a)**3*scale,435-scale*(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))]);
      }return pointsPath(pts,true);
    }
    element("ellipse",{cx:288,cy:428,rx:214,ry:205,fill:aurora});
    const h=element("path",{d:heart(10.8),fill:"var(--shade)",stroke:"url(#inlay)","stroke-width":17,"stroke-linejoin":"round"});appear(h,.19,.105);
    appear(element("path",{d:heart(10.35),fill:"none",stroke:"var(--highlight)","stroke-width":2.6}),.23);
    const petals=element("g",{});
    for(let row=0;row<11;row++)for(let c=-5;c<=5;c++){
      const x=c*24+(row%2)*11,y=-101+row*22;
      const nx=x/132,ny=-y/113;
      if((nx*nx+ny*ny-1)**3-nx*nx*ny**3>-.08)continue;
      element("ellipse",{cx:288+x,cy:433+y,rx:11,ry:6.3,fill:"none",stroke:"var(--leaf)","stroke-width":.72,opacity:.79},petals);
    }
    appear(petals,.30,.11);
    appear(element("path",{d:heart(8.6),fill:"none",stroke:"var(--leaf)","stroke-width":4.5}),.42);
    for(const sign of [-1,1])for(let k=0;k<4;k++){
      const cx=288+sign*(89+8*Math.cos(k)),cy=375+k*27;
      const pts=Array.from({length:70},(_,i)=>[cx+(19-i*.24)*Math.cos(i*.12),cy+(19-i*.24)*Math.sin(i*.12)]);
      appear(line(drawing,pointsPath(pts),"leaf",2.5,.85),.44+.013*k);
    }
    appear(element("path",{d:heart(4.45),fill:"var(--middle)",stroke:"var(--highlight)","stroke-width":4}),.55);
    const core=element("g",{});for(let i=0;i<32;i++)line(core,pointsPath([polar(39,i*tau2/32),polar(10,(i+8)*tau2/32),polar(40,(i+13)*tau2/32)]),"highlight",.76,.8);
    appear(core,.61);
    for(let i=0;i<12;i++){const p=polar(240,i*tau2/12);appear(element("circle",{cx:p[0],cy:p[1],r:7,fill:"none",stroke:"var(--leaf)","stroke-width":1.2}),.71+i*.016);}

    })();
  </script>
  <script>
    const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
    pick();
    addEventListener("hashchange", pick);
    const t = new URLSearchParams(location.search).get("t");
    if (t !== null) {
      const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = Number(t) * 1000; });
      freeze();
      addEventListener("load", freeze);
    }
  </script>
