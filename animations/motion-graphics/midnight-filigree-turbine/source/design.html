<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="motherlode:size" content="576x450">
  <meta name="motherlode:scale" content="1">
  <meta name="motherlode:loop" content="36">
  <meta name="motherlode:still" content="34.5">
  <title>Midnight filigree turbine</title>
  <style>
:root, [data-colorway="original"] { --background: #101322; --shade: #a55c94; --middle: #7165ac; --bright: #7797c4; --highlight: #91b4a2; --leaf: #d0ad7b; }
[data-colorway="light"] { --background: #fcf6f1; --shade: #78253d; --middle: #a13955; --bright: #b85a76; --highlight: #e39394; --leaf: #2a6651; }
[data-colorway="dark"] { --background: #111322; --shade: #6b3f70; --middle: #b75086; --bright: #ea899f; --highlight: #ffcfb6; --leaf: #83ab97; }
[data-colorway="mono"] { --background: #121212; --shade: #505050; --middle: #878787; --bright: #bebebe; --highlight: #f1f1f1; --leaf: #9d9d9d; }
[data-colorway="ocean"] { --background: #071824; --shade: #204e70; --middle: #348eab; --bright: #5bc8d4; --highlight: #c5f1e6; --leaf: #65b5a6; }
[data-colorway="matcha"] { --background: #101c15; --shade: #3e563d; --middle: #71916a; --bright: #b4c989; --highlight: #eaf2c7; --leaf: #91b395; }
[data-colorway="sunset"] { --background: #21101f; --shade: #723355; --middle: #b95161; --bright: #ec825d; --highlight: #ffdd9e; --leaf: #ab9976; }
[data-colorway="iris"] { --background: #121026; --shade: #4b3d76; --middle: #7758bf; --bright: #ac9eff; --highlight: #eee0ff; --leaf: #7ea1b5; }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 576px; height: 450px; overflow: hidden; background: var(--background); }
    svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <svg viewBox="0 0 576 450" role="img" aria-labelledby="art-title description" xmlns="http://www.w3.org/2000/svg">
    <title id="art-title">Midnight filigree turbine</title>
    <desc id="description">Thin colored rings give way to a turbine of violet, teal and copper filigree on midnight blue.</desc>
  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 36 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    const tau = 2 * Math.PI;
    function pointsPath(points, close = false) {
      return points.length ? "M" + points.map(p => p[0].toFixed(2) + " " + p[1].toFixed(2)).join("L") + (close ? "Z" : "") : "";
    }
    function line(parent, data, color, width = 1, opacity = 1) {
      return element("path", {d: data, fill: "none", stroke: "var(--" + color + ")",
        "stroke-width": width, "stroke-linejoin": "round", "stroke-linecap": "round", opacity}, parent);
    }

    const cx = 291, cy = 231, petals = 15;
    const colors = ["shade", "middle", "bright", "highlight", "leaf"];
    const polar = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    const guide = element("g", {});
    for (let k = 0; k < 17; k++) element("circle", {cx, cy, r: 20 + k * 10,
      fill: "none", stroke: "var(--" + colors[k % 5] + ")", "stroke-width": .80, opacity: .69}, guide);
    guide.animate([{offset: 0, opacity: 0}, {offset: .12, opacity: 1}, {offset: .52, opacity: 1},
      {offset: .70, opacity: .05}, {offset: .99, opacity: .05}, {offset: 1, opacity: 0}], {duration, iterations: Infinity});
    function leafPoint(angle, t, width) {
      const r = 17 + 188 * t;
      return polar(r, angle + 1.63 * (1 - t) ** 1.38 + width * .32 * Math.sin(t * Math.PI));
    }
    function reveal(path, start, end) {
      path.setAttribute("pathLength", 1); path.setAttribute("stroke-dasharray", "1 1");
      path.animate([{offset: 0, strokeDashoffset: 1}, {offset: start, strokeDashoffset: 1},
        {offset: end, strokeDashoffset: 0}, {offset: .99, strokeDashoffset: 0},
        {offset: 1, strokeDashoffset: 1}], {duration, iterations: Infinity});
    }
    for (let k = 0; k < petals; k++) {
      const angle = k * tau / petals - .27;
      for (let row = 0; row < 7; row++) {
        const u = row / 6, outer = [], inner = [];
        for (let i = 0; i <= 44; i++) {
          const t = i / 44;
          const p = leafPoint(angle, t, (1 - u * .83));
          const q = leafPoint(angle, t, -(1 - u * .83));
          outer.push(p); inner.push(q);
        }
        const blade = line(drawing, pointsPath([...outer, ...inner.reverse()], true), colors[(k + row) % 5], .98, .96);
        reveal(blade, .08 + u * .09, .77 + u * .10);
      }
      for (let j = 1; j <= 28; j++) {
        const t = j / 29, pn = [], angle2 = angle - .21;
        for (let i = 0; i <= 26; i++) {
          const h = i / 26, radius = 15 + t * 191 + h * 32 * t;
          pn.push(polar(radius, angle2 + 1.63 * (1 - t) ** 1.38 + (h - .5) * (.90 - t * .19)
            - .10 * Math.sin(h * Math.PI)));
        }
        const cross = line(drawing, pointsPath(pn), colors[(j + Math.floor(k / 2)) % 5], .85, .91);
        reveal(cross, .10 + t * .66, .21 + t * .73);
      }
    }

    })();
  </script>
  <script>
    const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
    pick();
    addEventListener("hashchange", pick);
    const t = new URLSearchParams(location.search).get("t");
    if (t !== null) {
      const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = Number(t) * 1000; });
      freeze();
      addEventListener("load", freeze);
    }
  </script>
</body>
</html>
