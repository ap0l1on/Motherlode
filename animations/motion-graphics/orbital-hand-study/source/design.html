<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="motherlode:size" content="576x294">
  <meta name="motherlode:scale" content="1">
  <meta name="motherlode:loop" content="9.5">
  <meta name="motherlode:still" content="5">
  <title>Orbital hand study</title>
  <style>
:root, [data-colorway="original"] { --background: #040616; --shade: #1a2a4a; --middle: #5484ba; --bright: #97bdd9; --highlight: #c9f5fa; --leaf: #497aab; }
[data-colorway="light"] { --background: #fcf6f1; --shade: #78253d; --middle: #a13955; --bright: #b85a76; --highlight: #e39394; --leaf: #2a6651; }
[data-colorway="dark"] { --background: #111322; --shade: #6b3f70; --middle: #b75086; --bright: #ea899f; --highlight: #ffcfb6; --leaf: #83ab97; }
[data-colorway="mono"] { --background: #121212; --shade: #505050; --middle: #878787; --bright: #bebebe; --highlight: #f1f1f1; --leaf: #9d9d9d; }
[data-colorway="ocean"] { --background: #071824; --shade: #204e70; --middle: #348eab; --bright: #5bc8d4; --highlight: #c5f1e6; --leaf: #65b5a6; }
[data-colorway="matcha"] { --background: #101c15; --shade: #3e563d; --middle: #71916a; --bright: #b4c989; --highlight: #eaf2c7; --leaf: #91b395; }
[data-colorway="sunset"] { --background: #21101f; --shade: #723355; --middle: #b95161; --bright: #ec825d; --highlight: #ffdd9e; --leaf: #ab9976; }
[data-colorway="iris"] { --background: #121026; --shade: #4b3d76; --middle: #7758bf; --bright: #ac9eff; --highlight: #eee0ff; --leaf: #7ea1b5; }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 576px; height: 294px; overflow: hidden; background: var(--background); }
    svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <svg viewBox="0 0 576 294" role="img" aria-labelledby="art-title description" xmlns="http://www.w3.org/2000/svg">
    <title id="art-title">Orbital hand study</title>
    <desc id="description">A constellation of white joints sketches a moving hand above a midnight grid. A pale blue wire sphere rests at the palm.</desc>
  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 9.5 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    const tau = 2 * Math.PI;
    let seed = 77216;
    function random() {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    function pointsPath(points, close = false) {
      return points.length ? "M" + points.map(p => p[0].toFixed(2) + " " + p[1].toFixed(2)).join("L") + (close ? "Z" : "") : "";
    }
    function line(parent, data, color, width = 1, opacity = 1) {
      return element("path", {d: data, fill: "none", stroke: "var(--" + color + ")",
        "stroke-width": width, "stroke-linejoin": "round", "stroke-linecap": "round", opacity}, parent);
    }
    function radial(defs, id, stops) {
      const gradient = element("radialGradient", {id}, defs);
      for (const [offset, color, opacity] of stops) element("stop", {
        offset, "stop-color": "var(--" + color + ")", "stop-opacity": opacity}, gradient);
      return "url(#" + id + ")";
    }

    const defs=element("defs",{});
    const glow=radial(defs,"junction",[[0,"highlight",.94],[.28,"bright",.6],[1,"middle",0]]);
    const floor=element("g",{});
    for(let i=-24;i<=24;i++)line(floor,pointsPath([[319+i*4,213],[319+i*29,294]]),"shade",.65,.77);
    for(let i=0;i<13;i++){
      const y=214+(i/12)**2.05*80;line(floor,pointsPath([[0,y],[576,y]]),"shade",.68,.77);
    }
    for(let i=0;i<46;i++)element("circle",{cx:random()*576,cy:random()*231,r:.4+random()*.85,fill:"var(--bright)",opacity:.38+random()*.48});
    const hand=element("g",{});
    const fingers=[
      [[-10,81],[-45,75],[-84,60],[-121,54],[-154,52]],
      [[-10,81],[-35,26],[-69,4],[-109,-20],[-153,-45]],
      [[-10,81],[-33,12],[-51,-38],[-91,-71],[-132,-74]],
      [[-10,81],[-13,6],[-29,-45],[-63,-75],[-99,-85]],
      [[-10,81],[5,4],[-4,-30],[-24,-64],[-57,-79]]
    ];
    for (const finger of fingers) {
      line(hand,pointsPath(finger),"bright",.95,.78);
      finger.forEach(([x,y],j)=>element("circle",{cx:x,cy:y,r:j===4?4.8:j===2?2.75:2.25,fill:"var(--highlight)"} ,hand));
    }
    for(let i=0;i<5;i++)element("ellipse",{cx:0,cy:0,rx:25+i*2.4,ry:11+i*3.4,
      fill:"none",stroke:"var(--bright)","stroke-width":.69,transform:"rotate("+i*32+")"},hand);
    element("circle",{r:34,fill:glow},hand);
    for(let i=0;i<170;i++){
      const a=random()*tau,r=23*Math.sqrt(random());
      element("circle",{cx:r*Math.cos(a),cy:r*Math.sin(a),r:.5+random()*.55,fill:"var(--bright)"},hand);
    }
    element("circle",{r:11.5,fill:"var(--highlight)"},hand);
    const poses=Array.from({length:41},(_,i)=>{
      const a=i*tau/40;
      return {transform:"translate("+(315+100*Math.sin(a))+"px,"+(146-20*Math.cos(2*a))+"px) rotate("+
        (16+47*Math.cos(a-1.3))+"deg) scale("+(1+.085*Math.sin(a*2))+")"};
    });
    hand.animate(poses,{duration,iterations:Infinity});

    })();
  </script>
  <script>
    const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
    pick();
    addEventListener("hashchange", pick);
    const t = new URLSearchParams(location.search).get("t");
    if (t !== null) {
      const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = Number(t) * 1000; });
      freeze();
      addEventListener("load", freeze);
    }
  </script>
</body>
</html>
