<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="motherlode:size" content="576x510">
  <meta name="motherlode:scale" content="1">
  <meta name="motherlode:loop" content="24">
  <meta name="motherlode:still" content="22">
  <title>Aurora orchard</title>
  <style>
:root, [data-colorway="original"] { --background: #04030e; --shade: #609dd1; --middle: #68ad60; --bright: #dbc044; --highlight: #f0a6ce; --leaf: #d47f2a; }
[data-colorway="light"] { --background: #fcf6f1; --shade: #78253d; --middle: #a13955; --bright: #b85a76; --highlight: #e39394; --leaf: #2a6651; }
[data-colorway="dark"] { --background: #111322; --shade: #6b3f70; --middle: #b75086; --bright: #ea899f; --highlight: #ffcfb6; --leaf: #83ab97; }
[data-colorway="mono"] { --background: #121212; --shade: #505050; --middle: #878787; --bright: #bebebe; --highlight: #f1f1f1; --leaf: #9d9d9d; }
[data-colorway="ocean"] { --background: #071824; --shade: #204e70; --middle: #348eab; --bright: #5bc8d4; --highlight: #c5f1e6; --leaf: #65b5a6; }
[data-colorway="matcha"] { --background: #101c15; --shade: #3e563d; --middle: #71916a; --bright: #b4c989; --highlight: #eaf2c7; --leaf: #91b395; }
[data-colorway="sunset"] { --background: #21101f; --shade: #723355; --middle: #b95161; --bright: #ec825d; --highlight: #ffdd9e; --leaf: #ab9976; }
[data-colorway="iris"] { --background: #121026; --shade: #4b3d76; --middle: #7758bf; --bright: #ac9eff; --highlight: #eee0ff; --leaf: #7ea1b5; }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 576px; height: 510px; overflow: hidden; background: var(--background); }
    svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <svg viewBox="0 0 576 510" role="img" aria-labelledby="art-title description" xmlns="http://www.w3.org/2000/svg">
    <title id="art-title">Aurora orchard</title>
    <desc id="description">A gold trunk rises from orbital rings and branches into a canopy of small pink and blue blossoms under a starry sky.</desc>
  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 24 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    const tau = 2 * Math.PI;
    let seed = 77216;
    function random() {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    function pointsPath(points, close = false) {
      return points.length ? "M" + points.map(p => p[0].toFixed(2) + " " + p[1].toFixed(2)).join("L") + (close ? "Z" : "") : "";
    }
    function line(parent, data, color, width = 1, opacity = 1) {
      return element("path", {d: data, fill: "none", stroke: "var(--" + color + ")",
        "stroke-width": width, "stroke-linejoin": "round", "stroke-linecap": "round", opacity}, parent);
    }

    for(let i=0;i<190;i++)element("circle",{cx:random()*576,cy:random()*510,r:.3+random()*.8,fill:"var(--highlight)",opacity:.17+.52*random()});
    [36,65,97,132,168,202].forEach((r,i)=>element("ellipse",{cx:289,cy:414,rx:r,ry:r*.19,fill:"none",
      stroke:"var(--"+(i%2?"middle":"bright")+")","stroke-width":.77,opacity:.45}));
    for(let i=0;i<25;i++){
      const a=tau*i/25,r=28+37*random();
      line(drawing,pointsPath([[289,410],[289+Math.cos(a)*r,414+Math.sin(a)*r*.58]]),"leaf",.71,.59);
    }
    const limbs=[];
    function grow(x,y,dir,len,level) {
      const nx=x+Math.sin(dir)*len,ny=y-Math.cos(dir)*len;
      limbs.push({x,y,nx,ny,level});
      if(level<6){
        grow(nx,ny,dir+.40+(level%3)*.017,len*.758,level+1);
        grow(nx,ny,dir-.43,len*.756,level+1);
      }
    }
    grow(289,412,0,91,0);
    limbs.forEach((p,i)=>{
      const {x,y,nx,ny,level}=p,at=.10+i/limbs.length*.74;
      const color=level<1?"leaf":level<3?"bright":level<5?"middle":"highlight";
      const node=line(drawing,pointsPath([[x,y],[nx,ny]]),color,Math.max(.8,10.2*(.70**level)),.97);
      node.setAttribute("pathLength",1);node.setAttribute("stroke-dasharray","1 1");
      node.animate([{offset:0,strokeDashoffset:1},{offset:at,strokeDashoffset:1},{offset:at+.035,strokeDashoffset:0},
        {offset:.99,strokeDashoffset:0},{offset:1,strokeDashoffset:1}],{duration,iterations:Infinity});
      if(level===6){
        const cluster=element("g",{});
        for(let j=0;j<14;j++){
          const a=random()*tau,r=Math.sqrt(random())*12;
          element("circle",{cx:nx+Math.cos(a)*r,cy:ny+Math.sin(a)*r,r:.75+random()*2,
            fill:"var(--"+(j%4&&nx>115&&nx<459?"highlight":"shade")+")",opacity:.67+random()*.30},cluster);
        }
        cluster.animate([{offset:0,opacity:0},{offset:at+.025,opacity:0},{offset:at+.057,opacity:1},
          {offset:.99,opacity:1},{offset:1,opacity:0}],{duration,iterations:Infinity});
      }
    });

    })();
  </script>
  <script>
    const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
    pick();
    addEventListener("hashchange", pick);
    const t = new URLSearchParams(location.search).get("t");
    if (t !== null) {
      const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = Number(t) * 1000; });
      freeze();
      addEventListener("load", freeze);
    }
  </script>
</body>
</html>
