<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="motherlode:size" content="576x570">
  <meta name="motherlode:scale" content="1">
  <meta name="motherlode:loop" content="9.5">
  <meta name="motherlode:still" content="7.5">
  <title>Ultraviolet dustwing</title>
  <style>
:root, [data-colorway="original"] { --background: #020106; --shade: #151665; --middle: #383bb6; --bright: #5f43e5; --highlight: #8753eb; --leaf: #34389d; }
[data-colorway="light"] { --background: #fcf6f1; --shade: #78253d; --middle: #a13955; --bright: #b85a76; --highlight: #e39394; --leaf: #2a6651; }
[data-colorway="dark"] { --background: #111322; --shade: #6b3f70; --middle: #b75086; --bright: #ea899f; --highlight: #ffcfb6; --leaf: #83ab97; }
[data-colorway="mono"] { --background: #121212; --shade: #505050; --middle: #878787; --bright: #bebebe; --highlight: #f1f1f1; --leaf: #9d9d9d; }
[data-colorway="ocean"] { --background: #071824; --shade: #204e70; --middle: #348eab; --bright: #5bc8d4; --highlight: #c5f1e6; --leaf: #65b5a6; }
[data-colorway="matcha"] { --background: #101c15; --shade: #3e563d; --middle: #71916a; --bright: #b4c989; --highlight: #eaf2c7; --leaf: #91b395; }
[data-colorway="sunset"] { --background: #21101f; --shade: #723355; --middle: #b95161; --bright: #ec825d; --highlight: #ffdd9e; --leaf: #ab9976; }
[data-colorway="iris"] { --background: #121026; --shade: #4b3d76; --middle: #7758bf; --bright: #ac9eff; --highlight: #eee0ff; --leaf: #7ea1b5; }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 576px; height: 570px; overflow: hidden; background: var(--background); }
    svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <svg viewBox="0 0 576 570" role="img" aria-labelledby="art-title description" xmlns="http://www.w3.org/2000/svg">
    <title id="art-title">Ultraviolet dustwing</title>
    <desc id="description">Four vivid indigo wings emerge from a point, with small violet lobes and a fine particle body.</desc>
  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 9.5 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    let seed = 77216;
    function random() {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    function line(parent, data, color, width = 1, opacity = 1) {
      return element("path", {d: data, fill: "none", stroke: "var(--" + color + ")",
        "stroke-width": width, "stroke-linejoin": "round", "stroke-linecap": "round", opacity}, parent);
    }

    const planted=element("g",{transform:"translate(255 344)"});
    const flutter=element("g",{},planted);
    const bins=[[],[],[],[]];
    function wing(side,lower) {
      const count=lower?3100:6900;
      for(let i=0;i<count;i++){
        const u=random()**.82, v=(random()-random());
        const length=(lower?201:326)*u;
        const breadth=(lower?32:54)*Math.sin(u*Math.PI)**.59*v;
        const direction=(lower?.82:-.91)+(lower?.12:-.09)*Math.sin(u*3.4);
        const x=side*(length*Math.cos(direction)-breadth*Math.sin(direction));
        const y=length*Math.sin(direction)+breadth*Math.cos(direction);
        const vein=.65+.35*Math.sin(13*u+6*v+2*Math.sin(8*u));
        if(random()>(.5+.45*vein))continue;
        const tone=Math.min(3,Math.floor((random()*.53+(1-u)*.46)*4));
        bins[tone].push("M"+x.toFixed(1)+" "+y.toFixed(1)+"l"+(side*u*.75).toFixed(1)+" "+(-u*.9).toFixed(1));
      }
    }
    for(const side of [-1,1]){
      wing(side,false);wing(side,true);
      for(let i=0;i<950;i++) {
        const u=random(),v=(random()-random())*Math.sin(u*Math.PI);
        bins[2].push("M"+(side*u*76).toFixed(2)+" "+(v*16).toFixed(2)+"h.3");
      }
    }
    for(const side of [-1,1])for(let i=0;i<1600;i++){
      const f=random(),r=161*f;
      const dx=side*r*(.51+.09*Math.sin(f*4))+(random()-random())*(2+8*f);
      const dy=-r*.82+(random()-random())*5;
      bins[i%2?2:3].push("M"+dx.toFixed(1)+" "+dy.toFixed(1)+"h.4");
    }
    for(let i=0;i<1400;i++) {
      const u=random(),v=(random()-random())*Math.sin(u*Math.PI);
      bins[2].push("M"+(v*17).toFixed(2)+" "+(-u*122).toFixed(2)+"h.3");
    }
    ["shade","middle","bright","highlight"].forEach((k,i)=>line(flutter,bins[i].join(""),k,[1.2,1.6,2.05,1.80][i],[.72,.85,.88,.82][i]));
    flutter.animate([{offset:0,transform:"scale(.035)",opacity:0},{offset:.12,transform:"scale(.19)",opacity:.7},
      {offset:.44,transform:"scale(.89)",opacity:1},{offset:.66,transform:"scale(1)",opacity:1},
      {offset:.86,transform:"scale(.97,1.02)",opacity:1},{offset:.98,transform:"scale(1)",opacity:1},
      {offset:1,transform:"scale(1)",opacity:0}],{duration,iterations:Infinity});

    })();
  </script>
  <script>
    const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
    pick();
    addEventListener("hashchange", pick);
    const t = new URLSearchParams(location.search).get("t");
    if (t !== null) {
      const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = Number(t) * 1000; });
      freeze();
      addEventListener("load", freeze);
    }
  </script>
</body>
</html>
