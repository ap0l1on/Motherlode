  <style>

<body>
  <svg viewBox="0 0 464 260" role="img" aria-labelledby="art-title description" xmlns="http://www.w3.org/2000/svg">
    <title id="art-title">Prismatic stellar arms</title>
    <desc id="description">A point of white light draws violet, cyan, pink and gold ribbons into a spiral. As the view lowers, colored bands pass across a dense field of stars.</desc>
  </svg>
  <script>
    (() => {

    const drawing = document.querySelector('svg');
    const ns = 'http://www.w3.org/2000/svg';
    function add(tag, attrs={}, parent=drawing) {
      const node=document.createElementNS(ns,tag);

    const defs=add('defs');
    const color=name=>'var(--'+name+')';

    const loop=Number(document.querySelector('[name="motherlode:loop"]').content);

    }

    const glow=add('ellipse',{rx:52,ry:46,fill:halo},centerLight);
    const heart=add('circle',{r:19,fill:starLight},centerLight);
    const lens=add('g',{stroke:color('ice'),fill:'none',style:'mix-blend-mode:screen'},centerLight);
    add('path',{d:'M-64 0H64M0 -43V43',opacity:.24,'stroke-width':.7},lens);
    add('path',{d:'M-20 -22 20 22M-20 24 20 -24',opacity:.5,'stroke-width':.5},lens);
    // Time, arm inner radius, angle, projected height, camera scale, ribbon width, arrival and front focus.
    const view=[
      [0,405,-1.7,.96,1,.6,0,0],[1.6,405,-1.7,.96,1,.6,0,0],[2.35,355,-1.2,1,1,.6,.04,0],

      [12.85,1,3.36,.19,2.02,.4,.12,.76],[13,410,-1.7,.96,1,.6,0,0]];
    const point=(x,y)=>x.toFixed(1)+' '+y.toFixed(1);
    // Control paths describe the five separate ribbons in the upright view.
    const upright=[
      [[236,130],[244,123],[253,134],[244,150],[221,160],[198,167],[169,156],[151,139],[138,121],[132,102],[131,89],[143,73],[159,53],[183,46],[200,42],[215,22],[240,10],[259,12],[281,28],[304,40],[324,38],[348,31],[366,33],[381,52],[399,61],[423,64],[438,82],[457,100],[487,115]],
      [[235,130],[225,125],[214,117],[215,105],[229,96],[247,90],[270,89],[289,94],[309,106],[311,127],[304,146],[304,171],[291,190],[267,205],[249,220],[224,230],[206,236],[176,237],[144,234],[127,225],[105,213],[84,209],[55,212],[39,203],[20,184],[0,177],[-24,164]],
      [[237,131],[229,124],[225,116],[230,105],[246,97],[263,96],[283,101],[300,107],[316,120],[332,137],[350,155],[359,167],[351,182],[341,192],[336,209],[330,229],[323,249],[311,270],[310,285]],
      [[236,131],[248,127],[262,137],[269,148],[261,161],[246,171],[229,187],[212,195],[196,196],[176,190],[155,183],[134,181],[111,164],[94,151],[77,138],[65,116],[57,97],[64,78],[71,54],[83,42],[96,23],[105,-3],[107,-28]],
      [[237,131],[244,140],[232,149],[212,144],[202,135],[195,120],[198,107],[210,97],[222,80],[237,71],[252,71],[266,75],[287,76],[306,73],[324,72],[344,75],[363,82],[378,95],[389,109],[393,130],[384,148],[383,163],[393,182],[397,204],[401,227],[409,255],[427,282]]
    ];
    const closeRibbon=[
      [[-24,90],[18,75],[71,64],[123,57],[177,55],[229,58],[274,65],[307,77],[331,92],[339,108],[337,123],[326,136],[306,143],[279,145],[255,140],[239,130],[234,119],[220,108],[196,99],[163,92],[132,92],[106,96],[88,106],[77,120],[74,137],[82,152],[100,171],[134,188],[176,206],[219,220],[268,230],[323,237],[381,239],[433,232],[488,215]],
      [[-24,77],[22,65],[72,57],[126,52],[177,52],[229,55],[274,62],[310,74],[336,90],[351,106],[352,122],[340,138],[320,147],[293,149],[265,145],[242,133],[235,119],[215,108],[189,98],[158,97],[135,99],[119,106],[109,117],[104,130],[112,145],[133,160],[162,173],[201,184],[242,195],[285,202],[332,207],[376,205],[420,198],[461,184],[501,164]]
    ];
    function spline(nodes,q) {
      const u=Math.min(nodes.length-1-.00001,Math.max(0,q*(nodes.length-1))),i=Math.floor(u),f=u-i;
      const a=nodes[Math.max(0,i-1)],b=nodes[i],c=nodes[i+1],d=nodes[Math.min(i+2,nodes.length-1)];
      return [0,1].map(axis=>.5*((2*b[axis])+(-a[axis]+c[axis])*f+(2*a[axis]-5*b[axis]+4*c[axis]-d[axis])*f*f+(-a[axis]+3*b[axis]-3*c[axis]+d[axis])*f*f*f));
    }
    function silkPoint(nodes,q,width,time,phase) {
      const base=spline(nodes,q),before=spline(nodes,Math.max(0,q-.002)),after=spline(nodes,Math.min(1,q+.002));
      const dx=after[0]-before[0],dy=after[1]-before[1],len=Math.hypot(dx,dy)||1;
      const roll=width*(.79+.22*Math.sin(q*27+phase+time*.66))+.85*Math.sin(q*51+phase+time*.8);
      return [base[0]-dy/len*roll,base[1]+dx/len*roll];
    }

    function spiral(lane,q,side,frame,spread=0) {
      const [,inner,turn,flat,zoom,width,,front]=frame;
      const radius=inner+(344-inner)*Math.pow(q,1.24);
      const wave=Math.min(1,radius/85);
      const ripple=(Math.sin(radius*.062+lane*2.41+turn*.8)*12+Math.sin(radius*.145+lane*1.86-turn*2)*5.9+Math.sin(radius*.027+lane*1.14+turn)*7.3)*wave*(1-front*.81);
      const prominent=(lane===1||lane===2);
      const early=phases[lane]-1.30, late=prominent?(-4.02+(lane-1)*.18):early+.4;
      const angle=early*(1-front)+late*front+(2.87+1.24*front)*Math.log(1+radius/19)+turn;
      const band=(1.24+Math.pow(Math.sin(radius*.038+lane+turn),2)*4.4+q*3.7)*width*(prominent?1+front*1.05:1-front*.3);
      const tip=side*band*(.58+Math.sin(radius*.048+lane+side*1.1+turn*.65)*.34);
      const rad=radius+ripple+tip+spread+(lane===2?11*front:0);
      const localAngle=angle+(.024*Math.sin(radius*.075+lane+turn)+.020*side*Math.sin(radius*.053+lane+turn+side))*wave*(1-front*.7);
      const depth=Math.sin(localAngle)*front*(prominent?8:3);
      const world=[center[0]+Math.cos(localAngle)*rad*zoom,center[1]+(Math.sin(localAngle)*rad*flat+depth)*zoom];
      const time=frame[0],approach=Math.max(0,Math.min(1,(time-3.65)/1.35)),depart=Math.max(0,Math.min(1,(7.77-time)/1.64));
      const hand=approach*depart;
      if(hand===0)return world;
      const native=silkPoint(upright[lane],q,side*(1.4+5.3*Math.sin(q*7+lane)**2)+spread,time,lane),dx=native[0]-center[0],dy=native[1]-center[1];
      const a=(time-5)*.12;
      const target=[center[0]+dx*Math.cos(a)-dy*Math.sin(a),center[1]+(dx*Math.sin(a)+dy*Math.cos(a))*(1-Math.max(0,time-5)*.054)];
      return [world[0]*(1-hand)+target[0]*hand,world[1]*(1-hand)+target[1]*hand];
    }
    function ribbon(lane,side,frame,closeWith=null){
      const total=101, pts=[];
      for(let i=0;i<=total;i++)pts.push(spiral(lane,i/total,side,frame));
      if(closeWith!==null)for(let i=total;i>=0;i--)pts.push(spiral(lane,i/total,closeWith,frame));
      return 'M'+pts.map(p=>point(...p)).join('L')+(closeWith===null?'':'Z');
    }
    function paths(node,fn,opacityFn) {
      const keys=view.map(frame=>[frame[0],{d:'path("'+fn(frame)+'")',opacity:opacityFn(frame)}]);
      animate(node,keys);
    }
    const sky=[[],[],[],[]];
    for(let i=0;i<620;i++){const x=rand()*464,y=rand()*260;sky[i%4].push('M'+point(x,y)+'h.05');}
    sky.forEach((pts,i)=>add('path',{d:pts.join(''),fill:'none',stroke:color(['ice','violet','aqua','gold'][i]),'stroke-width':i===0?1.27:.96,'stroke-linecap':'round',opacity:i===0?.81:.57},backdrop));
    animate(backdrop,[[0,{opacity:.05}],[2,{opacity:.16}],[4,{opacity:.52}],[5,{opacity:.65}],[9,{opacity:.70}],[12.65,{opacity:.81}],[13,{opacity:.05}]]);
    const hot=(f)=>f[6]*Math.max(.055,1-f[7]*1.29);

      const diffuse=add('path',{fill:'none',stroke:color(hue),'stroke-width':20,filter:blurred},strand);
      paths(diffuse,f=>ribbon(lane,-.36,f),f=>hot(f)*.18);
      const bloom=add('path',{fill:'none',stroke:color(hue),'stroke-width':6.1,filter:blurred},strand);
      paths(bloom,f=>ribbon(lane,0,f),f=>hot(f)*.45);
      const cloth=add('path',{fill:colorflow},strand);paths(cloth,f=>ribbon(lane,-1.22,f,1.22),f=>hot(f)*(.28+(lane===1||lane===2?f[7]*.24:.03)));
      const strands=[[-1.85,.82,.71],[-1.1,.79,.87],[-.69,.40,.53],[-.30,.62,.49],[.08,1.05,.76],[.52,.52,.72],[.96,.59,.83],[1.73,.68,.69]];

      }

        const q=rand(),range=5+Math.pow(rand(),1.5)*49,offset=signed()*range;

        paths(star,f=>stars.map(({q,offset,side,phase})=>{const v=spiral(lane,q,side,f,offset+Math.sin(f[2]+phase)*1.5);return 'M'+point(...v)+'h.25'}).join(''),f=>f[6]*[.95,.72,.88,.77][group]);

    }
    const brightSilk=add('g',{},plasma);
    for(let i=0;i<2;i++){
      const hue=i===0?'aqua':'rose',curve=closeRibbon[i],folder=add('g',{},brightSilk);

        const points=[],count=120;

        return 'M'+points.map(v=>point(...v)).join('L')+(other===null?'':'Z');
      }
      add('path',{d:drawBand(0),fill:'none',stroke:color(hue),'stroke-width':10,opacity:.59,filter:blurred},folder);
      add('path',{d:drawBand(-1.13,1.04),fill:color(hue),opacity:.76},folder);

      let grains='';for(let j=0;j<360;j++){const q=rand(),band=(rand()-.5)*(6+20*rand()),p=silkPoint(curve,q,band,0,2);grains+='M'+point(...p)+'h.2';}

    }

    // Pinpoint stars open around the seed before the outer lanes are visible.
    const seedStars=add('g',{transform:'translate(236 130)'});

      const pts=[];for(let i=0;i<58;i++){const a=rand()*tau,r=11+Math.pow(rand(),.64)*75;pts.push('M'+point(Math.cos(a)*r,Math.sin(a)*r*.92)+'h.23');}

    }

    const pulses=[[0,.06],[.5,.18],[1,.35],[1.6,.50],[2.4,.61],[3.7,.61],[4.5,.85],[5,1.22],[6.4,1.18],[8,1.2],[9.8,1.32],[10.7,1.72],[11.8,2.74],[12.7,3.16],[13,.06]];
    for(const [node,factor] of [[glow,1.34],[heart,1],[lens,1.11]]) animate(node,pulses.map(([time,size])=>[time,{transform:'scale('+size*factor+')'}]));

  <script>
