    const located=(scale,rotation=0)=>'translate(286px,190px) rotate('+rotation+'deg) scale('+scale+')';
    map(atmosphere,(time,size)=>({opacity:.45+size*.32}));
    map(chamberPlane,(time,size,surf,beam,rays,orbit,aspect,scale)=>({transform:'translate(286px,190px) rotate('+(time<6?-13+time*2:-2+(time-6)*2.5)+'deg) scale('+(time>7.7&&time<10.3?scale*1.72:scale)+','+aspect*(time>7.7&&time<10.3?scale*1.72:scale)+')',opacity:time<2.1?1:time>10.4?.96:time>7.9?.075:.13}));
    ringSpinners.forEach((node,i)=>animate(node,[[0,{transform:'rotate('+(i*74)+'deg)'}],[loop,{transform:'rotate('+(i*74+(i%2?-360:360))+'deg)'}]]));
    map(swirls,(time,size,surf,beam,rays,orbit)=>({transform:located(.95+size*.18,-7+Math.sin(time*.42)*9),opacity:orbit*.53}));
    orbitLayers.forEach((node,i)=>animate(node,[[0,{transform:'rotate(-9deg)'}],[loop*.48,{transform:'rotate('+(8+i*2.2)+'deg)'}],[loop,{transform:'rotate(-9deg)'}]]));
    map(diskThreads,(time,size,surf,beam,rays,orbit)=>({transform:located(.91+size*.12,-3+Math.sin(time*.5)*6),opacity:orbit}));
    animate(frontSweep,[[0,{opacity:.87,transform:'translate(16px,4px)'}],[.5,{opacity:1,transform:'translate(-10px,-13px)'}],[1.05,{opacity:.65,transform:'translate(-25px,7px)'}],[1.9,{opacity:.13,transform:'translate(-37px,37px)'}],[2.5,{opacity:0}],[14.45,{opacity:0}],[14.8,{opacity:.87,transform:'translate(16px,4px)'}]]);
    animate(outerReflection,[[0,{opacity:0}],[7.8,{opacity:0}],[8.7,{opacity:1}],[10.5,{opacity:.7}],[11.4,{opacity:0}],[loop,{opacity:0}]]);
    map(rayPlane,(time,size,surf,beam,rays)=>({transform:located(.52+size*.62,Math.sin(time*1.12)*2.2),opacity:Math.min(.72,rays*.67)}));
    rayFolders.forEach((node,i)=>animate(node,[[0,{transform:'scale(.96)'}],[2.65,{transform:'scale('+(1.03+i*.011)+')'}],[6.5,{transform:'scale(.99)'}],[8.7,{transform:'scale('+(1.01+i*.009)+')'}],[loop,{transform:'scale(.96)'}]]));
    map(shellHolder,(time,size,surf)=>({transform:located(size*(surf>.75?1.32:1.05),time*7),opacity:surf*.77}));
    map(corona,(time,size,surf)=>({transform:located(size*(surf>.84?1.24:1.18),Math.sin(time*.85)*7),opacity:1}));
    map(scattered,(time,size,surf,beam,rays)=>({transform:located(.55+size*.68,Math.sin(time*.7)*3),opacity:Math.min(1,rays*1.15)}));
    map(surfaceCloud,(time,size,surf)=>({transform:located(size*(surf>.86?1.06:1.20),Math.sin(time*1.13)*8),opacity:.99}));
    map(glare,(time,size,surf)=>({transform:located((.31+size*.82)*(surf>.86?.73:1)),opacity:surf>.86?.43:.66}));
    map(orb,(time,size,surf)=>({transform:located(size*(surf>.86?.91:1.16),Math.sin(time*1.7)*5)}));
    map(jetPlane,(time,size,surf,beam)=>({transform:located(Math.max(.005,beam*(.80+size*.24)),-1+Math.sin(time*.83)*1.7),opacity:Math.min(1,beam*1.45)}));
    map(starCross,(time,size,surf)=>({opacity:time<2||time>10?.6:.18}));


    })();
  </script>
  <script>
    const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
    pick();
    addEventListener("hashchange", pick);
    const t = new URLSearchParams(location.search).get("t");
    if (t !== null) {
      const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = Number(t) * 1000; });
      freeze();
      addEventListener("load", freeze);
    }
  </script>
</body>
