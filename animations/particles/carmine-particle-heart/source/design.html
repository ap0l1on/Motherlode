<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="motherlode:size" content="392x576">
  <meta name="motherlode:scale" content="1">
  <meta name="motherlode:loop" content="6">
  <meta name="motherlode:still" content="0">
  <title>Carmine particle heart</title>
  <style>
:root, [data-colorway="original"] { --background: #050102; --shade: #510e19; --middle: #8b1926; --bright: #be2933; --highlight: #fa4e50; --leaf: #9b2236; }
[data-colorway="light"] { --background: #fcf6f1; --shade: #78253d; --middle: #a13955; --bright: #b85a76; --highlight: #e39394; --leaf: #2a6651; }
[data-colorway="dark"] { --background: #111322; --shade: #6b3f70; --middle: #b75086; --bright: #ea899f; --highlight: #ffcfb6; --leaf: #83ab97; }
[data-colorway="mono"] { --background: #121212; --shade: #505050; --middle: #878787; --bright: #bebebe; --highlight: #f1f1f1; --leaf: #9d9d9d; }
[data-colorway="ocean"] { --background: #071824; --shade: #204e70; --middle: #348eab; --bright: #5bc8d4; --highlight: #c5f1e6; --leaf: #65b5a6; }
[data-colorway="matcha"] { --background: #101c15; --shade: #3e563d; --middle: #71916a; --bright: #b4c989; --highlight: #eaf2c7; --leaf: #91b395; }
[data-colorway="sunset"] { --background: #21101f; --shade: #723355; --middle: #b95161; --bright: #ec825d; --highlight: #ffdd9e; --leaf: #ab9976; }
[data-colorway="iris"] { --background: #121026; --shade: #4b3d76; --middle: #7758bf; --bright: #ac9eff; --highlight: #eee0ff; --leaf: #7ea1b5; }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 392px; height: 576px; overflow: hidden; background: var(--background); }
    svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <svg viewBox="0 0 392 576" role="img" aria-labelledby="art-title description" xmlns="http://www.w3.org/2000/svg">
    <title id="art-title">Carmine particle heart</title>
    <desc id="description">A cloud of carmine sparks turns from a broad heart to a narrow, glowing profile and back.</desc>
  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 6 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    let seed = 491537;
    function random() {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    }

    // Intersect rays with an implicit heart surface. The very shallow depth
    // gives the cloud its thin, bright profile when the lobes turn edge-on.
    const points = [];
    for (let i = 0; i < 4600; i++) {
      const latitude = 2 * random() - 1;
      const theta = random() * 2 * Math.PI;
      const ring = Math.sqrt(1 - latitude * latitude);
      const x = ring * Math.cos(theta), z = ring * Math.sin(theta);
      const bend = Math.cbrt(x * x + 0.085 * z * z) * latitude;
      let low = 0, high = 2;
      for (let step = 0; step < 18; step++) {
        const radius = (low + high) / 2;
        if (radius * radius - 1 > bend * radius ** (5 / 3)) high = radius;
        else low = radius;
      }
      const radius = low * (0.83 + 0.17 * Math.sqrt(random()));
      points.push({x: radius * x, y: radius * latitude, z: radius * z});
    }
    const extent = axis => [
      Math.min(...points.map(p => p[axis])), Math.max(...points.map(p => p[axis]))
    ];
    const [left, right] = extent("x"), [bottom, upperBound] = extent("y");
    const bins = new Map();
    for (const p of points) {
      const height = (upperBound - p.y) / (upperBound - bottom);
      const width = 1 - 0.24 * Math.max(0, (height - 0.47) / 0.53);
      const x = 192 + (48 + (p.x - left) / (right - left) * 288 - 192) * width;
      const cleft = 43 * Math.exp(-(((x - 192) / 25) ** 2)) * Math.max(0, 1 - height / 0.36);
      const y = 186 + height * 262 + cleft;
      const depth = Math.round(p.z * 17);
      const value = Math.min(1, random() + 0.11 * Math.exp(-Math.abs(x - 192) / 14));
      const tone = value < 0.24 ? 0 : value < 0.73 ? 1 : value < 0.955 ? 2 : 3;
      const key = depth + ":" + tone;
      if (!bins.has(key)) bins.set(key, []);
      bins.get(key).push("M" + x.toFixed(2) + " " + y.toFixed(2) + "h0.15");
    }
    for (let i = 0; i < 490; i++) {
      const y = 234 + random() * 213;
      const tail = Math.max(0.12, 1 - (y - 234) / 213);
      const x = 192 + (random() - random()) * (3 + 9 * tail);
      const depth = Math.round((random() - 0.55) * 7);
      const key = depth + ":" + (random() < 0.86 ? 2 : 3);
      if (!bins.has(key)) bins.set(key, []);
      bins.get(key).push("M" + x.toFixed(2) + " " + y.toFixed(2) + "h.14");
    }
    const tones = ["shade", "middle", "bright", "highlight"];
    for (let depth = -24; depth <= 24; depth++) {
      const band = element("g", {});
      for (let tone = 0; tone < tones.length; tone++) {
        const segments = bins.get(depth + ":" + tone);
        if (segments) element("path", {d: segments.join(""), fill: "none",
          stroke: "var(--" + tones[tone] + ")", "stroke-linecap": "round",
          "stroke-width": [1.95, 2.55, 2.7, 3.3][tone],
          opacity: [0.80, 0.93, 0.98, 0.95][tone],
          "vector-effect": "non-scaling-stroke"}, band);
      }
      const poses = [];
      for (let step = 0; step <= 48; step++) {
        const a = step * Math.PI / 24;
        const scale = Math.cos(a), offset = 192 * (1 - scale) + depth * 4.15 * Math.sin(a);
        // A zero determinant would make the edge-on layer non-paintable.
        const visibleScale = Math.abs(scale) < 0.0001 ? 0.0001 : scale;
        poses.push({transform: "matrix(" + visibleScale + ",0,0,1," + offset + ",0)"});
      }
      band.animate(poses, {duration, iterations: Infinity, easing: "linear"});
    }

    })();
  </script>
  <script>
    const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
    pick();
    addEventListener("hashchange", pick);
    const t = new URLSearchParams(location.search).get("t");
    if (t !== null) {
      const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = Number(t) * 1000; });
      freeze();
      addEventListener("load", freeze);
    }
  </script>
</body>
</html>
