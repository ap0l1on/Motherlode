<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="motherlode:size" content="576x574">
  <meta name="motherlode:scale" content="1">
  <meta name="motherlode:loop" content="7.5">
  <meta name="motherlode:still" content="3.5">
  <title>Ruby ribbon heart</title>
  <style>
:root, [data-colorway="original"] { --background: #010002; --shade: #42030c; --middle: #7d0b17; --bright: #ba0e1f; --highlight: #fa2a32; --leaf: #6b0714; }
[data-colorway="light"] { --background: #fcf6f1; --shade: #78253d; --middle: #a13955; --bright: #b85a76; --highlight: #e39394; --leaf: #2a6651; }
[data-colorway="dark"] { --background: #111322; --shade: #6b3f70; --middle: #b75086; --bright: #ea899f; --highlight: #ffcfb6; --leaf: #83ab97; }
[data-colorway="mono"] { --background: #121212; --shade: #505050; --middle: #878787; --bright: #bebebe; --highlight: #f1f1f1; --leaf: #9d9d9d; }
[data-colorway="ocean"] { --background: #071824; --shade: #204e70; --middle: #348eab; --bright: #5bc8d4; --highlight: #c5f1e6; --leaf: #65b5a6; }
[data-colorway="matcha"] { --background: #101c15; --shade: #3e563d; --middle: #71916a; --bright: #b4c989; --highlight: #eaf2c7; --leaf: #91b395; }
[data-colorway="sunset"] { --background: #21101f; --shade: #723355; --middle: #b95161; --bright: #ec825d; --highlight: #ffdd9e; --leaf: #ab9976; }
[data-colorway="iris"] { --background: #121026; --shade: #4b3d76; --middle: #7758bf; --bright: #ac9eff; --highlight: #eee0ff; --leaf: #7ea1b5; }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 576px; height: 574px; overflow: hidden; background: var(--background); }
    svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <svg viewBox="0 0 576 574" role="img" aria-labelledby="art-title description" xmlns="http://www.w3.org/2000/svg">
    <title id="art-title">Ruby ribbon heart</title>
    <desc id="description">A red band of fine particles rolls between a pointed outer heart and its smaller hollow center.</desc>
  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 7.5 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    const tau = 2 * Math.PI;
    let seed = 77216;
    function random() {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    function pointsPath(points, close = false) {
      return points.length ? "M" + points.map(p => p[0].toFixed(2) + " " + p[1].toFixed(2)).join("L") + (close ? "Z" : "") : "";
    }
    function line(parent, data, color, width = 1, opacity = 1) {
      return element("path", {d: data, fill: "none", stroke: "var(--" + color + ")",
        "stroke-width": width, "stroke-linejoin": "round", "stroke-linecap": "round", opacity}, parent);
    }

    const cx=287,cy=269;
    const count=48,sections=Array.from({length:count},()=>[[],[],[]]);
    function outline(a){return [16*Math.sin(a)**3, -(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))];}
    for(let i=0;i<38500;i++){
      const a=tau*random(), [x,y]=outline(a),u=random();
      const width=.30+.10*Math.sin(a)**2;
      const s=1.02-width*u;
      const offset=(1-u)*Math.sin(a*2)*4;
      const px=cx+x*13.45*s+offset+(random()-.5)*1.6, py=cy+y*13.60*s+(random()-.5)*1.2;
      const k=Math.min(count-1,Math.floor(a/tau*count));
      const tone=(u<.095||u>.895)?2:(random()<.38?1:0);
      sections[k][tone].push("M"+px.toFixed(1)+" "+py.toFixed(1)+"h.13");
    }
    for(let k=0;k<14;k++){
      const u=k/13, pts=[];
      for(let i=0;i<=300;i++){
        const a=tau*i/300,[x,y]=outline(a),wide=.30+.10*Math.sin(a)**2,s=1.02-wide*u;
        pts.push([cx+x*13.45*s,cy+y*13.6*s]);
      }
      line(drawing,pointsPath(pts,true),k<2||k>11?"middle":"shade",2.1,k<2||k>11?.37:.22);
    }
    sections.forEach((tonePaths,idx)=>{
      const segment=element("g",{});
      tonePaths.forEach((pts,j)=>line(segment,pts.join(""),["shade","middle","bright"][j],[1.23,1.39,1.73][j],j?.93:.85));
      const samples=Array.from({length:31},(_,i)=>{
        const a=tau*i/30+tau*idx/count;
        return {opacity:.60+.40*(.5+.5*Math.cos(a)),transform:"translate("+3.6*Math.sin(a)+"px,"+1.9*Math.cos(a*2)+"px)"};
      });segment.animate(samples,{duration,iterations:Infinity});
    });

    })();
  </script>
  <script>
    const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
    pick();
    addEventListener("hashchange", pick);
    const t = new URLSearchParams(location.search).get("t");
    if (t !== null) {
      const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = Number(t) * 1000; });
      freeze();
      addEventListener("load", freeze);
    }
  </script>
</body>
</html>
