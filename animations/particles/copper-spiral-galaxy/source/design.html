<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="motherlode:size" content="488x322">
  <meta name="motherlode:scale" content="1">
  <meta name="motherlode:loop" content="8">
  <meta name="motherlode:still" content="1.1">
  <title>Copper spiral galaxy</title>
  <style>
:root, [data-colorway="original"] { --background: #0a080c; --shade: #782b45; --middle: #e35335; --bright: #fc7829; --highlight: #ffbb62; --leaf: #fd91a7; }
[data-colorway="light"] { --background: #fcf6f1; --shade: #78253d; --middle: #a13955; --bright: #b85a76; --highlight: #e39394; --leaf: #2a6651; }
[data-colorway="dark"] { --background: #111322; --shade: #6b3f70; --middle: #b75086; --bright: #ea899f; --highlight: #ffcfb6; --leaf: #83ab97; }
[data-colorway="mono"] { --background: #121212; --shade: #505050; --middle: #878787; --bright: #bebebe; --highlight: #f1f1f1; --leaf: #9d9d9d; }
[data-colorway="ocean"] { --background: #071824; --shade: #204e70; --middle: #348eab; --bright: #5bc8d4; --highlight: #c5f1e6; --leaf: #65b5a6; }
[data-colorway="matcha"] { --background: #101c15; --shade: #3e563d; --middle: #71916a; --bright: #b4c989; --highlight: #eaf2c7; --leaf: #91b395; }
[data-colorway="sunset"] { --background: #21101f; --shade: #723355; --middle: #b95161; --bright: #ec825d; --highlight: #ffdd9e; --leaf: #ab9976; }
[data-colorway="iris"] { --background: #121026; --shade: #4b3d76; --middle: #7758bf; --bright: #ac9eff; --highlight: #eee0ff; --leaf: #7ea1b5; }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 488px; height: 322px; overflow: hidden; background: var(--background); }
    svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <svg viewBox="0 0 488 322" role="img" aria-labelledby="art-title description" xmlns="http://www.w3.org/2000/svg">
    <title id="art-title">Copper spiral galaxy</title>
    <desc id="description">Copper starlight sweeps through curved spiral arms as the view dives toward an incandescent galactic core.</desc>
  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 8 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    let state = 154723;
    function random() {
      state = (Math.imul(1664525, state) + 1013904223) >>> 0;
      return state / 4294967296;
    }
    const normal = () => Math.sqrt(-2 * Math.log(Math.max(0.00001, random()))) *
                         Math.cos(2 * Math.PI * random());
    const colors = ["shade", "middle", "bright", "highlight", "leaf"];
    const stars = colors.map(() => [[], [], []]);
    // Wide, diffuse lanes contain brighter filaments. The field grows redder
    // outside the core and breaks into blush-coloured knots at the arm tips.
    for (let i = 0; i < 48500; i++) {
      const radius = random() < .29 ? .93 * random() ** 1.5 : 1.08 * Math.sqrt(random());
      const arm = Math.floor(random() * 3);
      const scattered = random() < .43;
      const filament = !scattered && random() < .27;
      const theta = (scattered ? random() * 2 * Math.PI :
        arm * 2 * Math.PI / 3 + .44 + 5.6 * radius ** .80 +
        .04 * Math.sin(radius * 15 + arm) + (filament ? .028 : .16) * normal());
      const spread = scattered ? 3.6 + radius * 5.2 : filament ? 1.4 : 3.4 + radius * 11;
      const x = Math.cos(theta) * radius * 206 + normal() * spread;
      const y = Math.sin(theta) * radius * 206 + normal() * spread;
      const brilliance = random();
      const core = (radius < .012 && brilliance > .22) || (radius < .042 && brilliance > .94);
      const flare = radius > .39 && !scattered && brilliance > (filament ? .61 : .88);
      const tone = core ? 3 : flare ? 4 : radius < .28 && brilliance > .32 ? 2 :
        (!scattered && brilliance > .54 || scattered && brilliance > .92) ? 1 : 0;
      const size = brilliance > .990 ? 2 : brilliance > .69 ? 1 : 0;
      stars[tone][size].push("M" + x.toFixed(1) + " " + y.toFixed(1) + "h.03");
    }
    const center = element("g", {transform: "translate(242 163)"});
    const orbit = element("g", {}, center);
    const definitions = element("defs", {});
    function glow(id, stops) {
      const gradient = element("radialGradient", {id}, definitions);
      for (const [offset, color, strength] of stops) {
        element("stop", {offset, "stop-color": "var(--" + color + ")", "stop-opacity": strength}, gradient);
      }
      return "url(#" + id + ")";
    }
    const dust = glow("dust-disk", [[0,"bright",.31], [.14,"middle",.35],
      [.37,"middle",.29], [.57,"shade",.24], [.82,"shade",.13], [1,"shade",0]]);
    element("circle", {r:215, fill:dust}, orbit);
    const coreGlow = glow("core", [[0,"highlight",.60],[.12,"bright",.49],
      [.46,"middle",.29],[1,"middle",0]]);
    element("circle", {r:43,fill:coreGlow}, orbit);
    for (let tone = 0; tone < colors.length; tone++) for (let size = 0; size < 3; size++) {
      if (!stars[tone][size].length) continue;
      element("path", {d: stars[tone][size].join(""), stroke:"var(--" + colors[tone] + ")",
        "stroke-width":[.89,1.42,2.06][size], "stroke-linecap":"round",
        opacity:[.71,.86,.89,.96,.86][tone], fill:"none"}, orbit);
    }

    // In the footage the camera moves in quickly, stays among the stars,
    // dips toward the disk, then eases back to the opening framing.
    const stops = [[0,.65,.92,-.48], [.065,.93,.91,-.38], [.13,1.34,.82,-.24],
      [.205,1.77,.64,-.16], [.31,1.94,.62,-.07], [.56,1.99,.61,.13],
      [.66,2.12,.41,.33], [.73,2.22,.37,.54], [.83,1.52,.80,.68],
      [.925,.83,.95,.11], [1,.65,.92,-.48]];
    const poses = [];
    for (let i = 0; i <= 48; i++) {
      const t = i / 48;
      const b = stops.findIndex(s => s[0] >= t && s[0] !== 0);
      const a = stops[b-1], c = stops[b];
      let f = (t - a[0]) / (c[0] - a[0]);
      f = f*f*(3-2*f);
      const lerp = k => a[k] + (c[k] - a[k])*f;
      const scale=lerp(1), tilt=lerp(2), angle=lerp(3);
      const co = Math.cos(angle), si = Math.sin(angle);
      poses.push({transform: "matrix(" + [scale*co,scale*tilt*si,-scale*si,scale*tilt*co,0,0].join(",") + ")"});
    }
    orbit.animate(poses, {duration, iterations: Infinity, easing: "linear"});
    // Nearby dust moves faster than the disk under perspective. Slightly
    // soft edges keep the larger particles legible during the low fly-by.
    const flecks = [[], [], []];
    for (let i = 0; i < 6400; i++) {
      const x = normal() * 139, y = normal() * 77 + 11;
      if (x * x + y * y < 33 * 33) continue;
      const depth = Math.floor(random() * 3);
      const side = (.34 + random() ** 7 * (depth === 2 ? 2.0 : 1.55)) * (1 + depth * .22);
      flecks[depth].push("M" + x.toFixed(1) + " " + y.toFixed(1) + "h" + side.toFixed(1) +
        "v" + side.toFixed(1) + "h-" + side.toFixed(1) + "Z");
    }
    for (let depth = 0; depth < flecks.length; depth++) {
      const mote = element("path", {d:flecks[depth].join(""), fill:"var(--" + ["middle","shade","leaf"][depth] + ")"},center);
      const flight = stops.map(([offset, magnification, tilt, angle]) => {
        const scale = magnification * (.79 + depth*.09) ** 2;
        const strength = Math.max(0,Math.min(1,(magnification-.82)/1.15));
        const x = (-angle * depth * 7).toFixed(1);
        const y = (strength * depth * 4).toFixed(1);
        return {
          offset,
          transform: `translate(${x}px, ${y}px) rotate(${angle * 34}deg) scale(${scale})`,
          opacity: strength * [.53, .39, .83][depth],
          easing: "ease-in-out"
        };
      });
      mote.animate(flight,{duration,iterations:Infinity});
    }

    })();
  </script>
  <script>
    const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
    pick();
    addEventListener("hashchange", pick);
    const t = new URLSearchParams(location.search).get("t");
    if (t !== null) {
      const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = Number(t) * 1000; });
      freeze();
      addEventListener("load", freeze);
    }
  </script>
</body>
</html>
