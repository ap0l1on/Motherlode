</main><script>
  const stage=document.querySelector('main'), lights=document.querySelector('.sparks'), pointer=document.querySelector('.pointer');
  const cycle=3000, demoTracks=[];
  function track(el,frames) { const a=el.animate(frames,{duration:cycle,iterations:Infinity,fill:'both'}); demoTracks.push(a); }
  const clicks=[[432,114,.055],[469,220,.37],[437,358,.70]];
  for (const [x,y,at] of clicks) {
    const light=document.createElement('i');light.className='spark';light.style.left=x+'px';light.style.top=y+'px';lights.append(light);
    track(light,[{offset:0,opacity:0},{offset:at-.001,opacity:0,transform:'scale(.4)'},{offset:at,opacity:.95,transform:'scale(.45)',easing:'ease-out'},{offset:at+.17,opacity:0,transform:'scale(2.15)'},{offset:1,opacity:0}]);
  }
  const moves=[[0,432,114],[.095,432,114],[.31,469,220],[.37,469,220],[.43,431,231],[.65,437,358],[.79,437,358],[.96,432,114],[1,432,114]];
  track(pointer,moves.map(([offset,x,y])=>({offset,transform:'translate('+x+'px,'+y+'px)',easing:'ease-in-out'})));
  function endDemo(){if(!demoTracks.length)return;demoTracks.splice(0).forEach(a=>a.cancel());pointer.style.display='none';lights.replaceChildren();}
  stage.addEventListener('pointerdown',event=>{
    endDemo();const rect=stage.getBoundingClientRect(),el=document.createElement('i');el.className='spark';el.style.left=(event.clientX-rect.left)+'px';el.style.top=(event.clientY-rect.top)+'px';lights.append(el);
    el.animate([{opacity:.95,transform:'scale(.45)'},{opacity:0,transform:'scale(2.15)'}],{duration:560,easing:'ease-out'}).finished.then(()=>el.remove());
  });
  const form=document.querySelector('form'),heading=form.querySelector('h1'),submit=form.querySelector('.submit'),password=form.querySelector('.password'),change=form.querySelector('.switch'),copy=form.querySelector('.caption span'),message=form.querySelector('.message');
  let mode='login';
  function display(next) { endDemo();mode=next;const reset=next==='reset',signup=next==='signup';heading.textContent=reset?'Reset your password':signup?'Create an account':'Login to Dashboard';submit.textContent=reset?'Reset password':signup?'Sign up':'Login';password.hidden=reset;password.disabled=reset;password.style.display=reset?'none':'';change.textContent=next==='login'?'Sign up':'Login';copy.textContent=next==='login'?'Don’t have an account':'Already have an account?';message.textContent=''; }
  change.addEventListener('click',()=>display(mode==='login'?'signup':'login'));form.querySelector('.reset').addEventListener('click',()=>display('reset'));
