<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="motherlode:size" content="576x317">
  <meta name="motherlode:scale" content="1">
  <meta name="motherlode:loop" content="9">
  <meta name="motherlode:still" content="5.85">
  <title>Inkbone dragon cursor</title>
  <style>
:root, [data-colorway="original"] { --background: #d7d2c5; --shade: #1b191a; --middle: #56514e; --bright: #837a70; --highlight: #a09482; --leaf: #5e5a56; }
[data-colorway="light"] { --background: #fcf6f1; --shade: #78253d; --middle: #a13955; --bright: #b85a76; --highlight: #e39394; --leaf: #2a6651; }
[data-colorway="dark"] { --background: #111322; --shade: #6b3f70; --middle: #b75086; --bright: #ea899f; --highlight: #ffcfb6; --leaf: #83ab97; }
[data-colorway="mono"] { --background: #121212; --shade: #505050; --middle: #878787; --bright: #bebebe; --highlight: #f1f1f1; --leaf: #9d9d9d; }
[data-colorway="ocean"] { --background: #071824; --shade: #204e70; --middle: #348eab; --bright: #5bc8d4; --highlight: #c5f1e6; --leaf: #65b5a6; }
[data-colorway="matcha"] { --background: #101c15; --shade: #3e563d; --middle: #71916a; --bright: #b4c989; --highlight: #eaf2c7; --leaf: #91b395; }
[data-colorway="sunset"] { --background: #21101f; --shade: #723355; --middle: #b95161; --bright: #ec825d; --highlight: #ffdd9e; --leaf: #ab9976; }
[data-colorway="iris"] { --background: #121026; --shade: #4b3d76; --middle: #7758bf; --bright: #ac9eff; --highlight: #eee0ff; --leaf: #7ea1b5; }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 576px; height: 317px; overflow: hidden; background: var(--background); }
    svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <svg viewBox="0 0 576 317" role="img" aria-labelledby="art-title description" xmlns="http://www.w3.org/2000/svg">
    <title id="art-title">Inkbone dragon cursor</title>
    <desc id="description">A long ink dragon follows the pointer on an ivory field. Delicate ribs, paired wing fans and a tapering segmented tail turn through each bend.</desc>
  </svg>
  <script>
    (() => {
    const drawing = document.querySelector("svg");
    const duration = 9 * 1000;

    function element(tag, attributes, parent = drawing) {
      const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
      parent.append(result);
      return result;
    }

    function line(parent, data, color, width = 1, opacity = 1) {
      return element("path", {d: data, fill: "none", stroke: "var(--" + color + ")",
        "stroke-width": width, "stroke-linejoin": "round", "stroke-linecap": "round", opacity}, parent);
    }

    const rig=element("g",{}),width=576,height=317;
    const route=[[.29,.58],[.18,.31],[.59,.24],[.84,.67],[.63,.69],[.26,.43],[.63,.30],[.73,.64],[.29,.58]];
    function sample(t){
      const count=route.length-1,j=((t%1)+1)%1*count,i=Math.floor(j),p=j-i;
      const a=route[(i+count-1)%count],b=route[i],c=route[(i+1)%count],d=route[(i+2)%count];
      return [0,1].map(k=>(k?height:width)*.5*((2*b[k])+(-a[k]+c[k])*p+(2*a[k]-5*b[k]+4*c[k]-d[k])*p*p+(-a[k]+3*b[k]-3*c[k]+d[k])*p*p*p));
    }
    function travel(node,delay){
      const frames=Array.from({length:93},(_,i)=>{
        const t=i/92-delay,p=sample(t),q=sample(t+.002),ang=Math.atan2(q[1]-p[1],q[0]-p[0])*180/Math.PI;
        const co=Math.cos(ang*Math.PI/180),si=Math.sin(ang*Math.PI/180);
        return {transform:"matrix("+[co,si,-si,co,p[0],p[1]].join(",")+")"};
      });
      return node.animate(frames,{duration,iterations:Infinity,easing:"linear"});
    }
    const head=element("g",{},rig);
    element("path",{d:"M13 0L6 -5L2 -8L-6 -8L-13 -11L-9 -5L-13 -2L-4 0L-13 4L-7 4L-9 9L-1 7L3 5L7 5Z",fill:"var(--shade)"},head);
    line(head,"M-4 -3L1 -1L-2 0M1 2L5 2","background",1.35);
    const leader=travel(head,0);
    for(let j=1;j<=54;j++){
      const u=j/54, g=element("g",{},rig);let width=3.3+12.5*(1-u)**1.55;
      line(g,"M-7 0h13","middle",Math.max(.55,1.7*(1-u)));
      const p="M-4 0Q2 0 6 -"+(width*.7)+"L2 -"+width+"Q3 -"+(width*.44)+" -2 -"+(width*.3)+"Z";
      for(const sign of [-1,1]){
        const plate=element("g",{transform:"scale(1 "+sign+")"},g);
        element("path",{d:p,fill:"var(--middle)",opacity:.63},plate);
        line(plate,"M-2 0Q2 -"+(width*.47)+" 3 -"+width,"shade",.73,.94);
      }
      if(j===9||j===18){
        for(const sign of [-1,1]){
          const wing=element("g",{transform:"scale(1 "+sign+")"},g);
          for(let k=0;k<7;k++){
            const angle=.24+k*.127, length=(j===9?1.03:1.14)*(61+4*Math.sin(k)), sr=length*Math.sin(angle), span=length*Math.cos(angle);
            line(wing,"M0 -3Q-"+(sr*.06)+" -"+(span*.79)+" -"+sr+" -"+span,"shade",.75,.73);
            line(wing,"M-3 -3Q-"+(sr*.05)+" -"+(span*.74)+" -"+(sr-3)+" -"+(span-3),"middle",.53,.67);
          }
        }
      }
      travel(g,j*.00427);
    }
    drawing.addEventListener("pointermove",event=>{
      const at=sample((leader.currentTime||0)/duration);
      rig.setAttribute("transform","translate("+(event.offsetX-at[0])+" "+(event.offsetY-at[1])+")");
    });
    drawing.addEventListener("pointerleave",()=>rig.removeAttribute("transform"));

    })();
  </script>
  <script>
    const pick = () => (document.documentElement.dataset.colorway = location.hash.slice(1) || "original");
    pick();
    addEventListener("hashchange", pick);
    const t = new URLSearchParams(location.search).get("t");
    if (t !== null) {
      const freeze = () => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = Number(t) * 1000; });
      freeze();
      addEventListener("load", freeze);
    }
  </script>
</body>
</html>
